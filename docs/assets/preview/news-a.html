<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>News concept A · Cause and effect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Geist+Mono:wght@500&display=swap"><link rel="stylesheet" href="np.css">
<style>
.flow{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1.2fr);align-items:stretch;margin-top:18px}
.ev{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#141416,#0d0d0f)}
.ev .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev h3{margin:0;font-size:20px;line-height:1.25;letter-spacing:-.02em;font-weight:600}
.ev p{margin:0;font-size:13.5px;line-height:1.55;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev .src{margin-top:auto;font-size:12px;color:var(--fg3)}
.link{position:relative;display:grid;place-items:center}
.link::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,rgba(255,122,26,.7),rgba(255,122,26,.25))}
.link i{position:relative;width:34px;height:34px;border-radius:50%;background:#0A0A0B;border:1px solid rgba(255,122,26,.6);display:grid;place-items:center;color:var(--ac);font-style:normal;font-size:15px;box-shadow:0 0 22px rgba(255,122,26,.28)}
.fx{display:grid;gap:8px;align-content:center}
.fi{display:grid;grid-template-columns:auto 1fr auto;column-gap:11px;row-gap:3px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2)}
.fi b{font-size:14px;font-weight:600}.fi .why{grid-column:2/4;font-size:12.5px;line-height:1.5;color:var(--fg2)}
.fi .ic{display:flex;gap:6px;align-items:center;grid-row:1/3}
.none{padding:16px;border-radius:14px;border:1px dashed var(--line2);color:var(--fg3);font-size:13px}
@media(max-width:860px){.flow{grid-template-columns:1fr}.link{height:46px}.link::before{left:50%;right:auto;top:0;bottom:0;width:1px;height:auto;background:linear-gradient(180deg,rgba(255,122,26,.7),rgba(255,122,26,.25))}.ev h3{font-size:18px}}
</style></head><body><div id="h"></div>
<main class="w" style="padding-top:44px"><span class="eb">News</span><h1>News as cause <span>and effect.</span></h1>
<p class="lead">Every story shows what happened, who it touches, which way, and why.</p>
<div class="chips" id="ch"></div><div id="fl"></div></main><div id="f"></div><span class="pv">Concept A · Cause and effect</span>
<script src="np.js"></script><script>
h.innerHTML = HEADER; f.innerHTML = FOOTER; let all = [], cat = 'all';
const row = s => `<article class="flow"><a class="ev" href="${url(s)}"><div class="top">${s.flag ? '<span class="tag">' + ({ breaking: 'Breaking', trending: 'Trending', moving: 'Market moving' }[s.flag]) + '</span>' : ''}<span class="eb">${esc(CL[s.category] || '')}</span></div>
  <h3>${esc(s.headline)}</h3><p>${esc(s.summary)}</p><div class="src m">${sflag(s)} <b>${esc(s.location.place.split(',')[0])}</b> · ${ago(s.published_at)} · ${esc(s.source?.name || '')}</div></a>
  <div class="link"><i>→</i></div>
  <div class="fx">${(s.impacts || []).slice(0, 3).map(i => `<div class="fi"><span class="ic">${icon(i)}</span><b>${esc(i.name)}</b>${arrow(i.direction)}<span class="why">${esc(i.why)}</span></div>`).join('') || '<div class="none">No direct knock-on effects identified for this story.</div>'}</div></article>`;
function draw() { fl.innerHTML = all.filter(s => s.impacts?.length && (cat === 'all' || s.category === cat)).sort(rank).slice(0, 6).map(row).join(''); ch.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === cat)); }
ch.innerHTML = CATS.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join(''); ch.onclick = e => { const b = e.target.closest('button'); if (b) { cat = b.dataset.k; draw(); } };
load().then(s => { all = s; draw(); });
</script></body></html>
