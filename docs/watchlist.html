<main class="wrap" id="main-content" tabindex="-1">
<div class="page-head">
  <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Watchlist</span></div>
  <div class="sec-head" style="margin:0"><div><h1 style="font-size:clamp(26px,3vw,36px)">My watchlist</h1><p class="muted" style="margin:4px 0 0">Assets and whole countries you follow. Saved to your account.</p></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a class="btn btn-ghost" href="globe.html">Add from world map</a><button class="btn btn-primary" type="button" data-search>+ Add asset</button></div></div>
</div>

<section class="sec"><div class="card"><div class="stats-row" id="sum"></div></div></section>
<section class="sec" id="c-sec"><div class="sec-head"><h2>Countries</h2></div><div class="wl-cgrid" id="countries"></div></section>
<section class="sec"><div class="sec-head"><h2>Assets</h2></div><div class="card wl-list" id="assets"></div></section>
<p class="dim" style="font-size:12.5px;margin-top:8px" id="asof"></p>
<script>
const { fmtP, fmtC, cls, logo } = UI, M = MOCK;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2)}%`;
const gval = m => m.t === 'fx' ? m.p.toLocaleString('en-US', { minimumFractionDigits: m.p < 20 ? 4 : 2, maximumFractionDigits: m.p < 20 ? 4 : 2 }) : m.p.toLocaleString('en-US', { maximumFractionDigits: m.p < 1 ? 6 : 2, minimumFractionDigits: 2 }) + (m.u ? ' ' + m.u : '');
const STAR = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
let G = [], asof = null;
fetch('assets/globe/markets.json', { cache: 'no-cache' }).then(r => r.json()).then(j => { G = j.assets || j; asof = j.asof; draw(); }).catch(draw);
const gBy = s => G.find(m => m.s === s);
function draw() {
  const W = window.INVWATCH; if (!W || !W.user) return;
  const items = W.all(), cs = items.filter(x => x.kind === 'country'), as = items.filter(x => x.kind === 'asset');
  // one row per watched asset, with today's numbers from the site feed or the globe feed
  const rows = as.map(x => { if (x.src === 'site') { const a = M.bySym[x.s]; return a && { x, ic: logo(a), n: a.n || a.s, sub: a.s, v: fmtP(a), d: a.d, href: 'asset.html?s=' + encodeURIComponent(a.s) }; }
    const m = gBy(x.s) || x; return { x, ic: `<span class="logo logo-img wl-ic"><img src="assets/logos/${esc(x.lg || 'flags/' + x.cc + '.svg')}" alt=""></span>`, n: m.n, sub: m.k, v: m.p != null ? gval(m) : '—', d: m.d, href: m.site ? 'asset.html?s=' + encodeURIComponent(m.site) : 'globe.html?country=' + encodeURIComponent(m.k) }; }).filter(Boolean);
  const csd = cs.map(c => { const xs = G.filter(m => m.k === c.k), head = xs.find(m => m.g === 'Index') || xs.find(m => m.g === 'Country ETF') || xs.find(m => m.t === 'fx') || xs[0]; return { c, xs, head, up: xs.filter(m => m.d > 0).length, dn: xs.filter(m => m.d < 0).length }; });
  const moves = rows.filter(r => isFinite(r.d)).sort((a, b) => b.d - a.d), best = moves[0], worst = moves[moves.length - 1];
  document.getElementById('sum').innerHTML = [['Assets', rows.length], ['Countries', cs.length], ['Up today', `<i style="font-style:normal" class="up">${moves.filter(r => r.d > 0).length}</i>`], ['Down today', `<i style="font-style:normal" class="down">${moves.filter(r => r.d < 0).length}</i>`], ['Best today', best ? `<i style="font-style:normal" class="${cls(best.d)}">${esc(best.n)} ${pct(best.d)}</i>` : '—'], ['Worst today', worst ? `<i style="font-style:normal" class="${cls(worst.d)}">${esc(worst.n)} ${pct(worst.d)}</i>` : '—']].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  document.getElementById('c-sec').hidden = !cs.length;
  document.getElementById('countries').innerHTML = csd.map(({ c, xs, head, up, dn }) => `<a class="card wl-country" href="globe.html?country=${encodeURIComponent(c.k)}">
      <div class="wl-ch"><span class="logo logo-img wl-ic"><img src="assets/logos/flags/${esc(c.cc)}.svg" alt=""></span><span><b>${esc(c.k)}</b><small>${esc(c.r || '')}</small></span><button class="wl-x" type="button" data-c="${esc(c.k)}" aria-label="Remove ${esc(c.k)} from your watchlist" title="Remove">${STAR}</button></div>
      ${head ? `<div class="wl-head"><span>${esc(head.n)}</span><b class="num">${gval(head)}</b><i class="num ${cls(head.d)}">${pct(head.d)}</i></div>` : ''}
      <div class="wl-ud"><span class="up">${up} up</span><span class="down">${dn} down</span><span class="dim">${xs.length} assets</span></div></a>`).join('');
  document.getElementById('assets').innerHTML = rows.length ? rows.map(r => `<a class="wl-row" href="${r.href}">${r.ic}<span class="wl-n"><b>${esc(r.n)}</b><small>${esc(r.sub)}</small></span><span class="num wl-v">${r.v}</span><span class="num wl-d ${cls(r.d)}">${isFinite(r.d) ? pct(r.d) : ''}</span><button class="wl-x" type="button" data-a="${esc(r.x.src + ':' + r.x.s)}" aria-label="Remove ${esc(r.n)} from your watchlist" title="Remove">${STAR}</button></a>`).join('')
    : '<div class="wl-empty"><b>Nothing here yet</b><p class="muted">Tap the star on any asset, or on a country on the world map, to follow it here.</p><a class="btn btn-primary btn-sm" href="globe.html">Open world map</a></div>';
  document.getElementById('asof').textContent = asof ? 'World map prices updated ' + new Date(asof).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '. Not investment advice.' : 'Not investment advice.';
}
document.addEventListener('click', e => { const b = e.target.closest('.wl-x'); if (!b) return; e.preventDefault(); e.stopPropagation();
  if (b.dataset.c) { const c = INVWATCH.all().find(x => x.kind === 'country' && x.k === b.dataset.c); c && INVWATCH.toggle(c); }
  else { const a = INVWATCH.all().find(x => x.kind === 'asset' && (x.src || 'site') + ':' + x.s === b.dataset.a); a && INVWATCH.toggle(a); } });
INVWATCH.on(draw); draw();
</script>
