<main class="wrap">
<link rel="stylesheet" href="assets/home-news.css">
<link rel="stylesheet" href="assets/news-page.css">
<div class="np">
  <header class="np-head">
    <div><h1>News</h1><p>The stories moving markets, with the context behind them.</p></div>
    <p class="np-updated" id="np-updated">Loading the latest feed…</p>
  </header>

  <div class="np-filters">
    <div class="np-categories" role="group" aria-label="News category" id="np-categories">
      <button type="button" data-category="all" aria-pressed="true">All</button>
      <button type="button" data-category="markets" aria-pressed="false">Markets</button>
      <button type="button" data-category="companies" aria-pressed="false">Companies</button>
      <button type="button" data-category="economy" aria-pressed="false">Economy</button>
      <button type="button" data-category="technology" aria-pressed="false">Technology</button>
      <button type="button" data-category="crypto" aria-pressed="false">Crypto</button>
      <button type="button" data-category="commodities" aria-pressed="false">Commodities</button>
      <button type="button" data-category="geopolitics" aria-pressed="false">Geopolitics</button>
    </div>
    <label class="np-region"><span>Region</span>
      <select id="np-region" aria-label="News region" data-native>
        <option value="all">All regions</option>
        <option value="na">North America</option>
        <option value="eu">Europe</option>
        <option value="asia">Asia</option>
        <option value="me">Middle East</option>
        <option value="af">Africa</option>
        <option value="latam">Latin America</option>
        <option value="oc">Oceania</option>
      </select>
    </label>
  </div>

  <p class="np-status" id="np-status" role="status" aria-live="polite">Loading stories…</p>
  <div id="np-content" aria-busy="true">
    <section aria-label="Lead story" id="np-lead"></section>
    <section class="np-latest" id="np-latest" aria-labelledby="np-latest-title" hidden>
      <div class="np-section-head"><h2 id="np-latest-title">Latest stories</h2><span id="np-count"></span></div>
      <div class="np-grid" id="np-grid"></div>
      <div class="np-pagination"><p id="np-showing"></p><button type="button" class="np-more" id="np-more" hidden>Load more stories</button></div>
    </section>
  </div>
  <div class="np-message" id="np-message" hidden><h2 id="np-message-title"></h2><p id="np-message-text"></p><button type="button" class="np-more" id="np-action"></button></div>
  <noscript><p class="np-message">Enable JavaScript to load and filter the live stories, or <a href="assets/globe/news.html">open the news globe</a>.</p></noscript>
  <p class="np-disclosure">Summaries are written with the help of AI from each source's own reporting. Every story links to its source. Not investment advice.</p>
</div>
