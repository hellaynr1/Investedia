<main class="wrap" id="main-content" tabindex="-1">
<div class="page-head">
  <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Tools</span><span>/</span><span>Comparison</span></div>
  <div class="sec-head" style="margin:0"><div><h1 id="title">Stock comparison</h1><p class="lede">Put up to four assets side by side and see how they really stack up.</p></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="demo" data-asof>Delayed data</span><div class="tabs" id="type"><button class="tab" data-tab="stocks" aria-selected="true">Stocks</button><button class="tab" data-tab="funds">Funds</button></div></div></div>
</div>

<div class="card card-pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
  <div id="picked" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <select class="select" id="add" style="width:auto;height:36px" aria-label="Add to comparison"></select>
</div>

<section class="sec">
  <div class="card"><div class="card-head"><h3>Performance</h3><div class="range" id="rng"><button aria-pressed="false">1M</button><button aria-pressed="false">6M</button><button aria-pressed="true">1Y</button><button aria-pressed="false">5Y</button></div></div>
    <div style="padding:12px 12px 4px 18px"><div class="chart" id="multi" style="height:320px"></div></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;padding:0 18px 16px;font-size:13px" id="legend"></div></div>
</section>

<section class="sec">
  <div class="card"><div class="tbl-wrap"><table class="tbl" id="cmp-t"></table></div></div>
</section>
<section class="sec" data-newsletter></section>
<script>
const { icon, fmtP, fmtC, cls, cap, logo, href, tabs } = UI, M = MOCK;
const COLORS = [UI.acc(), '#38BDF8', '#A78BFA', '#F472B6'];
let type = new URLSearchParams(location.search).get('type') === 'funds' ? 'funds' : 'stocks';
let picked = type === 'funds' ? ['VOO', 'QQQ', 'SCHD'] : ['AAPL', 'MSFT', 'NVDA'], range = '1Y';
const R = { '1M': [30, .2], '6M': [126, 1], '1Y': [252, 1.6], '5Y': [260, 6] };
function draw() {
  const el = document.getElementById('multi'), W = el.clientWidth, H = 320, pL = 8, pR = 60, pT = 10, pB = 26, [n, k] = R[range];
  const lines = picked.map(s => { const a = M.bySym[s]; const v = M.series(s + 'cmp' + range, n, 100, (18 + a.w * 3) * k * .6, .014); return v.map(x => (x / v[0] - 1) * 100); });
  let mn = Math.min(0, ...lines.flat()), mx = Math.max(...lines.flat()); const pad = (mx - mn) * .1; mn -= pad; mx += pad;
  const sx = i => pL + i / (n - 1) * (W - pL - pR), sy = v => pT + (1 - (v - mn) / (mx - mn)) * (H - pT - pB);
  const grid = Array.from({ length: 5 }, (_, i) => mn + (mx - mn) * i / 4).map(v => `<line class="grid-l" x1="${pL}" x2="${W - pR}" y1="${sy(v)}" y2="${sy(v)}"/><text class="ax" x="${W - pR + 10}" y="${sy(v) + 4}">${v > 0 ? '+' : ''}${v.toFixed(0)}%</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Performance comparison">${grid}<line x1="${pL}" x2="${W - pR}" y1="${sy(0)}" y2="${sy(0)}" stroke="#52525b" stroke-dasharray="3 3"/>${lines.map((l, j) => `<path d="${l.map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(v).toFixed(1)).join('')}" fill="none" stroke="${COLORS[j]}" stroke-width="2"/>`).join('')}</svg>`;
  document.getElementById('legend').innerHTML = picked.map((s, j) => { const end = lines[j][n - 1]; return `<span style="display:inline-flex;gap:8px;align-items:center"><i style="width:12px;height:3px;border-radius:2px;background:${COLORS[j]}"></i><b style="font-weight:600">${s}</b><span class="num ${cls(end)}">${fmtC(end)}</span></span>`; }).join('');
}
function table() {
  const as = picked.map(s => M.bySym[s]);
  const rows = type === 'funds'
    ? [['Price', a => fmtP(a)], ['Today', a => `<span class="${cls(a.d)}">${fmtC(a.d)}</span>`], ['1 week', a => `<span class="${cls(a.w)}">${fmtC(a.w)}</span>`], ['Assets (AUM)', a => a.aum], ['Expense ratio', a => a.fee], ['Type', a => a.kind || 'ETF'], ['Exchange', a => a.x]]
    : [['Price', a => fmtP(a)], ['Today', a => `<span class="${cls(a.d)}">${fmtC(a.d)}</span>`], ['1 week', a => `<span class="${cls(a.w)}">${fmtC(a.w)}</span>`], ['Market cap', a => cap(a.m)], ['P/E', a => a.pe ? a.pe.toFixed(1) : '—'], ['Revenue growth', a => `<span class="${cls(a.g)}">${fmtC(a.g)}</span>`], ['Dividend yield', a => a.div ? a.div.toFixed(1) + '%' : '—'], ['Sector', a => a.sector], ['Country', a => a.country]];
  document.getElementById('cmp-t').innerHTML = `<thead><tr><th>Metric</th>${as.map((a, j) => `<th><a class="ident" href="${href(a)}" style="justify-content:flex-end"><i style="width:8px;height:8px;border-radius:50%;background:${COLORS[j]}"></i>${logo(a)}<b style="color:var(--fg)">${a.s}</b></a></th>`).join('')}</tr></thead><tbody>${rows.map(([n, f]) => `<tr><td class="muted">${n}</td>${as.map(a => `<td class="num">${f(a)}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
function picker() {
  document.getElementById('title').textContent = type === 'funds' ? 'Fund comparison' : 'Stock comparison';
  document.getElementById('picked').innerHTML = picked.map((s, j) => `<span class="chip on" style="border-color:${COLORS[j]};background:transparent"><i style="width:8px;height:8px;border-radius:50%;background:${COLORS[j]}"></i><b style="color:var(--fg)">${s}</b><button type="button" data-rm="${s}" aria-label="Remove ${s}" style="background:none;border:0;color:var(--fg-3);padding:0 0 0 4px">×</button></span>`).join('');
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (picked.length > 1) { picked = picked.filter(x => x !== b.dataset.rm); update(); } });
  const add = document.getElementById('add');
  add.innerHTML = `<option value="">${picked.length >= 4 ? 'Maximum of 4' : '+ Add ' + (type === 'funds' ? 'fund' : 'stock')}</option>` + M.assets.filter(a => a.c === type && !picked.includes(a.s)).map(a => `<option value="${a.s}">${a.s} · ${a.n}</option>`).join('');
  add.disabled = picked.length >= 4;
}
function update() { picker(); draw(); table(); }
document.getElementById('add').onchange = e => { if (e.target.value) { picked.push(e.target.value); update(); } };
document.querySelectorAll('#rng button').forEach(b => b.onclick = () => { document.querySelectorAll('#rng button').forEach(x => x.setAttribute('aria-pressed', x === b)); range = b.textContent; draw(); });
tabs(document.getElementById('type'), t => { type = t; picked = t === 'funds' ? ['VOO', 'QQQ', 'SCHD'] : ['AAPL', 'MSFT', 'NVDA']; update(); });
if (type === 'funds') document.querySelector('#type [data-tab=funds]').setAttribute('aria-selected', 'true'), document.querySelector('#type [data-tab=stocks]').setAttribute('aria-selected', 'false');
update();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(draw, 80); }).observe(document.getElementById('multi'));
</script>
