<main class="wrap" id="main-content" tabindex="-1">
<div class="page-head">
  <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Tools</span><span>/</span><span>Stock screener</span></div>
  <div class="sec-head" style="margin:0"><div><h1>Stock screener</h1><p class="lede">Narrow thousands of stocks down to the few worth a closer look.</p></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="demo" data-asof>Delayed data</span><button class="btn btn-ghost" type="button" id="save">Save screen</button><button class="btn btn-primary" type="button" id="export">Export CSV</button></div></div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
  <div class="ask" style="flex:1 1 320px;padding:2px 6px 2px 14px;border-radius:10px"><span class="dim" data-icon="search"></span><input id="q" placeholder="Search by company or ticker…" aria-label="Search stocks" style="height:38px;font-size:14px"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap" id="presets"></div>
</div>

<div class="screener" id="layout">
  <aside class="card" id="filters">
    <div class="card-head"><h3>Filters <span class="tag acc" id="fcount" hidden></span></h3><button class="link" type="button" style="background:none;border:0" id="reset">Clear filters</button></div>
    <div class="card-pad" style="display:grid;gap:18px">
      <div class="field"><label for="f-region">Region</label><select class="select" id="f-region"><option value="">All regions</option></select></div>
      <div class="field"><label for="f-country">Country</label><select class="select" id="f-country"><option value="">All countries</option></select></div>
      <div class="field"><label for="f-sector">Sector</label><select class="select" id="f-sector"><option value="">All sectors</option></select></div>
      <div class="field"><label>Market cap</label><div class="seg" id="f-cap"><button type="button" data-v="0" class="on">Any</button><button type="button" data-v="200">Mega</button><button type="button" data-v="10">Large+</button><button type="button" data-v="2">Mid+</button></div></div>
      <div class="field"><label>Price ($)</label><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center"><input class="input num" id="f-pmin" type="number" placeholder="Min" min="0"><span class="dim">–</span><input class="input num" id="f-pmax" type="number" placeholder="Max" min="0"></div></div>
      <div class="field"><label>Change today</label><div class="seg" id="f-mv"><button type="button" data-v="any" class="on">Any</button><button type="button" data-v="up">Up</button><button type="button" data-v="down">Down</button><button type="button" data-v="big">±3%+</button></div></div>
      <div class="field"><label for="f-pe">Max P/E · <span class="num" id="pe-v">Any</span></label><input type="range" id="f-pe" min="5" max="100" value="100"></div>
      <div class="field"><label for="f-g">Min revenue growth · <span class="num" id="g-v">Any</span></label><input type="range" id="f-g" min="-30" max="40" value="-30"></div>
      <div class="field"><label for="f-div">Min dividend yield · <span class="num" id="div-v">Any</span></label><input type="range" id="f-div" min="0" max="6" step="0.5" value="0"></div>
    </div>
  </aside>
  <div class="card" style="min-width:0">
    <div class="card-head" style="flex-wrap:wrap"><div class="tabs" id="views"><button class="tab" data-tab="overview" aria-selected="true">Overview</button><button class="tab" data-tab="perf">Performance</button><button class="tab" data-tab="val">Valuation</button><button class="tab" data-tab="div">Dividends</button></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="meta" id="count"></span><select class="select" id="sort" style="height:32px;width:auto;font-size:13px" aria-label="Sort by"><option value="m">Sort: Market cap</option><option value="d">Sort: Change today</option><option value="p">Sort: Price</option><option value="pe">Sort: P/E</option><option value="g">Sort: Revenue growth</option><option value="div">Sort: Dividend yield</option></select></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <div class="pager"><span class="dim" id="range-l"></span><div style="display:flex;gap:4px" id="pages"></div></div>
  </div>
</div>
<section class="sec" style="margin-top:44px" data-newsletter></section>
<script>
const { icon, fmtP, fmtC, cls, cap, logo, href, spark, colorFor, tabs } = UI, M = MOCK;
const base = M.assets.filter(a => a.c === 'stocks').map(a => ({ ...a, ytd: +(a.w * 4.3 + a.d * 3 + 6).toFixed(1), y1: +(a.w * 6 + 12).toFixed(1), ps: +(a.pe ? a.pe / 3.4 : 6).toFixed(1), hi: a.w > 3, lo: a.w < -3 }));
const countries = { US: 'United States', CA: 'Canada', BR: 'Brazil', AR: 'Argentina', UK: 'United Kingdom', FR: 'France', DE: 'Germany', NL: 'Netherlands', DK: 'Denmark', JP: 'Japan', CN: 'China', TW: 'Taiwan', CH: 'Switzerland', ES: 'Spain', IT: 'Italy', KR: 'South Korea', IN: 'India', SG: 'Singapore', MX: 'Mexico', AU: 'Australia', NZ: 'New Zealand', ZA: 'South Africa', EG: 'Egypt', SA: 'Saudi Arabia', QA: 'Qatar', AE: 'United Arab Emirates', IL: 'Israel' };
M.REGIONS.filter(r => base.some(a => a.region === r)).forEach(r => document.getElementById('f-region').add(new Option(r, r)));
const fillCountries = () => { const sel = document.getElementById('f-country'), cur = sel.value; sel.length = 1; [...new Set(base.filter(a => !st.region || a.region === st.region).map(a => a.country))].sort((x, y) => (countries[x] || x).localeCompare(countries[y] || y)).forEach(c => sel.add(new Option(countries[c] || c, c))); sel.value = [...sel.options].some(o => o.value === cur) ? cur : ''; st.country = sel.value; };
[...new Set(base.map(a => a.sector))].sort().forEach(s => document.getElementById('f-sector').add(new Option(s, s)));
const PRE = { all: ['All stocks', {}], undervalued: ['Undervalued', { pe: 18 }], overvalued: ['Overvalued', { peMin: 50 }], highs: ['52-week highs', { flag: 'hi' }], lows: ['52-week lows', { flag: 'lo' }], banks: ['Top bank stocks', { sector: 'Finance' }], renewable: ['Renewable energy', { sector: 'Utilities' }], dividend: ['Dividend payers', { div: 2 }] };
const st = { q: '', region: '', country: '', sector: '', cap: 0, pmin: null, pmax: null, mv: 'any', pe: 100, g: -30, div: 0, peMin: 0, flag: '', view: 'overview', sort: 'm', dir: -1, page: 1, preset: 'all' };
const PER = 10;
const V = {
  overview: [['p', 'Price'], ['d', 'Change'], ['m', 'Market cap'], ['vol', 'Volume'], ['sector', 'Sector'], ['country', 'Country'], ['spark', '1 month']],
  perf: [['d', '1D'], ['w', '1W'], ['ytd', 'YTD'], ['y1', '1Y'], ['spark', '1 month']],
  val: [['p', 'Price'], ['pe', 'P/E'], ['ps', 'P/S'], ['g', 'Revenue growth'], ['m', 'Market cap']],
  div: [['p', 'Price'], ['div', 'Dividend yield'], ['pe', 'P/E'], ['m', 'Market cap']],
};
function cell(a, k) {
  if (k === 'p') return `<td class="num" data-lp="${a.s}">${fmtP(a)}</td>`;
  if (k === 'd') return `<td><span class="pill ${cls(a.d)}">${fmtC(a.d)}</span></td>`;
  if (['w', 'ytd', 'y1', 'g'].includes(k)) return `<td class="num ${cls(a[k])}">${fmtC(a[k])}</td>`;
  if (k === 'm') return `<td class="num">${cap(a.m)}</td>`;
  if (k === 'pe' || k === 'ps') return `<td class="num muted">${a[k] ? a[k].toFixed(1) : '—'}</td>`;
  if (k === 'div') return `<td class="num ${a.div ? '' : 'dim'}">${a.div ? a.div.toFixed(1) + '%' : '—'}</td>`;
  if (k === 'spark') return `<td>${spark(a.spark, colorFor(a.w))}</td>`;
  if (k === 'country') return `<td class="muted">${a.country}</td>`;
  return `<td class="muted">${a[k] ?? '—'}</td>`;
}
function filtered() {
  const q = st.q.toLowerCase();
  return base.filter(a => (!q || a.s.toLowerCase().includes(q) || a.n.toLowerCase().includes(q)) && (!st.region || a.region === st.region) && (!st.country || a.country === st.country) && (!st.sector || a.sector === st.sector) && a.m >= st.cap && (st.pmin == null || a.p >= st.pmin) && (st.pmax == null || a.p <= st.pmax)
    && (st.mv === 'any' || (st.mv === 'up' ? a.d > 0 : st.mv === 'down' ? a.d < 0 : Math.abs(a.d) >= 3)) && (st.pe >= 100 || (a.pe && a.pe <= st.pe)) && (!st.peMin || (a.pe && a.pe >= st.peMin)) && a.g >= st.g && (a.div || 0) >= st.div && (!st.flag || a[st.flag]));
}
function render() {
  const rows = filtered(), k = st.sort;
  rows.sort((x, y) => (typeof x[k] === 'string' ? x[k].localeCompare(y[k]) : (x[k] ?? -1e9) - (y[k] ?? -1e9)) * st.dir);
  const pages = Math.max(1, Math.ceil(rows.length / PER)); st.page = Math.min(st.page, pages);
  const slice = rows.slice((st.page - 1) * PER, st.page * PER);
  document.getElementById('th').innerHTML = `<tr><th class="sortable" data-k="s">Company</th>${V[st.view].map(([c, t]) => `<th class="${c === 'spark' ? '' : 'sortable'}" data-k="${c}" ${st.sort === c ? `aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${t}${st.sort === c ? icon(st.dir > 0 ? 'up' : 'down') : ''}</th>`).join('')}<th style="width:40px"></th></tr>`;
  document.getElementById('tb').innerHTML = slice.length ? slice.map(a => `<tr data-href="${href(a)}"><td><a class="ident" href="${href(a)}">${logo(a)}<span><b>${a.s}</b><small>${a.n}</small></span></a></td>${V[st.view].map(([c]) => cell(a, c)).join('')}<td><button class="star" type="button" aria-label="Watch ${a.s}">${icon('star')}</button></td></tr>`).join('') : `<tr><td colspan="9" class="l muted" style="padding:48px;text-align:center;white-space:normal">No stocks match these filters.<br><button class="btn btn-ghost btn-sm" type="button" style="margin-top:12px" onclick="document.getElementById('reset').click()">Clear filters</button></td></tr>`;
  document.getElementById('count').textContent = `${rows.length} of ${base.length} stocks`;
  document.getElementById('range-l').textContent = rows.length ? `Showing ${(st.page - 1) * PER + 1}–${Math.min(st.page * PER, rows.length)} of ${rows.length}` : 'No results';
  document.getElementById('pages').innerHTML = `<button type="button" data-p="${st.page - 1}" ${st.page === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>` + Array.from({ length: pages }, (_, i) => i + 1).filter(n => n === 1 || n === pages || Math.abs(n - st.page) <= 1).map((n, i, arr) => (i && n - arr[i - 1] > 1 ? '<span class="dim" style="padding:0 4px;align-self:center">…</span>' : '') + `<button type="button" data-p="${n}" ${n === st.page ? 'aria-current="page"' : ''}>${n}</button>`).join('') + `<button type="button" data-p="${st.page + 1}" ${st.page === pages ? 'disabled' : ''} aria-label="Next page">›</button>`;
  document.querySelectorAll('#pages button').forEach(b => b.onclick = () => { st.page = +b.dataset.p; render(); });
  document.querySelectorAll('#th .sortable').forEach(th => th.onclick = () => { st.dir = st.sort === th.dataset.k ? -st.dir : -1; st.sort = th.dataset.k; document.getElementById('sort').value = st.sort; render(); });
  const n = ['region', 'country', 'sector', 'flag'].filter(k => st[k]).length + (st.cap ? 1 : 0) + (st.pmin != null || st.pmax != null ? 1 : 0) + (st.mv !== 'any') + (st.pe < 100) + (st.g > -30) + (st.div > 0) + (st.peMin > 0);
  const fc = document.getElementById('fcount'); fc.hidden = !n; fc.textContent = n;
}
const set = (k, v) => { st[k] = v; st.page = 1; render(); };
document.getElementById('q').oninput = e => set('q', e.target.value.trim());
document.getElementById('f-region').onchange = e => { st.region = e.target.value; fillCountries(); set('region', st.region); };
document.getElementById('f-country').onchange = e => set('country', e.target.value);
document.getElementById('f-sector').onchange = e => set('sector', e.target.value);
document.getElementById('f-pmin').oninput = e => set('pmin', e.target.value === '' ? null : +e.target.value);
document.getElementById('f-pmax').oninput = e => set('pmax', e.target.value === '' ? null : +e.target.value);
const rng = (id, k, lab, fmt, any) => document.getElementById(id).oninput = e => { const v = +e.target.value; document.getElementById(lab).textContent = v === any ? 'Any' : fmt(v); set(k, v); };
rng('f-pe', 'pe', 'pe-v', v => v + '×', 100); rng('f-g', 'g', 'g-v', v => (v > 0 ? '+' : '') + v + '%', -30); rng('f-div', 'div', 'div-v', v => v + '%', 0);
const seg = (id, k, num) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b)); set(k, num ? +b.dataset.v : b.dataset.v); });
seg('f-cap', 'cap', true); seg('f-mv', 'mv');
document.getElementById('sort').onchange = e => { st.sort = e.target.value; st.dir = -1; render(); };
function reset(noRender) {
  Object.assign(st, { q: '', region: '', country: '', sector: '', cap: 0, pmin: null, pmax: null, mv: 'any', pe: 100, g: -30, div: 0, peMin: 0, flag: '', page: 1, preset: 'all' });
  ['q', 'f-pmin', 'f-pmax'].forEach(id => document.getElementById(id).value = ''); ['f-region', 'f-country', 'f-sector'].forEach(id => document.getElementById(id).value = ''); fillCountries();
  document.getElementById('f-pe').value = 100; document.getElementById('f-g').value = -30; document.getElementById('f-div').value = 0;
  ['pe-v', 'g-v', 'div-v'].forEach(id => document.getElementById(id).textContent = 'Any');
  ['f-cap', 'f-mv'].forEach(id => document.querySelectorAll(`#${id} button`).forEach((x, i) => x.classList.toggle('on', i === 0)));
  document.querySelectorAll('#presets .chip').forEach(x => x.classList.toggle('on', x.dataset.p === 'all'));
  if (!noRender) render();
}
document.getElementById('reset').onclick = () => reset();
function preset(p) {
  reset(true); const cfg = PRE[p][1]; st.preset = p;
  if (cfg.pe) { st.pe = cfg.pe; document.getElementById('f-pe').value = cfg.pe; document.getElementById('pe-v').textContent = cfg.pe + '×'; }
  if (cfg.sector) { st.sector = cfg.sector; document.getElementById('f-sector').value = cfg.sector; }
  if (cfg.div) { st.div = cfg.div; document.getElementById('f-div').value = cfg.div; document.getElementById('div-v').textContent = cfg.div + '%'; st.view = 'div'; document.querySelector('#views [data-tab=div]').click(); }
  st.peMin = cfg.peMin || 0; st.flag = cfg.flag || '';
  document.querySelectorAll('#presets .chip').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  render();
}
document.getElementById('presets').innerHTML = Object.entries(PRE).map(([k, [t]]) => `<button class="chip ${k === 'all' ? 'on' : ''}" type="button" data-p="${k}">${t}</button>`).join('');
document.querySelectorAll('#presets .chip').forEach(b => b.onclick = () => preset(b.dataset.p));
tabs(document.getElementById('views'), v => { st.view = v; render(); });
document.getElementById('save').onclick = e => e.currentTarget.textContent = 'Saved ✓';
document.getElementById('export').onclick = e => e.currentTarget.textContent = 'Export ready (demo)';
fillCountries();
const qp = new URLSearchParams(location.search).get('preset');
const qr = (new URLSearchParams(location.search).get('region') || '').toLowerCase(), qreg = M.REGIONS.find(r => r.toLowerCase().replace(/\s+/g, '-') === qr);
if (qreg) { document.getElementById('f-region').value = qreg; st.region = qreg; fillCountries(); }
if (qp && PRE[qp]) { preset(qp); if (qreg) { document.getElementById('f-region').value = qreg; st.region = qreg; fillCountries(); render(); } } else render();
</script>
</main>
