name = "investedia-live"
main = "index.js"
compatibility_date = "2026-10-01"

# Prices for stocks, indices, commodities and currencies: a cron job saves ONE combined snapshot in KV (unchanged snapshots are skipped), /v1/prices serves it.
# KV is created automatically on the first deploy.
[[kv_namespaces]]
binding = "PRICES"

[triggers]
# Prices every 2 minutes. The news cron (every 5 minutes) is OFF: the benchmark showed the news job can exceed the free plan's 10 ms CPU limit
# (see README). To try it anyway: add "*/5 * * * *" to crons and set NEWS_CRON = "on" under [vars].
crons = ["*/2 * * * *", "*/5 * * * *"]  # */5: alarm clock for the GitHub robots (dispatch); the news job itself stays off unless NEWS_CRON = "on"

# Free plan limits: 10 ms CPU and 50 subrequests per invocation, 1000 KV writes a day. v1/prices.js stays inside them (about 15 calls per run).
[observability]
enabled = true

# After deploying, add a custom domain in the Cloudflare dashboard: Workers & Pages > investedia-live > Settings > Domains & Routes > Add > Custom domain: live.investedia.com

[vars]
PRO_ENABLED = "false"   # Investedia Pro routes stay hidden until approved; live Stripe keys also need PRO_LIVE = "true"
NEWS_CRON = "off"

# ---- Pro TEST-MODE sandbox: a SEPARATE Worker (investedia-live-sandbox). Deployed only by the manual workflow
# .github/workflows/pro-sandbox.yml with `wrangler deploy --env sandbox`. No crons, no KV (it cannot touch production prices or
# calls), test-mode Stripe keys only (live keys are refused in code). Secrets are set on THIS worker only.
[env.sandbox]
name = "investedia-live-sandbox"
workers_dev = true

[env.sandbox.triggers]
crons = []

[env.sandbox.vars]
PRO_ENABLED = "true"
NEWS_CRON = "off"
SITE_URL = "https://investedia.com"
SUPABASE_URL = "https://lfjyoeusblhfpmgwbrhj.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_kqozWiWcKHNqendoiWxsMA_ro7DfTQF"
STRIPE_PRICE_MONTHLY = "price_REPLACE_test_monthly"
STRIPE_PRICE_YEARLY = "price_REPLACE_test_yearly"
VAT_MODE = "REPLACE_registered_or_exempt"
