<script>
const { icon, fmtP, fmtC, cls, logo, href, spark, colorFor, row } = UI, M = MOCK;
UI.subnav('');
document.getElementById('snap').innerHTML = ['SPX', 'BTC', 'XAU', 'US10Y'].map(s => M.bySym[s]).map(a => `<a class="card idx" href="${href(a)}"><div class="idx-top"><span>${a.n}</span><span class="pill ${cls(a.d)}">${fmtC(a.d, a.y)}</span></div><div class="idx-val">${fmtP(a)}</div>${spark(a.spark, colorFor(a.w), 240, 38)}</a>`).join('');

document.getElementById('cats').innerHTML = M.categories.map(c => `<div class="card"><div class="card-head"><span class="ident"><span class="dd-ic">${icon(c.k)}</span><span><b style="font-size:15px">${c.t}</b><small>${c.d}</small></span></span><a class="link" href="${c.page}">Open ${icon('arrow')}</a></div>${pick[c.k].map(s => row(M.bySym[s])).join('')}</div>`).join('');
