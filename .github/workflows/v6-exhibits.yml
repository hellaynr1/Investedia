name: v6 SEC exhibit discovery (no model API)
# Bounded research job only. Does not deploy or submit Claude batches.
on:
  push:
    branches: [engine-v6]
    paths: [.github/workflows/v6-exhibits.yml]
  workflow_dispatch:
    inputs:
      max_filings:
        description: Maximum uncached filing indexes to request
        default: '3000'
        required: true
      reuse_run_id:
        description: Reuse a completed SEC artifact instead of fetching SEC again
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  discover:
    if: github.ref == 'refs/heads/engine-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      V6_REUSE_RUN: ${{ inputs.reuse_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-v6
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/v6/
            /tests/test_v6_exhibits.py
            /research/v6/index/
            /research/v6/exhibits/
            /research/v6/text/
            /research/sec/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_v6_exhibits.py' -v
      - if: env.V6_REUSE_RUN == ''
        run: python3 -m tools.v6.exhibits --import-legacy --minutes "$V6_MINUTES" --max-filings "$V6_MAX_FILINGS"
        env:
          V6_MAX_FILINGS: ${{ inputs.max_filings || '500' }}
          V6_MINUTES: ${{ github.event_name == 'push' && '10' || '35' }}
      - name: Download completed discovery artifact
        if: env.V6_REUSE_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: v6-sec-exhibits
          path: /tmp/v6-sec-completed
          run-id: ${{ env.V6_REUSE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify and import artifact evidence
        if: env.V6_REUSE_RUN != ''
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          source = Path('/tmp/v6-sec-completed')
          with zipfile.ZipFile('/tmp/v6-sec-completed.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(source)))
          PYCODE
          python3 -m tools.v6.import_exhibits /tmp/v6-sec-completed.zip --run-id "$V6_REUSE_RUN"
      - name: Cache readable Exhibit 99 text (no model API)
        run: python3 tools/v6/claude_extract.py --fetch-only
        env:
          V6_FETCH_MAX: '500'
      - name: Save verified SEC cache to research branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/v6/exhibits
          if [ -d research/v6/text ]; then git add research/v6/text; fi
          git diff --cached --quiet && exit 0
          git commit -m "v6 verified SEC exhibit cache [skip ci]"
          git pull --rebase origin engine-v6
          git push origin HEAD:engine-v6
      - name: Show actual discovery result
        if: always()
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('research/v6/exhibits/runs.jsonl')
          print('# SEC Exhibit 99 discovery — engine-v6 research')
          print('No deployment. No model API calls.')
          if path.exists():
              result = json.loads(path.read_text().splitlines()[-1])
              print('\n| Check | Actual result |\n|---|---:|')
              for name in ('attempts', 'indexes_cached', 'exhibit_entries_added', 'errors', 'api_cost_usd'):
                  print(f"| {name} | {result[name]} |")
              if result.get('last_error'):
                  print('\nDownload error: ' + result['last_error']['error'])
          else:
              print('No discovery run completed. Inspect the job logs.')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-sec-exhibits
          path: research/v6/exhibits
          retention-days: 7
