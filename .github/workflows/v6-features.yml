name: v6 features (engine research)
# Track C on the engine-v6 branch: Finnhub structured features (cached). Never touches main or the site.
on:
  schedule:
    - cron: "23 */3 * * *"   # free cached sources; paid Claude extraction is manual opt-in only
  push:
    branches: [engine-v6]
    paths: [tools/v6/claude_extract.py, tools/v6/finnhub.py, tools/v6/earnings_nasdaq.py, .github/workflows/v6-features.yml]
  workflow_dispatch:
    inputs:
      run_claude:
        description: Explicitly allow budget-capped Claude extraction
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency: { group: v6-features, cancel-in-progress: false }
jobs:
  finnhub:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: engine-v6 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/v6/earnings_nasdaq.py
      - name: Claude extraction (explicit manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_claude == true
        run: pip install -q anthropic && python3 tools/v6/claude_extract.py
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", V6_CLAUDE_BUDGET: "4.5" }
      - run: python3 tools/v6/finnhub.py
        env: { FINNHUB_KEY: "${{ secrets.FINNHUB_KEY }}" }
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/v6/finnhub research/v6/earnings research/v6/text research/v6/facts || true
          git diff --cached --quiet && exit 0
          git commit -q -m "v6 Finnhub cache [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin engine-v6 && git push -q origin HEAD:engine-v6 && exit 0; sleep $((RANDOM % 20 + 5)); done
