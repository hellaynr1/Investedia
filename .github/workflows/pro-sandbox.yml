name: Pro sandbox (Stripe TEST mode, manual only)
# Deploys workers/live as the separate Worker "investedia-live-sandbox". Never runs on push; never deploys the production Worker.
on:
  push:
    branches: [pro-sandbox]          # pushing this branch (never main) deploys the TEST-mode Worker only
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SANDBOX to deploy the test-mode Worker'
        required: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'SANDBOX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tests
        working-directory: workers/live
        run: npm test
      - name: Refuse placeholders
        working-directory: workers/live
        run: '! grep -n "REPLACE_" wrangler.toml || (echo "fill price ids and VAT_MODE in [env.sandbox.vars] first"; exit 1)'
      - name: Deploy sandbox Worker only
        working-directory: workers/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env sandbox
