name: Event id eval (measurement only)
# Runs only on the event-eval branch: replays archived articles through the event-id step. Never touches main or the site.
on:
  push:
    branches: [event-eval]
    paths: [tools/eval/event_eval.py, event_ids.py, .github/workflows/event-eval.yml]
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Replay archived articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/eval/event_eval.py
      - name: Save the results on this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/eval/event_results.json || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Event id eval results [skip ci]"
          git push -q origin HEAD:event-eval
