name: Refresh economic releases
on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-refresh
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh while releases are due (or manual)
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          events = json.load(open('assets/calendar-live.json')).get('events', [])
          due = any(now-timedelta(hours=1) <= datetime.fromisoformat(e['at'].replace('Z','+00:00')) <= now+timedelta(minutes=30) for e in events)
          if due or now.minute < 15 or os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              subprocess.run(['python3','update_calendar.py'], check=True)
          PY
      - name: Save data
        run: |
          git config user.name 'Investedia calendar robot'
          git config user.email 'calendar@users.noreply.github.com'
          git add assets/calendar-live.json docs/assets/calendar-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh economic calendar'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
