name: Priority news (every ~10 min)
# Tier A: official sources (central banks, regulators, statistics) and a few fast business feeds. Small on purpose: no GDELT, no article-page fetches,
# at most 10 new articles per run, never rewrites the 30-day archive (the broad run does). GitHub cron is best effort: runs can start 5-15 minutes late
# and are skipped under load, so the page always shows an honest "Updated Xm ago" label instead of claiming to be live.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-data   # shared with broad-news: never two news writers at once, and a queued run replaces older queued runs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch priority news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_TIER: priority
        run: python3 update_globe_news.py
        timeout-minutes: 6
      - name: Push to the Worker (optional, never blocks)
        if: always()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: python3 tools/push-news-to-worker.py
      - name: Publish (only when something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/globe/news-live.json assets/globe/news-status.json assets/globe/news-seen.json docs/assets/globe/news-live.json docs/assets/globe/news-status.json
          # a run that found nothing new only moves timestamps: commit only when the article list changed (each commit costs a Pages build)
          git diff --cached --quiet -- assets/globe/news-live.json && { git reset -q; git checkout -q -- assets/globe docs/assets/globe; exit 0; }
          git commit -q -m "Priority news"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
