name: Update market data and news
# Free price refresh: every 15 minutes while markets are open, every 3 hours otherwise (news every 30 minutes).
# Long-term history is rebuilt once a day after the US close.
on:
  schedule:
    - cron: "*/15 6-21 * * 1-5"    # weekdays, Asian close / European open to US close (UTC)
    - cron: "22 0,3,22 * * 1-5"    # weekday evenings and nights
    - cron: "22 */3 * * 0,6"       # weekends (crypto keeps trading)
    - cron: "45 21 * * 1-5"        # daily history rebuild
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild long-term history too"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch prices
        run: |
          if [ "${{ github.event.schedule }}" = "45 21 * * 1-5" ] || [ "${{ inputs.full }}" = "true" ]; then
            python3 update_market.py --full
          else
            python3 update_market.py
          fi
      - name: Fetch world globe prices
        run: python3 update_globe.py || echo "Globe update failed; keeping the previous prices"
      - name: Fetch prices for assets in the news
        run: python3 update_news_prices.py || echo "News prices failed; keeping the previous file"
      - name: Record prices for the since-the-news charts
        run: python3 update_news_track.py || echo "News track failed; keeping the previous file"
      - name: Judge older articles on daily closes (track record)
        run: python3 update_track_backfill.py || echo "Track record backfill failed; keeping the previous ledger"
      - name: Big-move analysis for assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_asset_analysis.py || echo "Analysis failed; keeping the previous file"
      - name: Fetch news
        run: |
          M=$(date -u +%M)
          if [ "${{ github.event.schedule }}" != "*/15 6-21 * * 1-5" ] || [ $((10#$M % 30)) -lt 15 ]; then
            python3 update_news.py || echo "News update failed; keeping the previous headlines"
          fi
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/quotes.js assets/intraday.json assets/hist assets/news.js assets/news assets/globe docs/assets
          git diff --cached --quiet && exit 0
          git commit -q -m "Update market data and news"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
