name: Update market data and news
# Free price refresh: every 15 minutes while markets are open, every 3 hours otherwise (news every 30 minutes).
# Long-term history is rebuilt once a day after the US close.
on:
  schedule:
    - cron: "*/15 6-21 * * 1-5"    # weekdays, Asian close / European open to US close (UTC)
    - cron: "22 0,3,22 * * 1-5"    # weekday evenings and nights
    - cron: "22 */3 * * 0,6"       # weekends (crypto keeps trading)
    - cron: "45 21 * * 1-5"        # daily history rebuild
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild long-term history too"
        type: boolean
        default: true
permissions:
  contents: write
  actions: write   # lets the run schedule its successor (see the "next" job)
jobs:
  update:
    concurrency:
      group: market-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the one current when this run was queued (a queued run otherwise conflicts with the run it waited for)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch prices
        run: |
          if [ "${{ github.event.schedule }}" = "45 21 * * 1-5" ] || [ "${{ inputs.full }}" = "true" ]; then
            python3 update_market.py --full
          else
            python3 update_market.py
          fi
      - name: Fetch world globe prices
        run: python3 update_globe.py || echo "Globe update failed; keeping the previous prices"
      - name: Fetch prices for assets in the news
        run: python3 update_news_prices.py || echo "News prices failed; keeping the previous file"
      - name: Record prices for the since-the-news charts
        run: python3 update_news_track.py || echo "News track failed; keeping the previous file"
      - name: Judge older articles on daily closes (track record)
        run: python3 update_track_backfill.py || echo "Track record backfill failed; keeping the previous ledger"
      - name: Big-move analysis for assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_asset_analysis.py || echo "Analysis failed; keeping the previous file"
      - name: Fetch news
        run: |
          M=$(date -u +%M)
          if [ "${{ github.event.schedule }}" != "*/15 6-21 * * 1-5" ] || [ $((10#$M % 30)) -lt 15 ]; then
            python3 update_news.py || echo "News update failed; keeping the previous headlines"
          fi
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/quotes.js assets/intraday.json assets/hist assets/news.js assets/news assets/globe docs/assets
          git diff --cached --quiet && exit 0
          git commit -q -m "Update market data and news"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
  # GitHub's cron is best effort: measured 2026-10-29/30 the 15-minute market-hours schedule ran on average only every 49 minutes
  # (gaps up to 2.7 h), which left Globe prices and the Live Track Record's price recorder stale. During weekday market hours each
  # run queues its successor 15 minutes after it started; outside those hours the cron above is enough. Holds no lock.
  next:
    needs: update
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Queue the next price run 15 minutes after this one started (weekdays 06-21 UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          wait=$(( $(date -d "$start" +%s) + 900 - $(date +%s) ))
          [ "$wait" -gt 0 ] && sleep "$wait"
          dow=$(date -u +%u); hour=$(date -u +%H)
          if [ "$dow" -gt 5 ] || [ $((10#$hour)) -lt 6 ] || [ $((10#$hour)) -ge 21 ]; then echo "outside market hours: the cron takes over"; exit 0; fi
          mine=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          newer=$(gh run list -R "${{ github.repository }}" --workflow update-market.yml --limit 20 --json createdAt --jq "[.[] | select(.createdAt > \"$mine\")] | length")
          if [ "$newer" = "0" ]; then gh workflow run update-market.yml -R "${{ github.repository }}" --ref main -f full=false; else echo "a newer run exists: it continues the chain"; fi
