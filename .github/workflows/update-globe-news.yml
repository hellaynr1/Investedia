name: Update globe news
# Free headline collection every five minutes; GitHub schedules can be delayed.
# Optional major-story summaries use a confirmed free-tier-only project, at most 8 batches/day.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also fill the past N days (0-7) with the most important stories"
        default: "0"
  push:
    branches: [preview/live-news]
    paths: [update_globe_news.py, .github/workflows/update-globe-news.yml]
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_FREE_TIER_CONFIRMED: ${{ vars.NEWS_FREE_TIER_CONFIRMED }}
          NEWS_FREE_MODEL: ${{ vars.NEWS_FREE_MODEL }}
          NEWS_AI_DAILY_CAP: '8'
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
        run: python3 update_globe_news.py
        timeout-minutes: 8
      - name: Fetch economic calendar and earnings
        run: |
          minute=$(date -u +%M)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((10#$minute % 30)) -lt 5 ]; then
            python3 update_calendar.py || echo "Calendar update failed; keeping the previous data"
          fi
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/globe docs/assets/globe assets/calendar-live.json docs/assets/calendar-live.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update globe news"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
