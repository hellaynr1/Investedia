name: Update globe news
# Live news for the Globe News page (update_globe_news.py): free sources (GDELT, official press releases), Gemini for selection + short summaries,
# Pixabay for topic photos. Every 30 minutes; visitors only read the saved file, so traffic never uses the free limits.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [preview/live-news]
    paths: [update_globe_news.py, .github/workflows/update-globe-news.yml]
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow
      - name: Fetch news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python3 update_globe_news.py
      - name: Fetch economic calendar and earnings
        run: python3 update_calendar.py || echo "Calendar update failed; keeping the previous data"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/globe docs/assets/globe assets/calendar-live.json docs/assets/calendar-live.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update globe news"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
