name: Broad news (every 30 min)
# Tier B. Live news for the Globe News page (update_globe_news.py): free sources (GDELT, official press releases), Gemini for selection + short summaries,
# Pixabay for topic photos. Every 30 minutes; visitors only read the saved file, so traffic never uses the free limits.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also fill the past N days (0-7) with the most important stories"
        default: "0"
  push:
    branches: [preview/live-news]
    paths: [update_globe_news.py, news_core.py, .github/workflows/broad-news.yml]
permissions:
  contents: write
concurrency:
  group: news-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow
      - name: Fetch news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          NEWS_TIER: broad
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
        run: python3 update_globe_news.py
        timeout-minutes: 60
      - name: Draw share cards
        run: python3 update_share_cards.py || echo "Share cards failed; keeping the previous files"
      - name: Fetch economic calendar and earnings
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 update_calendar.py || echo "Calendar update failed; keeping the previous data"
      - name: Push to the Worker (optional, never blocks)
        if: always()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: python3 tools/push-news-to-worker.py
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/globe docs/assets/globe assets/share docs/assets/share assets/calendar-live.json docs/assets/calendar-live.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update globe news"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
