<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Investedia Globe News (concept)</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Globe News concept: the globe fills the screen; filters on top, timeline at the bottom, one glass panel on the right (bottom sheet on phones). */
:root{
  --bg:#050506;--panel:rgba(16,16,18,.74);--card:#151517;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --fg:#fff;--fg-2:#A1A1AA;--fg-3:#71717A;--accent:#FF7A1A;--accent-soft:rgba(255,122,26,.14);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pw:392px;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#cv.drag{cursor:grabbing}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}

/* Top: brand, title, filters */
.top{position:fixed;left:max(24px,env(safe-area-inset-left));top:22px;right:calc(var(--pw) + 40px);pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wm{font-weight:650;font-size:17px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.wm .i{color:transparent;background:linear-gradient(var(--accent) .385em,var(--fg) .385em);-webkit-background-clip:text;background-clip:text}
.prod{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.demo{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px dashed rgba(255,122,26,.45);color:#FFB37A;font-size:11.5px;font-weight:550}
h1{margin:14px 0 0;font-size:clamp(22px,2.4vw,32px);font-weight:600;letter-spacing:-.035em;line-height:1.08;max-width:520px;pointer-events:none}
h1 span{color:var(--fg-3)}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.search{z-index:5;position:relative;display:flex;align-items:center;gap:10px;width:min(440px,100%);height:48px;margin-top:14px;padding:0 12px 0 14px;border-radius:12px}
.search svg{width:16px;height:16px;flex:none;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--fg);font:16px var(--sans)}
.search input::placeholder{color:var(--fg-3)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{border-color:var(--line-2)}
.search kbd{font:500 11px var(--mono);color:var(--fg-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.res{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);max-height:min(420px,60vh);overflow:auto;padding:6px;border-radius:14px;background:rgba(18,18,20,.97);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:6}
.res .sec-h{margin:8px 10px 4px}
.ri{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--fg)}
.ri[aria-selected=true],.ri:hover{background:rgba(255,255,255,.06)}
.ri small{margin-left:auto;font:500 11px var(--mono);color:var(--fg-3);white-space:nowrap}
.ri .dot{margin-top:0;flex:none}
.ri span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .none{padding:12px 10px;font-size:13px;color:var(--fg-3)}
.follow{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:550;color:var(--fg)}
.follow svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.follow.on{background:var(--accent-soft);border-color:rgba(255,122,26,.5);color:#FFB37A}
.flag{width:20px;height:15px;flex:none;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.flag.big{width:44px;height:33px;border-radius:6px}
.cn{display:flex;align-items:center;gap:12px;min-width:0}
.alerts{margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(255,122,26,.3);background:rgba(255,122,26,.05)}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.al input{margin-top:2px;width:16px;height:16px;accent-color:#FF7A1A;flex:none}
.al b{display:block;font-size:13px;font-weight:550}
.al small{display:block;font-size:12px;color:var(--fg-3);margin-top:1px}
.eco{margin-top:18px;padding:16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.eco-s{margin:6px 0 14px;font-size:13.5px;line-height:1.55;color:#D4D4D8}
.eco-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.eco-g div{display:grid;gap:2px;min-width:0}
.eco-g span{font-size:11px;color:var(--fg-3)}
.eco-g b{font:500 14.5px var(--mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eco-g small{font:500 10.5px var(--mono);color:var(--fg-3)}
.eco-c{display:block;width:100%;height:76px;margin-top:16px}
.eco-yr{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--fg-3);margin-top:4px}
.eco-yr span:nth-child(2){font-family:var(--sans)}
.eco-src{margin:10px 0 0;font-size:11px;color:var(--fg-3)}
.eco-src a{color:inherit}
@media (max-width:760px){.eco-g{grid-template-columns:repeat(2,minmax(0,1fr))}.flag.big{width:38px;height:28px}}
.fnote{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--fg-3)}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(16,16,18,.6);color:var(--fg-2);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--fg);color:#0A0A0B;border-color:var(--fg)}
.regions{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
.reg{white-space:nowrap;padding:5px 9px;border-radius:7px;color:var(--fg-3);font-size:12px;font-weight:500}
.reg:hover{color:var(--fg)}
.reg[aria-pressed=true]{color:var(--fg);background:rgba(255,255,255,.07)}

/* Bottom: timeline + legend + zoom */
.timeline{position:fixed;left:calc((100vw - var(--pw) - 32px)/2);transform:translateX(-50%);bottom:22px;display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;z-index:3}
.tl-play{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.tl-play:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.tl-play svg{width:14px;height:14px}
.tl-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.win{height:34px;min-width:46px;padding:0 10px;border-radius:10px;font:500 12px var(--mono);color:var(--fg-3);letter-spacing:.02em}
.win:hover{color:var(--fg)}
.win[aria-pressed=true]{color:var(--fg);background:rgba(255,255,255,.09)}
.tl-info{padding:0 10px 0 8px;font-size:12px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:96px}
.tl-info b{color:var(--fg);font:500 12.5px var(--mono)}
.legend{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:28px;display:flex;gap:14px;font-size:11.5px;color:var(--fg-3);z-index:2}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.legend i.m{width:6px;height:6px;box-shadow:none}
.legend i.s{width:5px;height:5px;background:#d4d4d8;box-shadow:none}
.zoom{position:fixed;right:calc(var(--pw) + 40px);bottom:22px;display:grid;border-radius:12px;overflow:hidden;z-index:3}
.zoom button{width:36px;height:36px;font-size:17px;color:var(--fg-2)}
.zoom button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.zoom button+button{border-top:1px solid var(--line)}

/* Hover preview */
.hover{position:fixed;z-index:5;width:280px;padding:12px;border-radius:14px;pointer-events:none;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
.hover.on{opacity:1;transform:none}
.hover .art{width:52px;height:52px;border-radius:9px}
.hover .art span{display:none}
.hover h3{margin:3px 0 6px;font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.hover.solo{grid-template-columns:1fr}
.meta{font-size:11.5px;color:var(--fg-3);line-height:1.45}
.meta b{color:var(--fg-2);font-weight:500}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.tag{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.demo.live{border-style:solid;border-color:rgba(255,122,26,.35)}
.demo.live i{width:6px;height:6px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 8px #FF7A1A}
.dtag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;border:1px dashed rgba(255,179,122,.5);color:#FFB37A;font-size:9.5px;font-weight:600;letter-spacing:.06em;vertical-align:1px}

/* Panel */
.panel{position:fixed;top:16px;right:16px;bottom:16px;width:var(--pw);border-radius:20px;z-index:4;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.grab{display:none}
.pbody{flex:1;overflow-y:auto;padding:22px 22px 28px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#333 transparent}
.pbody h2{margin:6px 0 4px;font-size:22px;line-height:1.15;font-weight:600;letter-spacing:-.03em}
.back{display:inline-flex;align-items:center;gap:6px;margin:-4px 0 14px;font-size:12.5px;color:var(--fg-3)}
.back:hover{color:var(--fg)}
.stats{display:flex;gap:18px;margin:14px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.stats div{font-size:11.5px;color:var(--fg-3)}
.stats b{display:block;font:500 19px var(--mono);color:var(--fg);margin-bottom:3px}
.list{display:grid;gap:2px;margin:0 -10px}
.item{display:grid;grid-template-columns:14px 1fr;gap:10px;text-align:left;padding:11px 10px;border-radius:12px;transition:background .12s}
.item:hover,.item:focus-visible{background:rgba(255,255,255,.05);outline:none}
.item h4{margin:3px 0 5px;font-size:14px;line-height:1.32;font-weight:550;letter-spacing:-.01em}
.dot{width:7px;height:7px;border-radius:50%;margin-top:6px;background:#d4d4d8}
.dot.i2{background:var(--accent)}
.dot.i3{width:9px;height:9px;margin-top:5px;background:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.18),0 0 12px rgba(255,122,26,.7)}
.sec-h{margin:22px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.art{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(120% 90% at var(--x,70%) var(--y,20%),rgba(255,122,26,.32),transparent 55%),linear-gradient(140deg,#1c1c20,#0c0c0e);display:grid;place-items:center}
.art::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at 60% 40%,#000,transparent 75%)}
.art>svg:not(.cout):not(.cspark):not(.pout){position:relative;width:34%;max-width:64px;height:auto;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.art>span.ph{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.03em}
.story .art{aspect-ratio:16/9;margin:2px 0 16px}
.art.photo{display:block;margin:2px 0 16px;border:1px solid var(--line);background:#0b0b0d}
.art.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.photo::before{display:none}
.art.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 45%,rgba(0,0,0,.82))}
.pkind{position:absolute;z-index:1;left:12px;top:12px;padding:4px 8px;border-radius:6px;background:rgba(10,10,11,.7);backdrop-filter:blur(6px);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.art.photo .cspark{z-index:1;bottom:30px;height:34%;opacity:.95}
.pq{position:absolute;z-index:2;left:12px;bottom:34px;display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border-radius:10px;background:rgba(10,10,11,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.art.photo .pq img{position:static;inset:auto;width:28px;height:28px;border-radius:7px;background:#fff;object-fit:contain;padding:3px;box-sizing:border-box}
.pq{max-width:62%}
.pq b{display:block;font-size:12.5px;font-weight:600;color:#fff;line-height:1.25}
.pq span{font:500 11px var(--mono);color:rgba(255,255,255,.75)}
.pq em{font-style:normal}
.pout{position:absolute;z-index:1;right:12px;top:12px;width:64px;height:64px;padding:6px;border-radius:10px;background:rgba(10,10,11,.6);backdrop-filter:blur(6px);box-sizing:border-box}
.plogo{position:absolute;z-index:2;right:12px;top:12px;width:min(196px,40%);height:46px;border-radius:8px;overflow:hidden;background:#fff}
.art.photo .plogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plogo:has(img.bf){width:46px}
.art.photo .plogo img.bf{object-fit:contain;padding:5px;box-sizing:border-box}
.pchip{position:absolute;z-index:1;right:12px;top:12px;display:flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;border-radius:8px;background:rgba(10,10,11,.75);backdrop-filter:blur(6px);font-size:12px;font-weight:550;color:#fff}
.pchip img{position:static;width:20px;height:20px;border-radius:5px;background:#fff;object-fit:contain;padding:2px;box-sizing:border-box}
.pchip em{font:500 11.5px var(--mono);font-style:normal}
.art.photo figcaption{position:absolute;z-index:1;left:12px;right:12px;bottom:9px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;color:rgba(255,255,255,.7)}
.art.photo figcaption a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35)}
.art.thumb.photo{margin:0;padding:0}
.art.thumb.photo img{position:static;width:100%;height:100%;object-fit:cover;padding:0;background:none;border-radius:0}
.art.thumb.photo::after{display:none}
.art.card{display:block;border:1px solid var(--line);background:radial-gradient(90% 80% at 85% 20%,rgba(255,122,26,.13),transparent 60%),linear-gradient(150deg,#18181b,#0b0b0d)}
.art.card::before{mask-image:radial-gradient(circle at 80% 30%,#000,transparent 70%)}
.cout{position:absolute;right:5%;top:7%;width:40%;height:56%;opacity:.95}
.cout.big{left:0;right:0;top:8%;width:100%;height:76%}
.chead{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:10px;max-width:60%}
.chead img,.cico{width:34px;height:34px;flex:none;border-radius:9px;background:#fff;object-fit:contain;padding:5px;box-sizing:border-box}
.cico{background:rgba(255,255,255,.06);display:grid;place-items:center;padding:7px}
.chead b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead span{font:500 11px var(--mono);color:var(--fg-3)}
.cpx{position:absolute;left:16px;top:62px;display:grid;gap:3px}
.cpx span{font:500 22px var(--mono);letter-spacing:-.02em;color:var(--fg)}
.cpx em{font:500 11.5px var(--mono);font-style:normal}
.up{color:#22C55E}.dn{color:#F04444}
.cspark{position:absolute;left:0;right:0;bottom:26px;width:100%;height:36%}
.csrc{position:absolute;left:16px;right:16px;bottom:8px;font-size:10px;color:rgba(255,255,255,.42);letter-spacing:.02em}
.cmeta{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.cmeta b{color:var(--fg);font-weight:600}
.art .cicon{position:static;width:28px;height:28px;max-width:none;stroke:rgba(255,255,255,.8)}
.art.thumb{display:grid;place-items:center;border:1px solid var(--line);background:linear-gradient(150deg,#1b1b1e,#0d0d0f)}
.art.thumb img{width:72%;height:72%;object-fit:contain;background:#fff;border-radius:8px;padding:12%;box-sizing:border-box}
.art.thumb .cout{position:static;width:80%;height:80%}
.art.thumb::before{display:none}
.item{grid-template-columns:14px 1fr 44px!important}
.item .art.thumb{width:44px;height:44px;border-radius:10px;margin-top:4px}
.story h2{font-size:21px}
.story .meta{margin:8px 0 16px}
.story p{margin:0;font-size:14px;line-height:1.6;color:#D4D4D8}
.why{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.why .eyebrow{color:var(--accent)}
.why p{margin-top:6px!important;font-size:13.5px!important}
.ents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ent{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 9px 3px 5px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--fg)}
.ent>img{width:18px;height:18px;flex:none;object-fit:contain;box-sizing:border-box;background:#fff;border-radius:4px;padding:2px}
.story .note{font-size:12px;color:var(--fg-2);line-height:1.6}
.ent code{font:500 11px var(--mono);color:var(--fg-3)}
.chain{display:grid;margin-top:8px}
.chain button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--fg-2)}
.chain button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.chain button.cur{color:var(--fg);background:rgba(255,122,26,.08)}
.chain .n{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,122,26,.5);display:grid;place-items:center;font:500 10.5px var(--mono);color:var(--accent)}
.chain .ar{height:10px;margin-left:19px;border-left:1px dashed rgba(255,122,26,.45)}
.src{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.read{height:38px;padding:0 16px;border-radius:10px;background:var(--fg);color:#0A0A0B;font-size:13px;font-weight:600;opacity:.35;cursor:not-allowed}
.empty{margin-top:18px;padding:18px;border-radius:14px;border:1px dashed var(--line-2);color:var(--fg-2);font-size:13.5px;line-height:1.55}
.cos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{margin-top:24px;font-size:11.5px;line-height:1.55;color:var(--fg-3)}

/* Direct impacts: optional analysis, with direction conveyed in words and arrows. */
.impact-section{margin-top:22px}.impact-label{font-size:11.5px;color:var(--fg-3);margin:4px 0 12px}
.impact-list{display:grid;gap:14px}.impact-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.impact-head img{width:18px;height:18px;object-fit:contain;background:#fff;padding:2px;border-radius:4px;flex:none}
.impact-dir{margin-left:auto;font-size:16px}.impact-up{color:#22C55E}.impact-down{color:#F04444}.impact-mixed,.impact-unclear{color:var(--fg-2)}
.story .impact-list p{font-size:12.5px;line-height:1.55;color:var(--fg-2);margin:5px 0 0}.story .moved p{font-size:13px;margin:6px 0 0}.moved{margin-bottom:16px}

/* Phones: compact header, timeline above a bottom sheet */
@media (max-width:760px){
  :root{--pw:0px}
  .top{left:16px;right:16px;top:calc(14px + env(safe-area-inset-top))}
  h1{display:none}
  .chips,.regions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 24px),transparent)}
  .chips::-webkit-scrollbar,.regions::-webkit-scrollbar{display:none}
  .chips{margin-top:10px}.regions{margin-top:6px}
  .search{margin-top:12px;height:48px;width:100%}.search kbd{display:none}
  .legend{display:none}
  .timeline{left:50%;bottom:calc(98px + env(safe-area-inset-bottom));padding:4px}
  .win{min-width:0;padding:0 9px;height:32px}.tl-play{width:32px;height:32px}
  .tl-info{display:none}
  .zoom{right:16px;bottom:auto;top:calc(50% - 36px)}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(60vh,600px);border-radius:22px 22px 0 0;transform:translateY(calc(100% - 84px - env(safe-area-inset-bottom)));transition:transform .38s cubic-bezier(.2,.8,.2,1)}
  .panel.open{transform:none}
  .grab{display:block;flex:none;height:22px;width:100%;position:relative}
  .grab::after{content:'';position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.25)}
  .pbody{padding:2px 18px 28px}
  .pbody h2{font-size:19px}
  .hover{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.embed body,.embed{background:transparent}
.embed .top,.embed .panel,.embed .timeline,.embed .legend,.embed .zoom{display:none!important}
.embed #cv{touch-action:pan-y}

<script>
// ===== Data =====
// News is loaded from NEWS_URL. Today that is demo content; a live pipeline (sources → dedupe → location → entities → category → importance → validation → summary)
// only has to write the same JSON shape (see tools/globe-news/news-demo.json "fields"). Nothing below is tied to the demo stories.
const NEWS_URL = 'news-live.json', DEMO_URL = 'news-demo.json'; // live news (update_globe_news.py); demo stories only if there is no live file yet
const ISO = __ISO__, DOTS = __DOTS__, CTRY = __COUNTRIES__, LOGOS = __LOGOS__, QD = window.QUOTES || { q: {} };
const $ = id => document.getElementById(id), rad = Math.PI / 180, T0 = Date.now();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
const phone = () => innerWidth <= 760, EMBED = document.documentElement.classList.contains('embed');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CATS = [['all', 'All'], ['markets', 'Markets'], ['companies', 'Companies'], ['economy', 'Economy'], ['technology', 'Technology'], ['crypto', 'Crypto'], ['commodities', 'Commodities'], ['geopolitics', 'Geopolitics']];
const CAT = Object.fromEntries(CATS);
const REGIONS = [['global', 'Global', -15, 24, 1], ['na', 'North America', -97, 40, 2], ['eu', 'Europe', 10, 50, 2.6], ['asia', 'Asia', 108, 28, 1.8], ['me', 'Middle East', 46, 26, 2.8], ['af', 'Africa', 20, 3, 1.8], ['latam', 'Latin America', -62, -16, 1.8], ['oc', 'Oceania', 140, -26, 2]];
const WINS = [['now', 'Now', 15], ['1h', '1H', 60], ['6h', '6H', 360], ['24h', '24H', 1440], ['7d', '7D', 10080]];
const WLABEL = { now: 'the last 15 minutes', '1h': 'the last hour', '6h': 'the last 6 hours', '24h': 'the last 24 hours', '7d': 'the last 7 days' };
const FLAG = { breaking: 'Breaking', trending: 'Trending', moving: 'Market moving' };
const NAME = { 'United States of America': 'United States', 'Bosnia and Herz.': 'Bosnia and Herzegovina', 'Dem. Rep. Congo': 'DR Congo', 'Dominican Rep.': 'Dominican Republic', 'Central African Rep.': 'Central African Republic', 'S. Sudan': 'South Sudan', 'Eq. Guinea': 'Equatorial Guinea', 'W. Sahara': 'Western Sahara', 'Solomon Is.': 'Solomon Islands', 'Falkland Is.': 'Falkland Islands', 'Fr. S. Antarctic Lands': 'French Southern Lands', 'N. Cyprus': 'Northern Cyprus' };

const ICON = {

// Image cards (no third-party photos): real price chart of the story's first asset with data, its logo, and the country outline.

const YLD = /\d+Y$/;
const quoteOf = s => { for (const e of s.entities) { const q = e.sym && QD.q[e.sym]; if (q && q.sp && q.sp.length > 5) return { e, q }; } return null; };

const BRANDFETCH_ID = '1idNJqyfpKbma454ae4'; // public client ID from brandfetch.com/developers (not a secret: it is part of every logo URL)
function bfURL(e, px) {

}
function logoFor(e) { const local = LOGOS[e.sym] || LOGOS[e.ticker], remote = !(local && local.endsWith('.svg')) && bfURL(e, 512); return local || remote ? { e, l: remote || local, fb: remote && local ? local : '' } : null; }
const logoOf = s => { for (const e of s.entities) { const l = logoFor(e); if (l) return l; } return null; };
const limg = (lg, alt = '') => `<img src="${esc(lg.l)}" alt="${esc(alt)}"${lg.l.startsWith('https://cdn.brandfetch.io') ? ' class="bf"' : ''} data-logo${lg.fb ? ` data-fb="${esc(lg.fb)}"` : ''} loading="lazy" referrerpolicy="strict-origin-when-cross-origin">`;
addEventListener('error', ev => { const t = ev.target; if (t.tagName !== 'IMG' || !t.hasAttribute('data-logo')) return; if (t.dataset.fb) { t.src = t.dataset.fb; t.removeAttribute('data-fb'); } else (t.closest('.plogo') || t).remove(); }, true);
const fmtP = (v, sym) => v.toLocaleString('en-US', { maximumFractionDigits: YLD.test(sym) ? 2 : v >= 1000 ? 0 : v >= 10 ? 2 : 4, minimumFractionDigits: YLD.test(sym) ? 2 : 0 });
const outlineCache = {};
function outline(name, lat, lon) {
  const c = byName[name]; if (!c) return '';
  const key = name + (c.rings.length) + lat + lon; if (outlineCache[key]) return outlineCache[key];
  const bbx = g => { const b = [180, 90, -180, -90]; for (const [x, y] of g) { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); } return b; };
  let rings = c.rings.filter(g => { const b = bbx(g); return Math.abs((b[0] + b[2]) / 2 - c.c[0]) < 28 && Math.abs((b[1] + b[3]) / 2 - c.c[1]) < 22; }); if (!rings.length) rings = c.rings;

function spark(sp, up) {

}
function art(s, label = true) {
  const qq = quoteOf(s), lg = logoOf(s), ol = outline(s.location.country, s.location.lat, s.location.lon);
  // B / C: openly licensed photo, always with its credit and licence
  if (s.image && typeof s.image === 'object') {
    const im = s.image, src = esc(im.url || im.file);
    if (!label) return `<div class="art thumb photo"><img src="${src}" alt="" loading="lazy"></div>`;
    // photo layout: clean photo, company logo top right (no chart on photos), credit at the bottom
    const lgp = lg ? `<span class="plogo">${limg(lg, lg.e.name)}</span>` : '';
    const lic = im.license_url ? `<a href="${esc(im.license_url)}" target="_blank" rel="noopener license">${esc(im.license)}</a>` : esc(im.license);

      <figcaption>${im.kind === 'topic' ? 'Illustration · ' : ''}Photo: ${esc(im.credit)} · ${lic} · <a href="${esc(im.source_url)}" target="_blank" rel="noopener">${esc(im.source || 'source')}</a></figcaption></figure>`;
  }
  const icon = `<svg class="cicon" viewBox="0 0 24 24"><path d="${ICON[s.category] || ICON.markets}"/></svg>`;
  if (!label) // thumbnail: logo, else the country outline
    return `<div class="art thumb">${lg ? limg(lg) : ol ? `<svg class="cout" viewBox="0 0 100 100">${ol}</svg>` : icon}</div>`;
  if (!qq) return `<div class="art card"><svg class="cout big" viewBox="0 0 100 100">${ol}</svg><div class="cmeta">${icon}<span>${esc(s.location.place)}<br><b>${esc(nm(s.location.country))}</b></span></div></div>`;
  const { e, q } = qq, sp = q.sp, chg = (sp[sp.length - 1] / sp[0] - 1) * 100, y = YLD.test(e.sym), up = sp[sp.length - 1] >= sp[0];
  const day = y ? `${q.d >= 0 ? '+' : ''}${q.d.toFixed(1)} bp today` : `${q.d >= 0 ? '+' : ''}${q.d.toFixed(2)}% today`;
  const l2 = lg && lg.e === e ? lg : logoFor(e);

    <div class="chead">${l2 ? limg(l2) : `<span class="cico">${icon}</span>`}<div><b>${esc(e.name)}</b><span>${esc(e.sym)}${q.cur ? ' · ' + esc(q.cur) : ''}</span></div></div>

// Flags (vector, flag-icons MIT) and the World Bank economy snapshot (economy.json, refreshed weekly by update_economy.py)
const flag = (name, cls = 'flag') => ISO[name] ? `<img class="${cls}" src="flags/${ISO[name].toLowerCase()}.svg" alt="" loading="lazy" onerror="this.remove()">` : '';
function entityChip(e, country) {
  const asset = /[\^=]/.test(e.ticker || '') || ['index', 'currency', 'future'].includes(e.type);
  const lg = asset ? null : logoFor(e);
  const image = asset ? flag(country, 'ent-flag') : lg ? limg(lg) : '';
  return `<span class="ent">${image}<span>${esc(e.name)}</span>${e.ticker ? `<code>${esc(e.ticker)}</code>` : ''}</span>`;

let ECON = null; fetch('economy.json').then(r => r.json()).then(d => { ECON = d; if (view.k === 'country') render(); }).catch(() => {});
const usd = v => v >= 1e12 ? '$' + (v / 1e12).toFixed(v >= 1e13 ? 1 : 2) + ' trillion' : v >= 1e9 ? '$' + (v / 1e9).toFixed(v >= 1e11 ? 0 : 1) + ' billion' : '$' + (v / 1e6).toFixed(0) + ' million';
const people = v => v >= 1e9 ? (v / 1e9).toFixed(2) + ' billion' : v >= 1e6 ? (v / 1e6).toFixed(1) + ' million' : Math.round(v / 1e3) + ' thousand';
const usdS = v => v >= 1e12 ? '$' + (v / 1e12).toFixed(1) + 'T' : v >= 1e9 ? '$' + (v / 1e9).toFixed(v >= 1e11 ? 0 : 1) + 'B' : '$' + (v / 1e6).toFixed(0) + 'M';
const peopleS = v => v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.round(v / 1e3) + 'K';
const THE = new Set(['United States of America', 'United Kingdom', 'Netherlands', 'Philippines', 'United Arab Emirates', 'Dem. Rep. Congo', 'Central African Rep.', 'Dominican Rep.', 'Czech Rep.', 'Bahamas', 'Gambia']);
const pct = (v, sign) => (sign && v > 0 ? '+' : '') + v.toFixed(1) + '%';
function economy(name) {
  const c = ECON && ISO[name] && ECON.countries[ISO[name]]; if (!c) return ECON ? '' : '<div class="eco"><div class="sec-h">Economy</div><p class="meta">Loading…</p></div>';

const TOPICS = [['eco', 'Economy data', 'GDP, inflation and jobs figures when they come out'], ['rates', 'Central bank & interest rates', 'Rate decisions and what they mean'], ['news', 'Market-moving news', 'Big business and market stories'], ['week', 'Weekly summary', 'One short email every week']];

// ===== Start =====
let LIVE = null;
const load = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.json(); });
load(NEWS_URL).then(d => { if (!d.stories || !d.stories.length) throw 0; return d; }).catch(() => load(DEMO_URL)).then(raw => {
  if (!raw.demo) { LIVE = raw; const b = $('badge'); b.className = 'demo live'; b.title = raw.notice || ''; b.innerHTML = '<i></i>Live news · updated ' + new Date(raw.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  stories = normalize(raw); byId = Object.fromEntries(stories.map(s => [s.id, s])); incoming = {};
  for (const s of stories) for (const l of s.links) if (byId[l]) incoming[l] = s.id;
  refresh();
  const q = new URLSearchParams(location.search);
  if (q.get('story') && byId[q.get('story')]) openStory(byId[q.get('story')]);
  else if (q.get('country') && byName[q.get('country')]) openCountry(byName[q.get('country')]);
}).catch(() => { pbody.innerHTML = '<div class="empty">News could not be loaded. Please refresh the page.</div>'; });
requestAnimationFrame(frame);
</script>
</body>
</html>
