<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../consent.css"><link rel="stylesheet" href="../since-news.css">
<script src="../consent.js"></script>
<script src="../live-config.js"></script><script src="../prefs.js"></script><script src="../sectors.js"></script><script src="../peek.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>window.InvConsent?.mount());</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Investedia Globe News (concept)</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
/* Globe News concept: the globe fills the screen; filters on top, timeline at the bottom, one glass panel on the right (bottom sheet on phones). */
:root{
  --bg:#050506;--panel:rgba(16,16,18,.74);--card:#151517;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --fg:#fff;--fg-2:#A1A1AA;--fg-3:#71717A;--accent:#FF7A1A;--accent-soft:rgba(255,122,26,.14);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pw:392px;color-scheme:dark;
}
*{box-sizing:border-box}
/* Dragging or double-clicking the globe must never select text or paint the page orange. Article text in the panel stays selectable. */
html,body,#cv{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,.pbody,.pbody *,.fsheet input{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cv.drag{cursor:grabbing!important}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}

/* Top: brand, title, filters */
.top::before{content:'';position:absolute;z-index:-1;left:-40px;top:-30px;right:-60px;bottom:-30px;background:radial-gradient(120% 100% at 0% 0%,rgba(5,5,6,.92) 45%,rgba(5,5,6,0) 100%);pointer-events:none}
.embed .top::before{display:none}
.top{position:fixed;left:max(24px,env(safe-area-inset-left));top:22px;right:calc(var(--pw) + 40px);pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wm{font-weight:650;font-size:17px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.wm .i{color:transparent;background:linear-gradient(var(--accent) .385em,var(--fg) .385em);-webkit-background-clip:text;background-clip:text}
.prod{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.demo{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px dashed rgba(255,122,26,.45);color:#FFB37A;font-size:11.5px;font-weight:550}
h1{margin:14px 0 0;font-size:clamp(22px,2.4vw,32px);font-weight:600;letter-spacing:-.035em;line-height:1.08;max-width:520px;pointer-events:none}
h1 span{color:var(--fg-3)}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.search{z-index:5;position:relative;display:flex;align-items:center;gap:10px;width:min(440px,100%);height:48px;margin-top:14px;padding:0 12px 0 14px;border-radius:12px}
.search svg{width:16px;height:16px;flex:none;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--fg);font:16px var(--sans)}
.search input::placeholder{color:var(--fg-3)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{border-color:var(--line-2)}
.search kbd{font:500 11px var(--mono);color:var(--fg-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.res{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);max-height:min(420px,60vh);overflow:auto;padding:6px;border-radius:14px;background:rgba(18,18,20,.97);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:6}
.res .sec-h{margin:8px 10px 4px}
.ri{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--fg)}
.ri[aria-selected=true],.ri:hover{background:rgba(255,255,255,.06)}
.ri small{margin-left:auto;font:500 11px var(--mono);color:var(--fg-3);white-space:nowrap}
.ri .dot{margin-top:0;flex:none}
.ri span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .none{padding:12px 10px;font-size:13px;color:var(--fg-3)}
.follow{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:550;color:var(--fg)}
.follow svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.follow.on{background:var(--accent-soft);border-color:rgba(255,122,26,.5);color:#FFB37A}
.flag{width:20px;height:15px;flex:none;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.flag.big{width:44px;height:33px;border-radius:6px}
.cn{display:flex;align-items:center;gap:12px;min-width:0}
.alerts{margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(255,122,26,.3);background:rgba(255,122,26,.05)}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.al input{margin-top:2px;width:16px;height:16px;accent-color:#FF7A1A;flex:none}
.al b{display:block;font-size:13px;font-weight:550}
.al small{display:block;font-size:12px;color:var(--fg-3);margin-top:1px}
.eco{margin-top:18px;padding:16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.eco-s{margin:6px 0 14px;font-size:13.5px;line-height:1.55;color:#D4D4D8}
.eco-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.eco-g div{display:grid;gap:2px;min-width:0}
.eco-g span{font-size:11px;color:var(--fg-3)}
.eco-g b{font:500 14.5px var(--mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eco-g small{font:500 10.5px var(--mono);color:var(--fg-3)}
.eco-c{display:block;width:100%;height:76px;margin-top:16px}
.eco-yr{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--fg-3);margin-top:4px}
.eco-yr span:nth-child(2){font-family:var(--sans)}
.eco-src{margin:10px 0 0;font-size:11px;color:var(--fg-3)}
.eco-src a{color:inherit}
@media (max-width:760px){.eco-g{grid-template-columns:repeat(2,minmax(0,1fr))}.flag.big{width:38px;height:28px}}
.fnote{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--fg-3)}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.chip b{font:600 12px 'Geist Mono',ui-monospace,monospace;color:#ff8c32;margin-left:5px}.chip[aria-pressed=true] b{color:#c2570a}
.lens-eyebrow{margin-top:2px}.pbody .lens-count,.pbody .news-count{font-weight:500;font-size:14px;color:var(--fg-2);margin:2px 0 10px}.lens-count b,.news-count b{font-size:26px;font-weight:700;color:var(--fg);letter-spacing:-.02em;margin-right:2px}
.lens-list{display:grid;border-top:1px solid var(--line)}.lens-item{display:grid;gap:6px;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.lens-item:hover strong{color:#fff}.lens-item strong{font-size:14px;line-height:1.35;font-weight:650;color:var(--fg)}
.lens-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3)}.lens-meta .flag{width:20px;height:14px;border-radius:2px;object-fit:cover}.lens-meta time{font:600 12px 'Geist Mono',ui-monospace,monospace;color:#ff8c32}
.lens-asset{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--fg-3)}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(16,16,18,.6);color:var(--fg-2);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--fg);color:#0A0A0B;border-color:var(--fg)}
.regions{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
.reg{white-space:nowrap;padding:5px 9px;border-radius:7px;color:var(--fg-3);font-size:12px;font-weight:500}
.reg:hover{color:var(--fg)}
.reg[aria-pressed=true]{color:var(--fg);background:rgba(255,255,255,.07)}

/* Bottom: timeline + legend + zoom */
.timeline{position:fixed;left:calc((100vw - var(--pw) - 32px)/2);transform:translateX(-50%);bottom:22px;display:flex;align-items:center;gap:4px;padding:5px;border-radius:14px;z-index:3}
.tl-play{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.tl-play:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.tl-play svg{width:14px;height:14px}
.tl-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.win{height:34px;min-width:46px;padding:0 10px;border-radius:10px;font:500 12px var(--mono);color:var(--fg-3);letter-spacing:.02em}
.win:hover{color:var(--fg)}
.win[aria-pressed=true]{color:var(--fg);background:rgba(255,255,255,.09)}
.tl-info{padding:0 10px 0 8px;font-size:12px;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:96px}
.tl-info b{color:var(--fg);font:500 12.5px var(--mono)}
.legend{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:84px;display:flex;gap:14px;font-size:11.5px;color:var(--fg-3);z-index:2}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.legend i.m{width:6px;height:6px;box-shadow:none}
.legend i.s{width:5px;height:5px;background:#d4d4d8;box-shadow:none}
.zoom{position:fixed;right:calc(var(--pw) + 40px);bottom:22px;display:grid;border-radius:12px;overflow:hidden;z-index:3}
.zoom button{width:36px;height:36px;font-size:17px;color:var(--fg-2)}
.zoom button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.zoom button+button{border-top:1px solid var(--line)}

/* Hover preview */
.hover{position:fixed;z-index:5;width:280px;padding:12px;border-radius:14px;pointer-events:none;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
.hover.on{opacity:1;transform:none}
.hover.pin{pointer-events:auto;cursor:pointer}
.hover.brief{width:340px;display:block;padding:16px}.brief-head{display:flex;align-items:center;gap:10px;padding-bottom:10px}.brief-head .flag{width:22px;height:16px;border-radius:2px;object-fit:cover}.brief-head h3{margin:0;font-size:16px}.brief-head span{margin-left:auto;font-size:12px;color:var(--fg-3)}
.brief-line{padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.35;font-weight:650}.brief-index{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding-top:10px;font-size:12.5px;color:var(--fg-3)}.brief-next{margin-top:8px;font-size:12px;color:var(--fg-3)}.brief-next b{color:var(--fg);font-weight:650}
.hover .art{width:52px;height:52px;border-radius:9px}
.hover .art span{display:none}
.hover h3{margin:3px 0 6px;font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.hover.solo{grid-template-columns:1fr}
.hover.hv-b{width:340px;padding:16px;display:block}.hv-b h3{margin:5px 0 3px;font-size:14.5px}.hv-b .hv-row{padding:11px 0 6px;border-top:1px solid rgba(255,255,255,.09);margin-top:8px}.hv-top{display:flex;align-items:center;gap:10px}.hv-top img{width:28px;height:28px;object-fit:contain;background:rgba(255,255,255,.07);padding:3px;border-radius:50%;flex:none}.hv-name{min-width:0;flex:1}.hv-name b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hv-name span{font-size:12px;color:var(--fg-3)}.hv-pct{text-align:right;flex:none}.hv-pct small{display:block;margin-top:3px;font-size:12px;color:var(--fg-2)}
.hv-impl{font-size:12px;color:var(--fg-2);margin:6px 0 4px}.hv-impl b.up{color:#5df08a}.hv-impl b.down{color:#ff8a82}.hv-impl b.flat{color:#c4c4cc}.hv-open{display:block;width:100%;margin:12px 0 0;padding:11px 14px;border-radius:12px;border:0;background:#FF7A1A;color:#0a0a0b;font:650 14px Inter,system-ui,sans-serif;cursor:pointer}.hv-rel{margin:8px 0 0;font-size:11.5px;color:#ffb27a;letter-spacing:.01em}.hv-rel b{color:#FF7A1A;font-weight:650}.hv-why{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--fg-2)}.hv-spark{display:block;width:100%;height:44px}
.pct{display:inline-flex;font:700 12px Inter,system-ui,sans-serif;padding:3px 9px;border-radius:999px;white-space:nowrap}.pct.up{background:rgba(48,209,88,.16);color:#5df08a}.pct.down{background:rgba(255,69,58,.16);color:#ff8a82}.pct.flat{background:rgba(255,255,255,.08);color:#c4c4cc}
.impact-head .pct{margin-left:auto}.impact-head .pct+.impact-dir{margin-left:0}
.meta{font-size:11.5px;color:var(--fg-3);line-height:1.45}
.meta b{color:var(--fg-2);font-weight:500}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.tag{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.demo.live{border-style:solid;border-color:rgba(255,122,26,.35)}
.demo.live i{width:6px;height:6px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 8px #FF7A1A}
.dtag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;border:1px dashed rgba(255,179,122,.5);color:#FFB37A;font-size:9.5px;font-weight:600;letter-spacing:.06em;vertical-align:1px}

/* Panel */
.panel{position:fixed;top:16px;right:16px;bottom:16px;width:var(--pw);border-radius:20px;z-index:4;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.globe-privacy{font-size:11px;color:var(--fg-2);padding:4px;border-radius:4px}.globe-privacy:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.grab,.sheet-actions{display:none}
.pbody{flex:1;overflow-y:auto;padding:22px 22px 28px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#333 transparent}
.pbody h2{margin:6px 0 4px;font-size:22px;line-height:1.15;font-weight:600;letter-spacing:-.03em}
.back{display:inline-flex;align-items:center;gap:6px;margin:-4px 0 14px;font-size:12.5px;color:var(--fg-3)}
.back:hover{color:var(--fg)}
.share-link{color:var(--accent,#ff7a1a);font:inherit;font-weight:600;padding:0;min-width:0;min-height:0}.share-link:hover{text-decoration:underline}
.stats{display:flex;gap:18px;margin:14px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.stats div{font-size:11.5px;color:var(--fg-3)}
.stats b{display:block;font:500 19px var(--mono);color:var(--fg);margin-bottom:3px}
.list{display:grid;gap:2px;margin:0 -10px}
.item{display:grid;grid-template-columns:14px 1fr;gap:10px;text-align:left;padding:11px 10px;border-radius:12px;transition:background .12s}
.item:hover,.item:focus-visible{background:rgba(255,255,255,.05);outline:none}
.item h4{margin:3px 0 5px;font-size:14px;line-height:1.32;font-weight:550;letter-spacing:-.01em}
.dot{width:7px;height:7px;border-radius:50%;margin-top:6px;background:#d4d4d8}
.dot.i2{background:var(--accent)}
.dot.i3{width:9px;height:9px;margin-top:5px;background:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.18),0 0 12px rgba(255,122,26,.7)}
.sec-h{margin:22px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.art{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(120% 90% at var(--x,70%) var(--y,20%),rgba(255,122,26,.32),transparent 55%),linear-gradient(140deg,#1c1c20,#0c0c0e);display:grid;place-items:center}
.art::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at 60% 40%,#000,transparent 75%)}
.art>svg:not(.cout):not(.cspark):not(.pout){position:relative;width:34%;max-width:64px;height:auto;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.art>span.ph{position:absolute;left:10px;bottom:8px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.03em}
.story .art{aspect-ratio:16/9;margin:2px 0 16px}
.art.photo{display:block;margin:2px 0 16px;border:1px solid var(--line);background:#0b0b0d}
.art.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.photo::before{display:none}
.art.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 45%,rgba(0,0,0,.82))}
.pkind{position:absolute;z-index:1;left:12px;top:12px;padding:4px 8px;border-radius:6px;background:rgba(10,10,11,.7);backdrop-filter:blur(6px);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.art.photo .cspark{z-index:1;bottom:30px;height:34%;opacity:.95}
.pq{position:absolute;z-index:2;left:12px;bottom:34px;display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border-radius:10px;background:rgba(10,10,11,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.art.photo .pq img{position:static;inset:auto;width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);object-fit:contain;padding:3px;box-sizing:border-box}
.pq{max-width:62%}
.pq b{display:block;font-size:12.5px;font-weight:600;color:#fff;line-height:1.25}
.pq span{font:500 11px var(--mono);color:rgba(255,255,255,.75)}
.pq em{font-style:normal}
.pout{position:absolute;z-index:1;right:12px;top:12px;width:64px;height:64px;padding:6px;border-radius:10px;background:rgba(10,10,11,.6);backdrop-filter:blur(6px);box-sizing:border-box}
.plogo{position:absolute;z-index:2;right:12px;top:12px;width:46px;height:46px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.art.photo .plogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box}
.plogo:has(img.bf){width:46px}
.art.photo .plogo img.bf{object-fit:contain;padding:5px;box-sizing:border-box}
.pchip{position:absolute;z-index:1;right:12px;top:12px;display:flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;border-radius:8px;background:rgba(10,10,11,.75);backdrop-filter:blur(6px);font-size:12px;font-weight:550;color:#fff}
.pchip img{position:static;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);object-fit:contain;padding:2px;box-sizing:border-box}
.pchip em{font:500 11.5px var(--mono);font-style:normal}
.art.photo figcaption{position:absolute;z-index:1;left:12px;right:12px;bottom:9px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;color:rgba(255,255,255,.7)}
.art.photo figcaption a{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35)}
.art.thumb.photo{margin:0;padding:0}
.art.thumb.photo img{position:static;width:100%;height:100%;object-fit:cover;padding:0;background:none;border-radius:0}

  ctx.beginPath(); for (const c of map) for (const rr of c.rr) ringPath(rr, false); ctx.strokeStyle = `rgba(255,255,255,${Math.min(.2, .07 + (Z - 1) * .04) + GB.line})`; ctx.lineWidth = .7; ctx.stroke();
  for (const { impact, country } of impactTargets(impactFocus)) countryShape(country, `rgba(${IMPACT_COLOR[impact.direction]},.10)`);
  if (hoverCountry && hoverCountry !== selCountry) countryShape(hoverCountry, 'rgba(255,255,255,.05)', 'rgba(255,255,255,.35)');
  if (selCountry) countryShape(selCountry, 'rgba(255,122,26,.10)', 'rgba(255,122,26,.75)', 1.2);
  ctx.restore();

  if (MARKET.on) { drawMarketMode(); ctx.restore(); requestAnimationFrame(frame); return; }

  // connections (only for the article you're looking at)
  const focus = impactFocus;
  const chain = chainOf(focus);
  for (let i = 0; i < chain.length - 1; i++) {
    const p = arcPts(chain[i], chain[i + 1]);
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(255,122,26,.55)'; ctx.beginPath(); let pen = false;
    for (const [x, y, v] of p) { if (!v) { pen = false; continue; } if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; } }
    ctx.stroke();
    const k = reduce ? .5 : ((t / 2200) + i * .33) % 1, q = p[Math.round(k * (p.length - 1))];
    if (q[2]) { const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], 8); g.addColorStop(0, 'rgba(255,200,150,.95)'); g.addColorStop(1, 'rgba(255,122,26,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q[0], q[1], 8, 0, 7); ctx.fill(); }
  }

  drawConnections(t, focus, sel ? null : selCountry);

  // lens active: stories outside the lens stay on the map as faint dots
  for (const s of dimmed) { const [x, y, z] = proj(s.phi, s.lam); if (z <= .04) continue; ctx.fillStyle = `rgba(161,161,170,${(.1 + .22 * z).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7); ctx.fill(); }
  // markers: project, cluster nearby ones, then draw
  // Articles are grouped by place once per filter change (sites), so the per-frame work depends on the number of places, not
  // the number of articles (the homepage holds 48 hours). Each site keeps all its articles: older or smaller events stay in the
  // cluster count and its list, and every region's places are drawn whatever the volume elsewhere.
  if (sitesFor !== shown) buildSites();
  const vis = [];
  for (const g of SITES) {
    const h = g.m[0]; if (!h.on) { h.on = true; h.vt = t; }
    const [x, y, z] = proj(g.phi, g.lam); if (z <= .04 || (!EMBED && (x < globeBox.left || x > globeBox.right || y < globeBox.top || y > globeBox.bottom))) continue; vis.push({ g, s: h, x, y, z });
  }
  vis.sort((a, b) => sortTop(a.s, b.s));
  const cl = [];
  for (const v of vis) { const c = cl.find(c => (c.x - v.x) ** 2 + (c.y - v.y) ** 2 < 22 * 22); if (c) c.m.push(v); else cl.push({ x: v.x, y: v.y, z: v.z, m: [v] }); }
  for (const g of SITES) g.rep = null;
  for (const c of cl) { const rep = c.m[0].g; for (const v of c.m) v.g.rep = rep; }  // where each place's dot is drawn (used by line ends)
  // Geometry changes each frame; article membership changes only when places regroup.
  // Reuse the sorted list/count metadata, bounded to this frame's clusters, so a busy
  // place does not rescan thousands of article ids/coordinates on every animation tick.
  const nextClusters = new Map();
  drawn = cl.map(c => {
    const membership = c.m.map(v => v.g.index).join(); let data = clusterLists.get(membership);
    if (!data) {
      const list = c.m.length === 1 ? c.m[0].g.m : c.m.flatMap(v => v.g.m).sort(sortTop), h = list[0];
      data = { key: list.map(s => s.id).join(), list, lo: h.location.lon, la: h.location.lat, same: list.every(s => Math.abs(s.location.lat - h.location.lat) < 1 && Math.abs(s.location.lon - h.location.lon) < 1) };
    }
    nextClusters.set(membership, data); return { ...data, x: c.x, y: c.y, z: c.z };
  });
  clusterLists = nextClusters;
  heatGlow();  // under the markers: busier countries glow wider and brighter, no text
  ctx.globalCompositeOperation = 'lighter';
  for (const d of drawn) {
    const s = d.list[0], pop = Math.min(1, (t - s.vt) / 650), e = 1 - Math.pow(1 - pop, 3), a = (.35 + .65 * d.z) * e, imp = s.importance;
    const gr = imp === 3 ? 10 : imp === 2 ? 7 : 5, g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, gr * e);
    const col = imp === 1 ? '228,228,231' : '255,122,26';
    g.addColorStop(0, `rgba(${col},${(imp === 3 ? .5 : imp === 2 ? .32 : .16) * a})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, gr * e, 0, 7); ctx.fill();
    if (s.flag === 'breaking' && !reduce) for (let k = 0; k < 2; k++) { const ph = ((t / 1800) + k * .5) % 1; ctx.strokeStyle = `rgba(255,122,26,${(.55 * (1 - ph) * a).toFixed(3)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(d.x, d.y, 5 + ph * 24, 0, 7); ctx.stroke(); }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'middle';
  for (const d of drawn) {
    const s = d.list[0], pop = Math.min(1, (t - s.vt) / 650), e = 1 - Math.pow(1 - pop, 3), a = (.45 + .55 * d.z) * e, imp = s.importance, n = d.list.length;
    const r = (imp === 3 ? 4.2 : imp === 2 ? 3.1 : 2.3) * e;
    ctx.fillStyle = imp === 1 ? `rgba(228,228,231,${a})` : `rgba(255,140,50,${a})`; ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, 7); ctx.fill();
    if (imp === 3) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(d.x, d.y, 1.5 * e, 0, 7); ctx.fill(); }
    const isSel = sel && d.list.includes(sel), isHov = hoverC === d.key;
    if (isSel || isHov) { ctx.strokeStyle = `rgba(255,255,255,${isSel ? .9 : .6})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(d.x, d.y, r + 5, 0, 7); ctx.stroke(); }
    if (n > 1) { const bx = d.x + 9, by = d.y - 9; ctx.fillStyle = `rgba(14,14,16,${.92 * e})`; ctx.strokeStyle = `rgba(255,122,26,${.7 * a})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, 8, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = '500 9.5px "Geist Mono",monospace'; ctx.textAlign = 'center'; ctx.fillText(n, bx, by + .5); ctx.textAlign = 'left'; }
    // a small label only for the few flagged articles
    if (s.flag && d.z > .35 && (n === 1 || d.same)) {
      const lx = d.x + (n > 1 ? 21 : 12), al = a * Math.min(1, (d.z - .35) * 4);
      ctx.font = '650 9px Inter,sans-serif'; ctx.fillStyle = `rgba(255,140,50,${al})`; ctx.fillText(FLAG[s.flag].toUpperCase(), lx, d.y - 6);
      ctx.font = '500 11.5px Inter,sans-serif'; ctx.fillStyle = DAY ? `rgba(24,24,28,${.88 * al})` : `rgba(255,255,255,${.92 * al})`; ctx.fillText(s.location.place.split(',')[0], lx, d.y + 7);
    }
  }
  if (placeCounts()) zoomCounts();
  // connection pills (asset + real % move) are drawn last so map markers never cover them
  ctx.textBaseline='alphabetic';
  for(const {x,y,w:W,h:H,nm,pt,w1,d} of pillRects){ctx.fillStyle='rgba(16,16,19,.94)';ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,W,H,13);ctx.fill();ctx.stroke();ctx.textAlign='left';ctx.font='650 12px Inter,sans-serif';ctx.fillStyle='#fff';ctx.fillText(nm,x+12,y+17);ctx.fillStyle=!Number.isFinite(d)||d===0?'#c4c4cc':d>0?'#5df08a':'#ff8a82';ctx.font='700 12px Inter,sans-serif';ctx.fillText(pt,x+12+w1+8,y+17);}
  if (!EMBED && MKTON) drawExchanges(t); else exHits = [];
  if (!EMBED && UPON) drawUpcoming(); else upHits = [];
  ctx.restore();
  requestAnimationFrame(frame);
}

// ===== Dropdowns: Region and My assets (glass menus) =====
const ddBtns = () => [$('reg-btn'), $('mine-btn')], ddMenus = () => [$('regions'), $('mine-menu')];
function ddClose() { ddMenus().forEach(m => m.hidden = true); ddBtns().forEach(b => b.setAttribute('aria-expanded', 'false')); }
function ddToggle(btn, menu) { const open = menu.hidden; ddClose(); if (open) { if (menu === $('mine-menu')) renderMine(); menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); } }
const regionCount = k => stories.filter(x => (F.lens === 'all' || x.lens.includes(F.lens)) && (F.cat === 'all' || x.category === F.cat) && inTime(x) && (!F.mine || touchesWatch(x)) && inRegion(x.location.region, k)).length;
const STAR_SVG = `<svg class="dd-bino" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10v17l-5-3.8-5 3.8z" fill="none" stroke="#ff7a1a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function updateDropdowns() {
  const counts = REGIONS.map(([k]) => regionCount(k)), mx = Math.max(1, ...counts);
  $('regions').querySelectorAll('.reg').forEach((b, i) => { b.querySelector('[data-n]').textContent = counts[i]; b.querySelector('.rg-bar i').style.width = Math.max(3, counts[i] / mx * 100) + '%'; });
  const r = regionDefinition(F.region); $('reg-label').textContent = 'Region: ' + (F.region === 'global' ? 'All regions' : r[1]);
  $('mine-n').textContent = WATCH.size || ''; $('mine-btn').classList.toggle('on', F.mine); $('mine-label').textContent = F.mine ? 'My watchlist only' : 'My watchlist';
  if (!$('mine-menu').hidden) renderMine();
}
function renderMine() {
  const rows = [...WATCH].map(sym => ({ sym, a: MKT.by[sym] })).filter(r => r.a);
  const n = sym => stories.filter(s => inTime(s) && impactsOf(s).some(i => { const a = assetForImpact(i); return (a && a.s.toUpperCase() === sym) || String(i.ticker || '').toUpperCase() === sym; })).length;
  $('mine-menu').innerHTML = rows.length
    ? `<div class="mine-top"><button type="button" data-mine="1" aria-pressed="${F.mine}">${STAR_SVG}My watchlist · ${rows.length}</button><button type="button" data-mine="0" aria-pressed="${!F.mine}">All news</button></div>${rows.map(r => { const c = n(r.sym); return `<button type="button" class="mine-row" data-asset="${esc(r.a.s)}"><span class="mine-ic">${window.AssetIcons ? AssetIcons.icon(r.a) : ''}</span><span class="mine-nm"><b>${esc(r.a.n)}</b><small>${c} ${c === 1 ? 'story' : 'stories'}</small></span>${Number.isFinite(r.a.d) ? pctPill(r.a.d) : ''}${STAR_SVG}</button>`; }).join('')}<a class="mine-foot" href="../../watchlist.html">Edit my watchlist</a>`
    : `<div class="mine-empty">${STAR_SVG}<b>Your watchlist is empty</b><span>Sign in and add assets to your watchlist. Then “My watchlist” shows only the news that touches them.</span><a class="mine-foot" href="../../watchlist.html">Open my watchlist</a></div>`;
}
$('reg-btn').onclick = () => ddToggle($('reg-btn'), $('regions'));
$('mine-btn').onclick = () => ddToggle($('mine-btn'), $('mine-menu'));
$('mine-menu').addEventListener('click', e => {
  const m = e.target.closest('[data-mine]'); if (m) { F.mine = m.dataset.mine === '1'; if (view.k !== 'top') { hist = []; view = { k: 'top' }; sel = null; selCountry = null; } refresh(); ddClose(); $('mine-btn').focus(); return; }
  const a = e.target.closest('[data-asset]'); if (a) { window.InvPeek?.open(a.dataset.asset); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && ddMenus().some(m => !m.hidden)) { const b = ddBtns().find(x => x.getAttribute('aria-expanded') === 'true'); ddClose(); e.stopPropagation(); if (b) b.focus(); } }, true);
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) ddClose(); });

// ===== Phone layout (option A): slim top bar, Filters sheet, peek card and bottom dock =====
const PH = {}; for (const [k, el] of [['cats', $('cats')], ['regions', $('ddrow')], ['tl', $('tl')], ['badge', $('badge')], ['lay', $('lay-switches')]]) { PH[k] = document.createComment(k); el.parentNode.insertBefore(PH[k], el); }
let filtersMoved = false;
function placeFilters(on) {
  if (on === filtersMoved || EMBED) return; filtersMoved = on;
  const dest = { cats: $('fs-cats'), regions: $('fs-regions'), tl: $('fs-time'), badge: $('fs-foot'), lay: $('fs-layers') };
  for (const [k, el] of [['cats', $('cats')], ['regions', $('ddrow')], ['tl', $('tl')], ['badge', $('badge')], ['lay', $('lay-switches')]]) on ? dest[k].appendChild(el) : PH[k].parentNode.insertBefore(el, PH[k]);
  if (!on) closeFilters(false);
}
let fsOpener = null;
function openFilters() { fsOpener = document.activeElement; $('fsback').hidden = false; $('fsheet').hidden = false; $('fs-title').focus(); }
function closeFilters(restore = true) { if ($('fsheet').hidden) return; $('fsheet').hidden = true; $('fsback').hidden = true; if (restore && fsOpener && fsOpener.focus) fsOpener.focus(); }
let filterDrag;
$('fsheet').querySelector('.fs-head').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;filterDrag=e.clientY;e.currentTarget.setPointerCapture(e.pointerId);});
$('fsheet').querySelector('.fs-head').addEventListener('pointerup',e=>{if(filterDrag!==undefined&&e.clientY-filterDrag>60)closeFilters();filterDrag=undefined;});
$('fsheet').querySelector('.fs-head').style.touchAction='none';
$('m-filters').onclick = openFilters; $('fs-close').onclick = () => closeFilters(); $('fsback').onclick = () => closeFilters(); $('fs-show').onclick = () => closeFilters();
$('m-search').onclick = () => { if (window.InvPeek) InvPeek.search(); else qi.focus(); };
$('fs-reset').onclick = () => { F.mine = false; for (const [box, k] of [[$('cats'), 'all'], [$('regions'), 'global'], [$('wins'), '48h']]) box.querySelector(`[data-k="${k}"]`).click(); };
$('fsheet').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); closeFilters(); return; }
  if (e.key !== 'Tab') return;
  const f = [...$('fsheet').querySelectorAll('button,[href],input')].filter(x => x.offsetParent !== null); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === $('fs-title'))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
function updateFiltersUI() {
  const n = (F.lens !== 'all') + (F.region !== 'global') + (F.win !== '48h'), c = $('m-fcount');
  c.hidden = !n; c.textContent = n; $('m-filters').setAttribute('aria-label', n ? `Filters, ${n} active` : 'Filters');
  $('fs-show').textContent = `Show ${shown.length} ${shown.length === 1 ? 'article' : 'articles'}`;
}
function peekUpdate() {
  const el = $('peek'); if (EMBED || !phone()) { el.hidden = true; return; }
  const show = phoneView === 'globe' && sheetState === 'closed' && view.k === 'top' && !!stories.length; el.hidden = !show; if (!stories.length) return;
  const s = [...shown].sort(sortTop)[0];
  if (!s) { el.dataset.story = ''; el.innerHTML = '<span class="pk-h">No articles match these filters</span><span class="pk-m">Open Filters to widen the time window.</span>'; return; }
  const a = lensAsset(s), src = s.source && s.source.name ? s.source.name : '';
  el.dataset.story = s.id;
  el.innerHTML = `<span class="pk-e"><time datetime="${esc(s.published_at || '')}">${ago(s.t)}</time>${src ? `<span>· ${esc(src)}</span>` : ''}</span><span class="pk-h">${esc(s.headline)}</span>${a ? `<span class="pk-a"><span>${esc(a.n)}</span>${pctPill(a.d)}</span>` : ''}`;
}
$('peek').onclick = () => { if(performance.now()-peekDraggedAt<400)return; if($('peek').classList.contains('minimized')){$('peek').classList.remove('minimized');return;} const s = byId[$('peek').dataset.story]; if (s) openStory(s); else openFilters(); };
function dockUpdate() {
  for (const b of $('dock').querySelectorAll('button')) b.dataset.v === phoneView ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  const h = $('nav-grab'); h.hidden = EMBED || !phone() || phoneView === 'globe';
  h.setAttribute('aria-label', `${sheetState === 'closed' ? 'Open' : 'Close'} ${phoneView === 'markets' ? 'Markets' : 'News'} panel`);
  h.setAttribute('aria-expanded', String(sheetState !== 'closed'));
}
function toggleNavSheet() {
  if (phoneView === 'globe') return;
  if (sheetState !== 'closed') return setSheet('closed');
  panel.hidden = false;
  if (view.k === 'top') panelTab = phoneView === 'markets' ? 'markets' : (panelTab === 'markets' ? 'top' : panelTab);
  render(); setSheet('full');
}
$('dock').onclick = e => {
  const b = e.target.closest('button'); if (!b || !phone()) return;
  gmAutoSheet = false;
  if (phoneView === b.dataset.v && phoneView !== 'globe') return toggleNavSheet();
  phoneView = b.dataset.v; $('peek').classList.remove('minimized');
  marketSetMode(phoneView === 'markets' ? 'markets' : 'news');
  setSheet('closed');
  $('peek').hidden = phoneView !== 'globe'; dockUpdate();
};
let navDraggedAt = -1000;
$('nav-grab').onclick = () => {if(performance.now()-navDraggedAt>400) toggleNavSheet();};
let navDrag;
$('nav-grab').onpointerdown = e => { navDrag = e.clientY; e.currentTarget.setPointerCapture(e.pointerId); };
$('nav-grab').onpointerup = e => { if (navDrag !== undefined && Math.abs(e.clientY-navDrag)>30) { navDraggedAt=performance.now(); if(e.clientY<navDrag && sheetState==='closed') toggleNavSheet(); else if(e.clientY>navDrag) setSheet('closed'); } navDrag=undefined; };
$('nav-grab').onpointercancel = () => {navDrag=undefined;};
let peekDrag, peekDraggedAt=-1000;
$('peek').addEventListener('pointerdown', e => {peekDrag=e.clientY;e.currentTarget.setPointerCapture(e.pointerId);});
$('peek').addEventListener('pointerup', e => {if(peekDrag!==undefined && e.clientY-peekDrag>35){$('peek').classList.add('minimized'); peekDraggedAt=performance.now(); e.preventDefault();}peekDrag=undefined;});
addEventListener('keydown', e => {
  if(e.key !== 'Escape' || e.defaultPrevented || e.cancelBubble || document.querySelector('.pk.on') || EMBED || !$('fsheet').hidden || !$('res').hidden || !$('lay-pop').hidden) return;
  if(phone() && sheetState === 'closed' || !phone() && panel.hidden) return;
  dismissPanel(); e.preventDefault(); e.stopImmediatePropagation();
}, true);
pbody.addEventListener('click', e => { const u = e.target.closest('[data-up]'); if (u && CAPS[u.dataset.up]) flyTo(CAPS[u.dataset.up][1], CAPS[u.dataset.up][0], 1.6); });
$('sw-conn').onclick = () => { CONNON = !CONNON; syncLayers(); };
$('sw-rel').onclick = () => { SECTORON = !SECTORON; syncLayers(); };
$('sw-story').onclick = () => { STORYON = !STORYON; syncLayers(); };
$('sw-up').onclick = () => {
  const on = !UPON; setUpcomingLayer(on);
  if (on && !phone()) { hist = []; view = { k: 'top' }; sel = null; selCountry = null; panelTab = 'upcoming'; panelExpanded = false; }
  render(); pbody.scrollTop = 0;
};
$('sw-mkt').onclick = () => {
  const on = !MKTON; setMarketsLayer(on);
  if (on && !phone()) { hist = []; view = { k: 'top' }; sel = null; selCountry = null; panelTab = 'markets'; panelExpanded = false; }
  render(); pbody.scrollTop = 0;
};
function layOpen(o) { $('lay-pop').hidden = !o; $('lay-btn').setAttribute('aria-expanded', String(o)); }
$('lay-btn').onclick = () => layOpen($('lay-pop').hidden);
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('lay-pop').hidden) { layOpen(false); $('lay-btn').focus(); } });
// The Layers card starts closed; once the visitor opens it, it stays open until they hide it with the button or Escape.
// Coming back to the page from the browser's back/forward cache must not keep an old "connections off".
addEventListener('pageshow', e => { if (e.persisted && new URLSearchParams(location.search).get('connections') !== '0') { CONNON = true; syncLayers(); } });
syncLayers(); if (MKTON) panelTab = 'markets'; if (UPON) panelTab = 'upcoming';
placeFilters(phone()); addEventListener('resize', () => placeFilters(phone()));

// ===== Start =====
let LIVE = null;
const load = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw 0; return r.json(); });
newsReady = load(NEWS_URL).then(d => { if (!d.stories || !d.stories.length) throw 0; return d; }).catch(() => load(DEMO_URL))
  // homepage globe: the live file holds only the newest articles, so add the archive's articles from the last 48 hours
  .then(raw => raw.demo ? raw : load('news-48h.json').catch(() => load('news-archive.json')).then(a => { const have = new Set(raw.stories.map(s => s.id)), cut = Date.now() - 48 * 3600e3;
    return { ...raw, stories: raw.stories.concat((a.stories || []).filter(s => !have.has(s.id) && Date.parse(s.published_at) >= cut)) }; }).catch(() => raw))
  .then(raw => {
  if (!raw.demo) { LIVE = raw; const b = $('badge'); b.className = 'demo live'; b.title = raw.notice || ''; const m = Math.max(0, Math.round((Date.now() - Date.parse(raw.updated_at)) / 60000)); b.innerHTML = '<i></i>News updated ' + (m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago'); }
  stories = normalize(raw); byId = Object.fromEntries(stories.map(s => [s.id, s])); incoming = {};
  for (const s of stories) for (const l of s.links) if (byId[l]) incoming[l] = s.id;
  refresh();
  const q = new URLSearchParams(location.search);
  const lq = q.get('lens'); if (lq && LENSES.some(l => l[0] === lq)) { F.lens = lq; press($('cats'), lq); refresh(); }
  if (q.get('story') && byId[q.get('story')]) openStory(byId[q.get('story')]);
  else if (q.get('country') && byName[q.get('country')]) {
    openCountry(byName[q.get('country')]);
    if (!MARKET.on && q.get('win') && WINS.some(w=>w[0]===q.get('win'))) setTimeout(async()=>{await setWin(q.get('win'));if(q.get('country-tab')==='news')countryTab='news';render();},0);
  }
}).catch(() => { pbody.innerHTML = '<div class="empty">News could not be loaded. Please refresh the page.</div>'; });
setInterval(() => { if (view.k === 'top' && (panelTab === 'markets' || panelTab === 'upcoming') && F.lens === 'all') render(); }, 60000);
/* MARKET_MODE */
requestAnimationFrame(frame);
