<!doctype html><html lang="en"><meta charset="utf-8"><title>Design options 6 · strip under the globe</title>
<style>
:root{--num:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--line:rgba(255,255,255,.13);--fg2:#a1a1aa;--fg3:#70707a;--acc:#ff7a1a}
*{box-sizing:border-box}body{margin:0;background:#050506;color:#fff;font:14px/1.45 Inter,-apple-system,system-ui,sans-serif;padding:24px}
.fr{position:relative;width:1100px;height:330px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0a0a0b;margin:0 0 26px}
.fr.ph{width:390px;height:520px;display:inline-block;margin-right:18px;vertical-align:top}
.glow{position:absolute;inset:0;background:radial-gradient(60% 90% at 70% 0,rgba(255,122,26,.22),transparent 70%)}
.lab{position:absolute;left:14px;top:12px;z-index:20;background:var(--acc);color:#000;font:800 19px Inter;padding:5px 13px;border-radius:12px;display:flex;gap:9px;align-items:center}.lab i{font-style:normal;background:#000;color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.note{position:absolute;right:14px;top:14px;z-index:20;max-width:480px;text-align:right;font-size:11.5px;color:var(--fg2)}
.globe{position:absolute;left:50%;top:-250px;width:620px;height:620px;margin-left:-310px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1b1b20,#0b0b0d);border:1px solid rgba(255,122,26,.35);box-shadow:0 0 90px rgba(255,122,26,.15)}
.ph .globe{width:420px;height:420px;margin-left:-210px;top:-150px}
.dots{position:absolute;inset:0}.dots i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.22)}
.hot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 18px 6px rgba(255,122,26,.4)}
.sm{color:var(--fg3);font-size:12px}.mono{font:600 12px 'Geist Mono',ui-monospace,monospace}.orange{color:#ff9a4d}
.fl{width:20px;height:14px;border-radius:3px;object-fit:cover;flex:none}
.pct{display:inline-flex;font:650 12px var(--num);padding:3px 9px;border-radius:999px;white-space:nowrap}.u{background:rgba(48,209,88,.16);color:#5df08a}.d{background:rgba(255,69,58,.16);color:#ff8a82}.o{background:rgba(255,255,255,.08);color:#c4c4cc}
.row{display:flex;align-items:center;gap:10px}
.bar{position:absolute;left:0;right:0;bottom:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 12.5px Inter;white-space:nowrap}
.card{background:rgba(18,18,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
</style><body><div id=app></div>
<script>
const D={"latest": [{"h": "UOB Organises China Business Tour for High-Net-Worth Heirs", "src": "The Straits Times", "ago": "0 min ago", "flag": "sg", "place": "Singapore", "cat": "companies", "asset": {"n": "UOB", "d": -0.69, "dir": "unclear"}, "flagtag": null}, {"h": "Anthropic AI Model Claude Accessed Public Georgia Voter Information, Axios Reports", "src": "Investing.com", "ago": "28 min ago", "flag": "us", "place": "San Francisco", "cat": "technology", "asset": null, "flagtag": null}, {"h": "New South Wales Labor Pledges A$6.8 Billion South Coast Rail Electrification", "src": "ABC News Australia", "ago": "41 min ago", "flag": "au", "place": "Sydney", "cat": "economy", "asset": null, "flagtag": null}, {"h": "NEXTDC CEO to Forgo FY27 Bonuses Following Forecast Cut and Delay", "src": "Investing.com", "ago": "51 min ago", "flag": "au", "place": "Sydney", "cat": "companies", "asset": null, "flagtag": "moving"}, {"h": "South Australia Premier Refers A$15 Billion Transport Project to Watchdog", "src": "ABC News Australia", "ago": "1 hour ago", "flag": "au", "place": "Adelaide", "cat": "economy", "asset": null, "flagtag": null}, {"h": "Goldman Sachs Cites Three Factors Supporting Long Commodity Positions", "src": "Investing.com", "ago": "1 hour ago", "flag": "us", "place": "New York", "cat": "commodities", "asset": null, "flagtag": null}], "withasset": [{"h": "UOB Organises China Business Tour for High-Net-Worth Heirs", "src": "The Straits Times", "ago": "0 min ago", "flag": "sg", "place": "Singapore", "cat": "companies", "asset": {"n": "UOB", "d": -0.69, "dir": "unclear"}, "flagtag": null}, {"h": "Wall Street Retreats as Oil Prices Continue to Rise", "src": "ABC News Australia", "ago": "3 hours ago", "flag": "us", "place": "New York", "cat": "markets", "asset": {"n": "S&P 500", "d": -0.52, "dir": "down"}, "flagtag": "moving"}, {"h": "Nokia Lowers Cash-Flow Target Despite Profit Rise", "src": "finchannel.com", "ago": "4 hours ago", "flag": "fi", "place": "Espoo", "cat": "companies", "asset": {"n": "Nokia Corporation", "d": -0.83, "dir": "mixed"}, "flagtag": null}, {"h": "Machado Returns to Venezuela as US Administration Eyes Access to Oil Reserves", "src": "ABC News Australia", "ago": "4 hours ago", "flag": "ve", "place": "Caracas", "cat": "geopolitics", "asset": {"n": "WTI crude oil", "d": 3.82, "dir": "down"}, "flagtag": null}], "n24": 140, "countries": 38, "top": [{"c": "United States of America", "n": 39, "flag": "us"}, {"c": "United Kingdom", "n": 19, "flag": "gb"}, {"c": "India", "n": 17, "flag": "in"}, {"c": "Australia", "n": 10, "flag": "au"}, {"c": "Germany", "n": 5, "flag": "de"}], "cats": [["economy", 37], ["companies", 35], ["geopolitics", 21], ["markets", 19], ["technology", 14]], "breaking": {"h": "UOB Organises China Business Tour for High-Net-Worth Heirs", "src": "The Straits Times", "ago": "0 min ago", "flag": "sg", "place": "Singapore", "cat": "companies", "asset": {"n": "UOB", "d": -0.69, "dir": "unclear"}, "flagtag": null}};
const F=c=>c?`<img class="fl" src="../assets/globe/flags/${c}.svg">`:'';
const pc=v=>`<span class="pct ${v>0?'u':v<0?'d':'o'}">${v>0?'↑':v<0?'↓':'↔'} ${Math.abs(v).toFixed(2)}%</span>`;
const LB=(l,t,s)=>`<div class="lab"><i>${l==='Now'?'•':l}</i>${t}${s?` <span style="font-weight:600;font-size:13px">· ${s}</span>`:''}</div>`;
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const globe=(ph)=>{let d='';const R=ph?210:310;for(let i=0;i<260;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*R*.97;d+=`<i style="left:${R+Math.cos(a)*r}px;top:${R+Math.sin(a)*r}px"></i>`}return `<div class="globe"><div class="dots">${d}</div><span class="hot" style="left:${R*0.55}px;top:${R*1.25}px"></span><span class="hot" style="left:${R*1.1}px;top:${R*1.3}px"></span><span class="hot" style="left:${R*1.4}px;top:${R*1.2}px"></span></div>`};
const fr=(id,l,t,s,body,ph,note)=>`<section class="fr ${ph?'ph':''}" id="${id}"><div class="glow"></div>${globe(ph)}${LB(l,t,s)}${note?`<div class="note">${note}</div>`:''}${body}</section>`;
const L=D.latest, W=D.withasset, B=D.breaking;
// NOW (for reference)
const now=fr('now','Now','Today\'s strip','current',`<div class="bar" style="padding:0 0 0 30px;border-top:1px solid rgba(255,255,255,.12);height:60px;display:flex;align-items:center;gap:36px;overflow:hidden;white-space:nowrap">${L.slice(0,3).map(i=>`<span class="row"><b class="mono orange">${i.ago}</b><span style="font-weight:600">${i.h}</span></span>`).join('')}</div>`,false,'What the strip looks like now: time + headline, scrolling, no source, no link to markets.');
// A: breaking bar
const A=fr('A','A','Headline bar','PC',`<div class="bar" style="padding:0 30px 24px"><div class="card row" style="height:64px;padding:0 18px;justify-content:space-between"><span class="row" style="min-width:0"><span class="pct" style="background:rgba(255,122,26,.18);color:#ff9a4d;text-transform:uppercase;letter-spacing:.06em;font-size:11px">${B.flagtag==='breaking'?'Breaking':'Latest'}</span>${F(B.flag)}<b style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${B.h}</b></span><span class="row" style="flex:none"><span class="sm">${B.src} · ${B.ago}</span><span class="chip" style="width:30px;padding:0;justify-content:center">‹</span><span class="chip" style="width:30px;padding:0;justify-content:center">›</span><span class="row" style="gap:5px"><i style="width:18px;height:3px;border-radius:2px;background:#ff7a1a"></i><i style="width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></i><i style="width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></i><i style="width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></i></span></span></div></div>`,false,'One calm line at a time (changes every 6 s, pauses on hover, arrows to step). Shows the source, flag and a Breaking tag instead of a scrolling marquee.');
// B: three cards with asset pills
const B_=fr('B','B','Three headline cards','PC',`<div class="bar" style="padding:0 30px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${W.slice(0,3).map(i=>`<div class="card" style="padding:14px 16px;height:132px;display:flex;flex-direction:column;justify-content:space-between"><div class="row sm">${F(i.flag)}<span class="mono orange">${i.ago}</span><span>· ${i.src}</span></div><b style="font:650 15px/1.3 Inter;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${i.h}</b><div class="row" style="justify-content:space-between"><span class="row sm">${i.asset.n}</span>${pc(i.asset.d)}</div></div>`).join('')}</div>`,false,'The three latest articles that name a priced asset, each with the asset\'s real move today. Ties the news to the globe lines.');
// C: ticker with flags and asset chips
const C=fr('C','C','Ticker with impact chips','PC',`<div class="bar" style="border-top:1px solid rgba(255,255,255,.12);height:64px;display:flex;align-items:center;gap:30px;padding-left:30px;overflow:hidden;white-space:nowrap">${L.slice(0,4).map(i=>`<span class="row">${F(i.flag)}<b class="mono orange">${i.ago.replace(' ago','')}</b><span style="font-weight:600">${i.h.length>46?i.h.slice(0,45)+'…':i.h}</span>${i.asset?`<span class="chip" style="height:26px;gap:8px">${i.asset.n} ${pc(i.asset.d)}</span>`:''}</span>`).join('')}</div>`,false,'Keeps the scrolling ticker but adds the country flag, a shorter time and, where the article names a priced asset, its real % move.');
// D: globe summary
const Dd=fr('D','D','Globe summary strip','PC',`<div class="bar" style="padding:0 30px 24px"><div class="card" style="padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center"><div><div class="sm">Last 24 hours</div><div style="font:800 28px var(--num);letter-spacing:-.02em">${D.n24} <span style="font-size:15px;font-weight:600;color:#a1a1aa">articles · ${D.countries} countries</span></div></div><div><div class="sm" style="margin-bottom:6px">Most active</div><div class="row" style="flex-wrap:wrap;gap:8px">${D.top.map(t=>`<span class="chip">${F(t.flag)} ${t.c.replace('United States of America','United States')} <b style="color:#ff9a4d">${t.n}</b></span>`).join('')}</div></div><div><div class="sm" style="margin-bottom:6px">Topics</div><div class="row" style="gap:6px;flex-wrap:wrap;max-width:260px">${D.cats.slice(0,4).map(c=>`<span class="chip" style="height:26px;text-transform:capitalize">${c[0]} ${c[1]}</span>`).join('')}</div></div></div></div>`,false,'Turns the strip into a read-out of the globe: article count, countries and the most active ones (tap to open them on the globe), plus topic counts.');
const ph=(id,l,t,body)=>`<section class="fr ph" id="${id}"><div class="glow"></div>${globe(true)}${LB(l,t,'Phone')}<div style="position:absolute;left:0;right:0;bottom:0;padding:0 14px 18px">${body}</div></section>`;
const pA=ph('Ap','A','Headline bar',`<div class="card" style="padding:14px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="pct" style="background:rgba(255,122,26,.18);color:#ff9a4d;font-size:10.5px;text-transform:uppercase">Latest</span><span class="sm">${B.src} · ${B.ago}</span></div><b style="font:650 16px/1.3 Inter;display:block">${B.h}</b><div class="row" style="justify-content:space-between;margin-top:10px"><span class="row" style="gap:5px"><i style="width:18px;height:3px;border-radius:2px;background:#ff7a1a"></i><i style="width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></i><i style="width:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)"></i></span><span class="sm">swipe →</span></div></div>`);
const pB=ph('Bp','B','Headline cards',`<div style="display:flex;gap:10px;overflow:hidden">${W.slice(0,2).map(i=>`<div class="card" style="padding:13px;min-width:290px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><div class="row sm">${F(i.flag)}<span class="mono orange">${i.ago}</span></div><b style="font:650 14.5px/1.3 Inter">${i.h}</b><div class="row" style="justify-content:space-between"><span class="sm">${i.asset.n}</span>${pc(i.asset.d)}</div></div>`).join('')}</div>`);
const pC=ph('Cp','C','Ticker + chips',`<div style="border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:grid;gap:12px">${L.slice(0,3).map(i=>`<div><div class="row">${F(i.flag)}<b class="mono orange">${i.ago.replace(' ago','')}</b><span class="sm">${i.src}</span></div><div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px"><b style="font:600 14px/1.3 Inter">${i.h}</b>${i.asset?pc(i.asset.d):''}</div></div>`).join('')}</div>`);
const pD=ph('Dp','D','Globe summary',`<div class="card" style="padding:14px"><div style="font:800 24px var(--num)">${D.n24} <span style="font-size:13px;font-weight:600;color:#a1a1aa">articles · ${D.countries} countries</span></div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${D.top.slice(0,4).map(t=>`<span class="chip" style="height:28px">${F(t.flag)} ${t.n}</span>`).join('')}</div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">${D.cats.slice(0,3).map(c=>`<span class="chip" style="height:26px;text-transform:capitalize">${c[0]} ${c[1]}</span>`).join('')}</div></div>`);
document.getElementById('app').innerHTML=now+A+B_+C+Dd+pA+pB+pC+pD;
</script>
