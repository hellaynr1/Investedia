const cl=v=>v>0?'u':v<0?'d':'o', tc=v=>v>0?'u':v<0?'d':'';
const pc=v=>`<span class="pct ${cl(v)}">${v>0?'↑':v<0?'↓':'↔'} ${Math.abs(v).toFixed(2)}%</span>`;
const col=v=>v>=0?'#34d399':'#f87171';

const spark=(a,w,h,c,fill)=>{const mn=Math.min(...a),mx=Math.max(...a),X=i=>i/(a.length-1)*w,Y=v=>h-3-(v-mn)/(mx-mn||1)*(h-6);const d=a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fill?`<path d="${d}L${w} ${h}L0 ${h}Z" fill="${c}" opacity=".12"/>`:''}<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const avg=r=>r.rows.reduce((s,a)=>s+a.d,0)/r.rows.length;
const LB=(l,t,s)=>`<div class="lab"><i>${l}</i>${t}${s?` <span style="font-weight:600;font-size:14px">· ${s}</span>`:''}</div>`;
const fr=(id,l,t,s,body,ph,note)=>`<section class="fr ${ph?'ph':''}" id="${id}"><div class="glow"></div>${LB(l,t,s)}${note?`<div class="note">${note}</div>`:''}<div class="in">${body}</div></section>`;
const range=a=>{const mn=Math.min(...a.sp),mx=Math.max(...a.sp);return {mn,mx,pos:(a.p-mn)/(mx-mn||1)*100}};
const idxTable=(r,compact)=>`<table><tr><th>Index</th><th class="r">Price</th><th class="r">Today</th>${compact?'':'<th>1-month range</th>'}<th class="r">Week</th></tr>${r.rows.map(a=>{const g=range(a);return `<tr><td><div class="row">${F(a.cc)}<b>${a.n}</b></div></td><td class="r">${num(a.p)}</td><td class="r">${pc(a.d)}</td>${compact?'':`<td style="width:230px"><div class="bar"><i style="left:calc(${g.pos}% - 4px)"></i></div></td>`}<td class="r">${spark(a.sp,compact?60:90,26,col(a.w))}</td></tr>`}).join('')}</table>`;
const head=(t,s)=>`<div class="ttl">Markets</div><h1 style="margin:2px 0 12px;font-size:28px;letter-spacing:-.02em">${t}</h1>${s||''}`;
const mainTabs=`<div class="seg" style="margin-bottom:14px"><span>Sectors</span><span class="on">Indices</span><span>Commodities</span><span>Crypto</span><span>FX</span></div>`;
// ---- INDICES ----
const idxA=fr('idx-A','A','Indices · Region tabs','PC',head('Indices')+mainTabs+`<div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="seg">${['Americas','Europe','Asia-Pacific'].map((x,i)=>`<span class="${i==1?'on':''}">${x}</span>`).join('')}<span>All</span></div><span class="sm">${IDX[1].rows.length} indices · average ${pc(avg(IDX[1]))}</span></div><div class="card" style="padding:6px 16px">${idxTable(IDX[1])}</div>`,false,'One button row switches the region. Only that region\'s table shows, so no scrolling past other continents. "All" keeps the old long page.');
const idxB=fr('idx-B','B','Indices · Region cards','PC',head('Indices')+mainTabs+`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">${IDX.map((r,i)=>{const best=[...r.rows].sort((a,b)=>b.d-a.d)[0];return `<div class="card" style="padding:14px 16px;${i==1?'border-color:#fff;background:rgba(255,255,255,.09)':''}"><div class="row" style="justify-content:space-between"><b style="font-size:16px">${r.r}</b>${pc(avg(r))}</div><div class="sm" style="margin:2px 0 8px">${r.rows.length} indices · best ${best.n} ${best.d>0?'+':''}${best.d.toFixed(2)}%</div>${spark(r.rows[0].sp,300,34,col(avg(r)),true)}</div>`}).join('')}</div><div class="card" style="padding:6px 16px"><div class="ttl" style="padding:10px 10px 0">Europe</div>${idxTable(IDX[1])}</div>`,false,'Three region cards double as the switch and as an overview (average move, best index, sparkline). Click one and the table below changes.');
const idxC=fr('idx-C','C','Indices · Region button','PC',head('Indices')+mainTabs+`<div class="row" style="margin-bottom:8px;gap:8px"><span class="seg"><span>‹</span></span><span class="seg"><span class="on" style="display:flex;gap:8px;align-items:center">Region: Europe ▾</span></span><span class="seg"><span>›</span></span><span class="sm" style="margin-left:8px">${IDX[1].rows.length} indices · average ${pc(avg(IDX[1]))}</span></div><div class="card" style="padding:6px 16px">${idxTable(IDX[1])}</div><div class="pop" style="left:96px;top:222px;width:300px">${IDX.map((r,i)=>`<div class="row" style="padding:10px 12px;border-radius:12px;justify-content:space-between;${i==1?'background:rgba(255,255,255,.1)':''}"><b>${r.r}</b><span class="row">${spark(r.rows[0].sp,50,18,col(avg(r)))}${pc(avg(r))}</span></div>`).join('')}<div class="row" style="padding:10px 12px;border-radius:12px"><b>All regions</b></div></div>`,false,'One compact button (with ‹ › to step through regions). The menu shows each region\'s average move.');
const phIdx=(kind)=>{const r=IDX[1];const rows=r.rows.map(a=>`<div class="row" style="padding:12px 0;border-top:1px solid rgba(255,255,255,.08)">${F(a.cc)}<div style="flex:1;min-width:0"><b style="font-size:14px">${a.n}</b><div class="sm">${num(a.p)}</div></div>${spark(a.sp,52,24,col(a.w))}${pc(a.d)}</div>`).join('');
 const top=`<div class="ttl">Markets</div><h1 style="margin:2px 0 10px;font-size:24px">Indices</h1><div class="seg" style="margin-bottom:12px;max-width:100%;overflow:hidden"><span>Sectors</span><span class="on">Indices</span><span>Commod.</span></div>`;
 if(kind=='A')return top+`<div class="seg" style="margin-bottom:10px;width:100%;display:flex">${['Americas','Europe','Asia'].map((x,i)=>`<span style="flex:1;text-align:center;padding:8px 4px;${i==1?'':''}" class="${i==1?'on':''}">${x}</span>`).join('')}</div>`+rows;
 if(kind=='B')return top+`<div style="display:flex;gap:8px;overflow:hidden;margin-bottom:12px">${IDX.map((r,i)=>`<div class="card" style="padding:12px;min-width:150px;${i==1?'border-color:#fff':''}"><b>${r.r}</b><div style="margin:4px 0">${pc(avg(r))}</div>${spark(r.rows[0].sp,120,26,col(avg(r)),true)}</div>`).join('')}</div><div class="ttl" style="margin-bottom:2px">Europe</div>`+rows;
 return top+`<div class="row" style="margin-bottom:8px"><span class="seg" style="flex:1"><span class="on" style="flex:1;text-align:center">Region: Europe ▾</span></span></div>`+rows+`<div class="pop" style="left:14px;right:14px;bottom:14px;padding:12px;background:#141418"><div class="ttl" style="padding:2px 6px 8px">Choose a region</div>${IDX.map((r,i)=>`<div class="row" style="padding:12px;border-radius:12px;justify-content:space-between;${i==1?'background:rgba(255,255,255,.1)':''}"><b>${r.r}</b>${pc(avg(r))}</div>`).join('')}</div>`;};
// ---- COMMODITIES ----
const groups=['Energy','Metals','Agriculture'];
const cm=a=>`<tr><td><b>${a.n}</b></td><td class="r">$${num(a.p, a.p<10?3:2)}</td><td class="r">${pc(a.d)}</td><td style="width:200px"><div class="bar"><i style="left:calc(${range(a).pos}% - 4px)"></i></div></td><td class="r">${spark(a.sp,90,26,col(a.w))}</td></tr>`;
const cmdA=fr('cmd-A','A','Commodities · Grouped table','PC',head('Commodities')+`<div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="seg"><span>All</span><span class="on">Energy</span><span>Metals</span><span>Agriculture</span></div><span class="sm">5 energy markets · average ${pc(CMD.filter(c=>c.g=='Energy').reduce((s,c)=>s+c.d,0)/5)}</span></div><div class="card" style="padding:6px 16px"><table><tr><th>Commodity</th><th class="r">Price</th><th class="r">Today</th><th>1-month range</th><th class="r">Week</th></tr>${CMD.filter(c=>c.g=='Energy').map(cm).join('')}</table></div>`,false,'Same calm table as indices: filter chips by group, price, today, range bar, week line. 15 cards become one scannable list.');
const maxd=Math.max(...CMD.map(c=>Math.abs(c.d)));
const tileC=a=>{const k=Math.abs(a.d)/maxd,bg=a.d>=0?`rgba(48,209,88,${.12+.4*k})`:`rgba(255,69,58,${.12+.4*k})`;return `<div style="background:${bg};border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:${70+Math.round(60*k)}px"><b style="font-size:14px">${a.n}</b><div><div style="font:800 ${18+Math.round(14*k)}px var(--num)">${a.d>0?'↑':'↓'} ${Math.abs(a.d).toFixed(2)}%</div><div class="sm" style="color:#d4d4d8">$${num(a.p,a.p<10?3:2)}</div></div></div>`};
const cmdB=fr('cmd-B','B','Commodities · Heat tiles','PC',head('Commodities')+`<div class="row" style="margin-bottom:12px"><div class="seg"><span class="on">Today</span><span>Week</span><span>Month</span></div><span class="sm">Tile size and colour show how big the move is</span></div>`+groups.map(g=>`<div class="ttl" style="margin:10px 0 6px">${g}</div><div style="display:grid;grid-template-columns:repeat(${g=='Energy'?5:g=='Metals'?4:6},1fr);gap:8px">${CMD.filter(c=>c.g==g).map(tileC).join('')}</div>`).join(''),false,'A heat map: the biggest movers jump out at once. Click a tile for the chart and the news behind it.');
const cmdC=fr('cmd-C','C','Commodities · Scoreboard','PC',head('Commodities')+`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${groups.map(g=>{const l=CMD.filter(c=>c.g==g).sort((a,b)=>b.d-a.d),top=l[0],avgv=l.reduce((s,c)=>s+c.d,0)/l.length;return `<div class="card" style="padding:16px"><div class="row" style="justify-content:space-between"><b style="font-size:17px">${g}</b>${pc(avgv)}</div><div class="sm" style="margin:2px 0 10px">average today · ${l.length} markets</div><div style="padding:12px;border-radius:14px;background:rgba(255,255,255,.06);margin-bottom:6px"><div class="ttl">Biggest mover</div><div class="row" style="justify-content:space-between;margin-top:4px"><b>${top.n}</b><span class="tx ${tc(top.d)}" style="font:800 22px var(--num)">${top.d>0?'↑':'↓'} ${Math.abs(top.d).toFixed(2)}%</span></div></div>${l.slice(1).map(a=>`<div class="row" style="justify-content:space-between;padding:9px 4px;border-top:1px solid rgba(255,255,255,.07)"><span>${a.n}</span><span class="row">${spark(a.sp,46,16,col(a.w))}<span class="tx ${tc(a.d)}" style="font:650 13px var(--num);width:64px;text-align:right">${a.d>0?'+':''}${a.d.toFixed(2)}%</span></span></div>`).join('')}</div>`}).join('')}</div>`,false,'Three group cards: the group\'s average move, its biggest mover highlighted, then the rest as small rows.');
const phCmd=kind=>{const top=`<div class="ttl">Markets</div><h1 style="margin:2px 0 10px;font-size:24px">Commodities</h1>`;const rows=l=>l.map(a=>`<div class="row" style="padding:11px 0;border-top:1px solid rgba(255,255,255,.08)"><div style="flex:1"><b style="font-size:14px">${a.n}</b><div class="sm">$${num(a.p,a.p<10?3:2)}</div></div>${spark(a.sp,50,22,col(a.w))}${pc(a.d)}</div>`).join('');
 if(kind=='A')return top+`<div class="seg" style="margin-bottom:10px;width:100%;display:flex">${['All','Energy','Metals','Agri'].map((x,i)=>`<span style="flex:1;text-align:center;padding:8px 2px" class="${i==1?'on':''}">${x}</span>`).join('')}</div>`+rows(CMD.filter(c=>c.g=='Energy'));
 if(kind=='B')return top+groups.slice(0,2).map(g=>`<div class="ttl" style="margin:8px 0 6px">${g}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${CMD.filter(c=>c.g==g).slice(0,4).map(tileC).join('')}</div>`).join('');
 return top+groups.slice(0,2).map(g=>{const l=CMD.filter(c=>c.g==g).sort((a,b)=>b.d-a.d),t=l[0];return `<div class="card" style="padding:14px;margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${g}</b>${pc(l.reduce((s,c)=>s+c.d,0)/l.length)}</div><div style="padding:10px;border-radius:12px;background:rgba(255,255,255,.06);margin:8px 0 2px"><div class="ttl">Biggest mover</div><div class="row" style="justify-content:space-between"><b>${t.n}</b><span class="tx ${tc(t.d)}" style="font:800 18px var(--num)">${t.d>0?'↑':'↓'} ${Math.abs(t.d).toFixed(2)}%</span></div></div>${l.slice(1,4).map(a=>`<div class="row" style="justify-content:space-between;padding:7px 2px;border-top:1px solid rgba(255,255,255,.07)"><span>${a.n}</span><span class="tx ${tc(a.d)}">${a.d>0?'+':''}${a.d.toFixed(2)}%</span></div>`).join('')}</div>`}).join('');};
const P=(id,l,t,body)=>`<section class="fr ph" id="${id}"><div class="glow"></div>${LB(l,t,'Phone')}<div class="in">${body}</div></section>`;
document.getElementById('app').innerHTML=idxA+idxB+idxC+P('idx-Ap','A','Region tabs',phIdx('A'))+P('idx-Bp','B','Region cards',phIdx('B'))+P('idx-Cp','C','Region button',phIdx('C'))+cmdA+cmdB+cmdC+P('cmd-Ap','A','Grouped table',phCmd('A'))+P('cmd-Bp','B','Heat tiles',phCmd('B'))+P('cmd-Cp','C','Scoreboard',phCmd('C'));
</script>
