<!doctype html><html lang="en"><meta charset="utf-8"><title>Design options · batch 2</title>
<style>
:root{--num:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--line:rgba(255,255,255,.13);--fg2:#a1a1aa;--fg3:#70707a;--g:#34d399;--r:#f87171}
*{box-sizing:border-box}body{margin:0;background:#050506;color:#fff;font:14px/1.45 Inter,-apple-system,system-ui,sans-serif;padding:24px;width:1180px}
.fr{position:relative;width:1100px;height:640px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0a0a0b;margin:0 0 30px}
.fr.ph{width:390px;height:780px;display:inline-block;margin-right:20px}
.glow{position:absolute;inset:0;background:radial-gradient(50% 50% at 18% 0,rgba(255,122,26,.25),transparent 70%),radial-gradient(40% 50% at 85% 8%,rgba(120,80,255,.2),transparent 70%)}
.lg{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.lg img{width:68%;height:68%;object-fit:contain}.lg.dk{background:#1c1c1f}.lg.t{font:700 14px Inter;color:#111}
.pill{display:inline-flex;align-items:center;gap:6px;font:650 12px var(--num);padding:3px 9px;border-radius:999px}.u{background:rgba(48,209,88,.16);color:#5df08a}.d{background:rgba(255,69,58,.16);color:#ff7b72}.o{background:rgba(255,255,255,.08);color:#a1a1aa}
.px{font:650 16px var(--num);letter-spacing:-.02em}.sm{color:var(--fg3);font-size:12px}
.panel{position:absolute;background:rgba(18,18,21,.92);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden}
.ttl{font:600 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 12px Inter;white-space:nowrap}.chip.on{background:#fff;color:#000;border-color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.fl{width:20px;height:14px;border-radius:3px;object-fit:cover}
.bell{position:absolute;right:30px;top:24px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.05)}
/* notifications */
.nh{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center}.nh b{font-size:17px;letter-spacing:-.02em}
.n{display:grid;gap:12px;padding:14px 20px;border-top:1px solid rgba(255,255,255,.07)}.n h4{margin:0;font:600 14px/1.35 Inter;letter-spacing:-.01em}.n .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:12px}
.unread{width:8px;height:8px;border-radius:50%;background:#ff7a1a;flex:none}
/* events */
table.ev{width:100%;border-collapse:collapse}.ev th{font:600 10.5px ui-monospace,monospace;letter-spacing:.07em;color:var(--fg3);text-transform:uppercase;text-align:left;padding:8px 10px}.ev td{padding:11px 10px;border-top:1px solid rgba(255,255,255,.07);font:500 13px var(--num)}.ev td.r,.ev th.r{text-align:right}
.imp{display:inline-flex;gap:3px}.imp i{width:6px;height:14px;border-radius:2px;background:rgba(255,255,255,.14)}.imp.h i{background:#ff453a}.imp.m i:nth-child(-n+2){background:#ff9f0a}.imp.l i:nth-child(1){background:#ffd60a}
.day{padding:14px 18px 6px;font:600 13px Inter}
.card{display:grid;grid-template-columns:62px 28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin:6px 14px;border-radius:16px;background:rgba(255,255,255,.05);border-left:4px solid #ff453a}.card.m{border-color:#ff9f0a}.card.l{border-color:#ffd60a}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 18px}.wk div{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);text-align:center;font-size:12px}.wk div.on{background:#fff;color:#000}.wk b{display:block;font:700 18px var(--num)}
</style><body><div id=app></div>
<script>
const L=(f,c)=>`<span class="lg ${c||''}"><img src="../assets/logos/${f}"></span>`;
const T=(t)=>`<span class="lg t">${t}</span>`;
const F=c=>`<img class="fl" src="../assets/globe/flags/${c}.svg">`;
const pc=(v)=>`<span class="pill ${v>0?'u':v<0?'d':'o'}">${v>0?'↑':v<0?'↓':'↔'} ${Math.abs(v).toFixed(2)}%</span>`;
const ph=(inner,filter)=>`<div class="fr ph"><div class="glow"></div>${inner}</div>`;
/* ---------- NOTIFICATIONS ---------- */
const nbase=(body)=>`<div class="fr"><div class="glow"></div><div class="bell">🔔</div><div class="panel" style="right:30px;top:76px;width:440px">${body}</div></div>`;
const NA=nbase(`<div class="nh"><b>Notifications</b><span class="sm">Mark all read</span></div>`+[['Wall Street launches wave of thematic ETFs to chase AI and defence flows','Reuters','2 h ago',[['NVDA',-0.59],['SMH',-1.1]]],['Oil rises $2 on Middle East supply concerns after Houthi attacks','FT','3 h ago',[['BZ',2.19],['XLE',0.8]]],['Chip export rules tighten for data-centre accelerators','Bloomberg','5 h ago',[['AMD',-2.1]]]].map((n,i)=>`<div class="n" style="grid-template-columns:36px 1fr 10px"><span class="lg dk" style="color:#fff;font-size:12px">${n[1].slice(0,2)}</span><div><h4>${n[0]}</h4><div class="m" style="margin-top:8px">${n[3].map(a=>`<span class="chip" style="height:26px">${a[0]} ${pc(a[1])}</span>`).join('')}<span class="sm">${n[1]} · ${n[2]}</span></div></div>${i<2?'<span class="unread"></span>':''}</div>`).join(''));
const NB=nbase(`<div class="nh"><b>Notifications</b><div style="display:flex;gap:6px"><span class="chip on">All</span><span class="chip">High impact</span><span class="chip">My assets</span></div></div>`+[['h','Fed officials signal no rush to cut rates after hot inflation data','USD · rates','Moved: S&P 500 ↓0.52% · EURUSD ↓0.3%','10 min ago'],['m','Oil rises $2 on Middle East supply concerns after Houthi attacks','Energy','Moved: Brent ↑2.19% · XLE ↑0.8%','3 h ago'],['l','Wall Street launches wave of thematic ETFs to chase AI and defence flows','ETFs','Moved: SMH ↓1.1%','5 h ago']].map(n=>`<div class="n" style="grid-template-columns:5px 1fr;gap:14px"><span style="border-radius:3px;background:${n[0]=='h'?'#ff453a':n[0]=='m'?'#ff9f0a':'#ffd60a'}"></span><div><div class="sm" style="display:flex;justify-content:space-between"><span>${n[0]=='h'?'High impact':n[0]=='m'?'Medium impact':'Low impact'} · ${n[2]}</span><span>${n[4]}</span></div><h4 style="margin:4px 0 6px">${n[1]}</h4><div class="sm" style="color:#c9c9d1">${n[3]}</div></div></div>`).join(''));
const NC=nbase(`<div class="nh"><b>Notifications</b><span class="sm">Today</span></div>`+[['15:42','us','Wall Street launches wave of thematic ETFs to chase AI and defence flows','NVDA ↓0.59%'],['14:10','ye','Oil rises $2 on Middle East supply concerns after Houthi attacks','Brent ↑2.19%'],['12:31','cn','Chip export rules tighten for data-centre accelerators','AMD ↓2.10%'],['09:05','de','ECB officials split on December rate path','EURUSD ↔']].map(n=>`<div class="n" style="grid-template-columns:48px 22px 1fr;gap:10px;padding:12px 20px"><span class="sm" style="font-family:ui-monospace,monospace;padding-top:2px">${n[0]}</span><span style="padding-top:3px">${F(n[1])}</span><div><h4 style="font-weight:550">${n[2]}</h4><span class="sm" style="color:#d7d7de">${n[3]}</span></div></div>`).join(''));
/* ---------- GLOBE ---------- */
function globe(mode){const cx=550,cy=330,R=290;let dots='';let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
for(let i=0;i<1700;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*R;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;const land=Math.sin(x/37)+Math.cos(y/29)+Math.sin((x+y)/53)>0.6;if(land)dots+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="1.6" fill="#8a8a93" opacity=".55"/>`}
const P={YE:[655,400,'ye'],CN:[712,285,'cn'],RU:[640,168,'ru'],US:[400,290,'us'],IL:[612,330,'il']};
const A={NVDA:[372,352,-0.59,'NVIDIA'],BRENT:[505,205,2.19,'Brent'],SMH:[760,345,-1.1,'SMH'],EUR:[585,258,-0.3,'EUR/USD'],GOLD:[450,250,0.4,'Gold']};
const arcs=[['YE','BRENT',1],['CN','NVDA',1],['RU','EUR',1],['IL','GOLD',1],['US','SMH',1]];
const arc=(a,b,bulge)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,k=len*.28*bulge;const sign=(mx-cx)*nx+(my-cy)*ny>0?1:-1;return `M${a[0]},${a[1]} Q${(mx+nx*k*sign).toFixed(0)},${(my+ny*k*sign).toFixed(0)} ${b[0]},${b[1]}`};
let lines='',nodes='',pills='';
arcs.forEach(([o,t,dir],i)=>{const a=P[o],b=A[t],up=b[2]>0,col=mode=='A'?'#ff9f43':(up?'#34d399':'#f87171'),w=mode=='B'?(1.2+Math.abs(b[2])):1.2,op=mode=='C'&&i>1?.18:.85,id='g'+mode+i;
lines+=`<path d="${arc(a,b,1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}" ${mode=='A'?'stroke-dasharray="2 5"':''}/>`;
lines+=`<circle r="3.2" fill="${col}" opacity="${op}"><animateMotion dur="${3+i*.6}s" repeatCount="indefinite" path="${arc(a,b,1)}"/></circle>`});
Object.entries(P).forEach(([k,v])=>{nodes+=`<g><circle cx="${v[0]}" cy="${v[1]}" r="14" fill="rgba(255,122,26,.18)"/><circle cx="${v[0]}" cy="${v[1]}" r="5" fill="#ff7a1a"/></g>`});
Object.entries(A).forEach(([k,v])=>{const up=v[2]>0;pills+=`<g transform="translate(${v[0]-61},${v[1]-14})"><rect width="122" height="28" rx="14" fill="rgba(16,16,19,.92)" stroke="rgba(255,255,255,.18)"/><text x="12" y="18" fill="#fff" font-family="Inter" font-weight="600" font-size="12">${v[3]}</text><text x="110" y="18" fill="${up?'#5df08a':'#ff7b72'}" font-family="Inter" font-weight="700" font-size="11" text-anchor="end">${up?'↑':'↓'}${Math.abs(v[2]).toFixed(1)}%</text></g>`});
return `<svg width="1100" height="640" style="position:absolute;inset:0"><defs><radialGradient id="sp${mode}" cx="40%" cy="35%"><stop offset="0" stop-color="#1b1b20"/><stop offset="1" stop-color="#0b0b0d"/></radialGradient></defs><circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#sp${mode})" stroke="rgba(255,122,26,.35)"/>${dots}${lines}${nodes}${pills}</svg>`}
const side=(mode)=>mode=='C'?`<div class="panel" style="left:24px;top:24px;width:330px;padding:18px"><div class="ttl">Selected article</div><h4 style="margin:8px 0;font:600 16px/1.35 Inter">Oil rises $2 on Middle East supply concerns after Houthi attacks</h4><div class="sm" style="display:flex;gap:8px;align-items:center">${F('ye')} Yemen · FT · 3 h ago</div><div class="ttl" style="margin:16px 0 8px">Affected assets</div><div style="display:grid;gap:8px"><div style="display:flex;justify-content:space-between"><span>Brent crude oil</span>${pc(2.19)}</div><div style="display:flex;justify-content:space-between"><span>Gold</span>${pc(0.4)}</div></div></div>`:`<div style="position:absolute;left:24px;bottom:24px;display:flex;gap:16px" class="sm"><span><i class="dot" style="background:#ff7a1a"></i> news origin</span><span><i class="dot" style="background:#34d399"></i> asset up</span><span><i class="dot" style="background:#f87171"></i> asset down</span></div>`;
const GL=m=>`<div class="fr"><div class="glow"></div>${globe(m)}${side(m)}<div style="position:absolute;right:24px;top:24px;display:flex;gap:6px"><span class="chip on">24H</span><span class="chip">7D</span><span class="chip">30D</span></div></div>`;
/* ---------- EVENTS ---------- */
const EVS=[['06:00','gb','GBP','Retail Sales m/m','m','-0.1%','0.5%'],['07:15','fr','EUR','French Flash Manufacturing PMI','m','50.5','50.3'],['10:00','de','EUR','ECB President Speaks','h','',''],['14:30','us','USD','Core CPI m/m','h','0.3%','0.3%'],['14:30','us','USD','Unemployment Claims','m','226K','229K'],['16:00','us','USD','Fed Chair Speaks','h','',''],['23:50','jp','JPY','Trade Balance','l','¥-0.4T','¥-0.5T']];
const impI=i=>`<span class="imp ${i}"><i></i><i></i><i></i></span>`;
const filters=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="chip on">This week</span><span class="chip">Today</span><span class="chip">Next week</span><span style="width:12px"></span><span class="chip"><i class="dot" style="background:#ff453a"></i> High</span><span class="chip"><i class="dot" style="background:#ff9f0a"></i> Medium</span><span class="chip"><i class="dot" style="background:#ffd60a"></i> Low</span><span style="width:12px"></span>${['us','eu','gb','jp','cn'].map(c=>`<span class="chip">${F(c)}</span>`).join('')}</div>`;
const EA=`<div class="fr"><div class="glow"></div><div class="panel" style="left:30px;top:30px;right:30px;bottom:30px;padding:22px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:20px;letter-spacing:-.02em">Upcoming economic events</b><span class="chip">Search events</span></div>${filters}<table class="ev" style="margin-top:14px"><tr><th>Time</th><th>Currency</th><th>Event</th><th>Impact</th><th class="r">Forecast</th><th class="r">Previous</th></tr>${EVS.map(e=>`<tr><td>${e[0]}</td><td>${F(e[1])} ${e[2]}</td><td>${e[3]}</td><td>${impI(e[4])}</td><td class="r">${e[5]||'—'}</td><td class="r">${e[6]||'—'}</td></tr>`).join('')}</table></div></div>`;
const EB=`<div class="fr"><div class="glow"></div><div class="panel" style="left:30px;top:30px;right:30px;bottom:30px;display:grid;grid-template-columns:230px 1fr"><div style="padding:22px;border-right:1px solid rgba(255,255,255,.08)"><b style="font-size:18px">Filters</b><div class="ttl" style="margin:18px 0 8px">Impact</div><div style="display:grid;gap:8px"><span class="chip on" style="justify-content:flex-start"><i class="dot" style="background:#ff453a"></i> High</span><span class="chip" style="justify-content:flex-start"><i class="dot" style="background:#ff9f0a"></i> Medium</span><span class="chip" style="justify-content:flex-start"><i class="dot" style="background:#ffd60a"></i> Low</span></div><div class="ttl" style="margin:18px 0 8px">Region</div><div style="display:flex;flex-wrap:wrap;gap:6px">${['us','eu','gb','jp','cn','au','ch'].map(c=>`<span class="chip">${F(c)}</span>`).join('')}</div><div class="ttl" style="margin:18px 0 8px">Only</div><span class="chip">My watchlist</span></div><div style="overflow:hidden"><div class="day">Friday 23 October <span class="sm">· 7 events</span></div>${EVS.slice(0,4).map(e=>`<div class="card ${e[4]}"><span style="font:600 13px ui-monospace,monospace">${e[0]}</span>${F(e[1])}<div><b style="font:600 14px Inter">${e[3]}</b><div class="sm">${e[2]} · ${e[4]=='h'?'High':e[4]=='m'?'Medium':'Low'} impact</div></div><span class="sm">${e[5]?'Fcst '+e[5]+' · Prev '+e[6]:''}</span></div>`).join('')}</div></div></div>`;
const EC=`<div class="fr"><div class="glow"></div><div class="panel" style="left:30px;top:30px;right:30px;bottom:30px;padding:22px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:20px;letter-spacing:-.02em">Upcoming economic events</b><span class="chip">⚙ Filters · 2</span></div><div class="wk">${[['Mon','19',1],['Tue','20',2],['Wed','21',0],['Thu','22',3],['Fri','23',7],['Sat','24',0],['Sun','25',0]].map((d,i)=>`<div class="${i==4?'on':''}">${d[0]}<b>${d[1]}</b><span style="font-size:11px;opacity:.7">${d[2]} events</span></div>`).join('')}</div><div style="margin-top:16px;display:grid;gap:2px">${EVS.map(e=>`<div style="display:grid;grid-template-columns:56px 24px 1fr 90px 100px;gap:12px;align-items:center;padding:11px 8px;border-radius:12px;font:500 13px var(--num)"><span class="sm">${e[0]}</span>${F(e[1])}<span>${e[3]}</span>${impI(e[4])}<span class="sm" style="text-align:right">${e[5]?'Fcst '+e[5]:''}</span></div>`).join('')}</div></div></div>`;
/* ---------- SEARCH (phone) ---------- */
const bg=`<svg width="390" height="780" style="position:absolute;inset:0;filter:blur(7px);opacity:.9"><circle cx="195" cy="520" r="250" fill="#0d0d10" stroke="rgba(255,122,26,.4)"/><circle cx="260" cy="500" r="60" fill="rgba(255,122,26,.25)"/><circle cx="120" cy="560" r="40" fill="rgba(255,122,26,.2)"/><circle cx="300" cy="620" r="30" fill="rgba(255,122,26,.25)"/></svg>`;
const sbar=(sel)=>`<div style="position:absolute;left:0;right:0;top:0;padding:18px 18px 10px;background:rgba(10,10,12,.55);backdrop-filter:blur(18px)"><div style="display:flex;align-items:center;gap:10px;height:44px"><span>🔍</span><span style="color:#8b8b94;font-size:16px;flex:1">Search assets, countries &amp; articles</span><span class="sm" style="border:1px solid var(--line);border-radius:7px;padding:2px 6px">esc</span></div><div style="display:flex;gap:7px;overflow:hidden;margin-top:8px">${['All','Companies','Crypto','Indices','Commodities'].map(c=>`<span class="chip ${c==sel?'on':''}">${c}</span>`).join('')}</div></div>`;
const co=[['TSLA.svg','Tesla Inc','TSLA',339.43,-1.48],['AAPL.svg','Apple Inc','AAPL',307.38,0.05],['META.svg','Meta Platforms','META',612.1,-0.9],['NVDA.svg','NVIDIA Corp','NVDA',188.29,-0.59],['MSFT.svg','Microsoft','MSFT',512.4,0.22],['AMZN.png','Amazon','AMZN',231.2,0.8],['GOOGL.svg','Alphabet','GOOGL',205.7,-0.3]];
const row=(c)=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0">${L(c[0])}<div style="flex:1;min-width:0"><b style="font-size:15px">${c[1]}</b><div class="sm">${c[2]} · Company</div></div><div style="text-align:right"><div class="px">$${c[3].toFixed(2)}</div>${pc(c[4])}</div></div>`;
const SA=ph(bg+sbar('Companies')+`<div style="position:absolute;left:18px;right:18px;top:132px"><div class="ttl" style="margin-bottom:6px">Largest companies</div>${co.map(row).join('')}</div>`);
const SB=ph(bg+sbar('Companies')+`<div style="position:absolute;left:18px;right:18px;top:132px"><div class="ttl" style="margin-bottom:10px">Most searched</div><div style="display:flex;gap:14px;margin-bottom:14px">${co.slice(0,5).map(c=>`<div style="text-align:center;width:52px">${L(c[0]).replace('width','width')}<div class="sm" style="margin-top:4px">${c[2]}</div></div>`).join('')}</div><div class="ttl" style="margin-bottom:6px">Largest companies</div>${co.slice(0,6).map(row).join('')}</div>`);
const artS=ph(bg+sbar('Articles')+`<div style="position:absolute;left:18px;right:18px;top:132px"><div class="ttl" style="margin-bottom:6px">Recent articles</div>${[['Wall Street launches wave of thematic ETFs','Reuters · 2 h ago'],['Oil rises $2 on Middle East supply concerns','FT · 3 h ago'],['Chip export rules tighten for accelerators','Bloomberg · 5 h ago'],['ECB officials split on December rate path','FT · 7 h ago']].map(a=>`<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)"><b style="font:600 15px/1.35 Inter">${a[0]}</b><div class="sm" style="margin-top:3px">${a[1]}</div></div>`).join('')}</div>`);
const H=(t,sub)=>`<h2 style="font:700 20px Inter;margin:30px 0 4px">${t}</h2><div class="sm" style="margin-bottom:12px">${sub}</div>`;
app.innerHTML=H('Notifications · 3 options','Replaces the plain "2 h ago headline" row')+`<div id="NA">${NA}</div><div id="NB">${NB}</div><div id="NC">${NC}</div>`+H('Globe connections · 3 options','News → asset lines, always visible')+`<div id="GA">${GL('A')}</div><div id="GB">${GL('B')}</div><div id="GC">${GL('C')}</div>`+H('Economic events · 3 options','Filters: impact, region, date')+`<div id="EA">${EA}</div><div id="EB">${EB}</div><div id="EC">${EC}</div>`+H('Search on phone · 2 options + articles','Blurred globe behind, circle logos')+`<div id="SS">${SA}${SB}${artS}</div>`;
</script>
