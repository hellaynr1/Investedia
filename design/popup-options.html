<!doctype html><html lang="en"><meta charset="utf-8"><title>Pop-up design options</title>
<style>
:root{--num:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--line:rgba(255,255,255,.14);--fg2:#a1a1aa;--fg3:#6b6b74}
*{box-sizing:border-box}body{margin:0;background:#050506;color:#fff;font:14px/1.45 Inter,-apple-system,system-ui,sans-serif;padding:32px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}h2{font-size:15px;margin:36px 0 10px;color:#fff;letter-spacing:-.01em}h2 small{color:var(--fg2);font-weight:400;margin-left:8px}
.note{color:var(--fg2);max-width:760px}
.frame{position:relative;width:1180px;height:720px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0a0a0b}
.bg{position:absolute;inset:0;filter:blur(18px) saturate(1.2);opacity:.8;background:radial-gradient(50% 50% at 20% 0,rgba(255,122,26,.35),transparent 70%),radial-gradient(40% 50% at 85% 10%,rgba(120,80,255,.3),transparent 70%)}
.bg i{position:absolute;left:48px;right:48px;height:56px;border-radius:18px;background:rgba(255,255,255,.07)}
.ov{position:absolute;inset:0;background:rgba(6,6,8,.45);display:grid;place-items:center}
.card{background:rgba(16,16,19,.86);border:1px solid var(--line);border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.6);position:relative;overflow:hidden}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:15px}
.hd{display:flex;align-items:center;gap:12px}.lg{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.lg img{width:70%;height:70%;object-fit:contain}.lg.dk{background:#1c1c1f}
.hd b{display:block;font-size:17px;letter-spacing:-.02em}.hd small{color:var(--fg2);font-size:12px}
.px{font:700 32px/1.1 var(--num);letter-spacing:-.04em}.pill{display:inline-block;font:650 12px var(--num);padding:3px 9px;border-radius:999px}.u{background:rgba(48,209,88,.16);color:#5df08a}.d{background:rgba(255,69,58,.16);color:#ff7b72}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.seg span{padding:5px 12px;border-radius:999px;font-size:12px;color:var(--fg2)}.seg .on{background:#fff;color:#000;font-weight:600}
.chart svg{width:100%;display:block}
.st{display:grid;gap:10px}.st div{padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.05)}.st small{display:block;color:var(--fg3);font-size:11px;margin-bottom:2px}.st b{font:600 14px var(--num)}
.rg{height:5px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;margin:7px 0 3px}.rg i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.art{display:grid;gap:2px}.art div{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-radius:12px;font-size:13px}.art div:hover{background:rgba(255,255,255,.05)}.art i{width:6px;height:6px;border-radius:50%;background:#ff7a1a}.art small{color:var(--fg3)}
.btns{display:flex;gap:8px}.btn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font:600 13px Inter;display:inline-flex;align-items:center;gap:6px}.btn.p{background:#fff;color:#000;border-color:#fff}
.lab{font:600 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin:0 0 6px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg2)}.tabs span{padding:10px 0}.tabs .on{color:#fff;border-bottom:2px solid #ff7a1a}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;text-align:right;font:500 13px var(--num);border-top:1px solid rgba(255,255,255,.07)}th{font:600 10.5px ui-monospace,monospace;letter-spacing:.07em;color:var(--fg3);text-transform:uppercase;border:0}td:first-child,th:first-child{text-align:left}
.co{display:flex;align-items:center;gap:10px;font-weight:600}.co .lg{width:28px;height:28px;border-radius:8px}.co small{color:var(--fg3);font-weight:400}
.tm{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:62px;gap:6px}.tm div{border-radius:14px;padding:9px 10px;font:600 12px var(--num);display:flex;flex-direction:column;justify-content:space-between}.tm small{font-weight:500;opacity:.85}
</style><body>
<h1>Pop-up design options</h1><p class="note">Sample data for layout only. Left to right in the owner's words: smaller price, smaller chart, more details, logo that fits. Pick one option for the asset pop-up and one for the sector pop-up.</p>
<div id="app"></div>
<script>
const logo=(s,dk)=>`<span class="lg ${dk?'dk':''}"><img src="../assets/logos/${s}"></span>`;
const spark=(c,h=120,seed=1)=>{let y=60,p=[];for(let i=0;i<40;i++){y+=Math.sin(i*.7+seed)*8+ (i>25?-3:2);p.push(y)};const lo=Math.min(...p),hi=Math.max(...p);const pts=p.map((v,i)=>`${(i/39*600).toFixed(1)},${(h-8-(v-lo)/(hi-lo)*(h-16)).toFixed(1)}`);return `<svg viewBox="0 0 600 ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="g${seed}${c.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="M${pts.join(' L')} L600,${h} L0,${h}Z" fill="url(#g${seed}${c.slice(1)})"/><path d="M${pts.join(' L')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/></svg>`};
const bgrows=()=>'<div class="bg">'+Array.from({length:9},(_,i)=>`<i style="top:${60+i*70}px"></i>`).join('')+'</div>';
const arts=`<div class="art"><div><i></i><span>Nvidia suppliers raise capacity guidance for 2027</span><small>Reuters · 2h</small></div><div><i></i><span>Chip export rules tighten for data-centre accelerators</span><small>FT · 5h</small></div><div><i></i><span>Hyperscaler capex surveys point to another record year</span><small>Bloomberg · 9h</small></div></div>`;
const stats=(cols)=>`<div class="st" style="grid-template-columns:repeat(${cols},1fr)"><div><small>Day range</small><b>188,40 – 195,10</b><div class="rg"><i style="left:62%"></i></div></div><div><small>52-week range</small><b>96,30 – 212,00</b><div class="rg"><i style="left:81%"></i></div></div><div><small>Volume</small><b>212 M</b></div><div><small>Market cap</small><b>4,7 T €</b></div><div><small>P/E</small><b>41,2</b></div><div><small>Dividend yield</small><b>0,03%</b></div></div>`;
const head=`<div class="hd">${logo('NVDA.svg',1)}<div><b>NVIDIA Corp</b><small>NVDA · Nasdaq · Technology · Semiconductors</small></div></div>`;
const priceRow=`<div style="display:flex;align-items:baseline;gap:12px;margin:16px 0 4px"><span class="px">190,65 €</span><span class="pill d">↓ −3,12%</span></div><small style="color:var(--fg3)">Delayed 15 min · updated 15:00 · prices in EUR</small>`;
const A=`<div class="frame">${bgrows()}<div class="ov"><div class="card" style="width:560px;padding:24px"><span class="x">✕</span>${head}${priceRow}<div style="margin:14px 0 6px"><span class="seg"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span></span></div><div class="chart">${spark('#ff7b72',120,1)}</div><div style="margin-top:12px">${stats(3)}</div><div class="lab" style="margin:16px 0 4px">Latest articles</div>${arts}<div class="btns" style="margin-top:14px"><span class="btn p">Full chart</span><span class="btn">☆ Watch</span><span class="btn">Open full page</span></div></div></div></div>`;
const B=`<div class="frame">${bgrows()}<div class="ov" style="place-items:stretch end"><div class="card" style="width:470px;border-radius:28px 0 0 28px;padding:24px;overflow:auto"><span class="x">✕</span>${head}${priceRow}<div style="margin:14px 0 6px"><span class="seg"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span></span></div><div class="chart">${spark('#ff7b72',100,2)}</div><div class="tabs" style="margin:14px 0 12px"><span class="on">Overview</span><span>Articles · 12</span><span>Move analysis</span></div>${stats(2)}<div class="lab" style="margin:16px 0 4px">Move analysis</div><p style="margin:0;color:var(--fg2);font-size:13px">NVIDIA is down 3,12% today, 1,9× its typical daily move (21-day volatility 1,64%). Three articles name the company in the last 24 hours.</p><div class="btns" style="margin-top:14px"><span class="btn p">Full chart</span><span class="btn">☆ Watch</span></div></div></div></div>`;
const C=`<div class="frame">${bgrows()}<div class="ov"><div class="card" style="width:980px;padding:26px"><span class="x">✕</span><div style="display:grid;grid-template-columns:1.35fr 1fr;gap:26px"><div>${head}${priceRow}<div style="margin:12px 0 4px"><span class="seg"><span class="on">1D</span><span>1W</span><span>1M</span><span>1Y</span></span></div><div class="chart">${spark('#ff7b72',190,3)}</div></div><div>${stats(2)}<div class="btns" style="margin-top:12px"><span class="btn p">Full chart</span><span class="btn">☆ Watch</span><span class="btn">Open page</span></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px"><div><div class="lab">Move analysis</div><p style="margin:0;color:var(--fg2);font-size:13px">NVIDIA is down 3,12% today, 1,9× its typical daily move. Three articles name the company in the last 24 hours.</p></div><div><div class="lab">Latest articles</div>${arts}</div></div></div></div></div>`;
const rows=[['NVDA.svg','NVIDIA','NVDA','190,65 €','−2,81%','d'],['AVGO.svg','Broadcom','AVGO','293,52 €','−2,72%','d'],['AMD.svg','AMD','AMD','141,10 €','−2,10%','d'],['INTC.svg','Intel','INTC','78,59 €','−5,34%','d'],['ASML.png','ASML','ASML','1 440,04 €','−3,84%','d'],['AAPL.svg','Apple','AAPL','307,38 €','+0,05%','u']];
const trs=rows.map(r=>`<tr><td><span class="co">${logo(r[0],0)}<span>${r[1]} <small>${r[2]}</small></span></span></td><td>${r[3]}</td><td><span class="pill ${r[5]}">${r[5]=='u'?'↑':'↓'} ${r[4].slice(1)}</span></td><td style="color:var(--fg3)">━━╲╱━</td></tr>`).join('');
const sechead=`<div class="hd"><span class="lg dk" style="color:#fff;font-size:18px">▦</span><div><b style="font-size:20px">Semiconductors</b><small>Sector fund SMH · 24 tracked companies</small></div></div>`;
const secstats=`<div style="display:flex;gap:10px;margin:16px 0 8px">${['Today|↓ −3,72%|d','Week|↓ −4,09%|d','Month|↓ −10,9%|d'].map(s=>{const [a,b,c]=s.split('|');return `<div style="flex:1;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.05)"><small style="color:var(--fg3)">${a}</small><div class="pill ${c}" style="margin-top:4px;font-size:13px">${b}</div></div>`}).join('')}</div>`;
const S1=`<div class="frame">${bgrows()}<div class="ov"><div class="card" style="width:760px;padding:26px"><span class="x">✕</span>${sechead}${secstats}<div class="chart">${spark('#ff7b72',110,4)}</div><div class="lab" style="margin:14px 0 2px">Largest movers · today</div><table><tr><th>Company</th><th>Price</th><th>Today</th><th>Week</th></tr>${trs}</table><div class="btns" style="margin-top:14px"><span class="btn p">Articles on this sector</span><span class="btn">Follow sector</span></div></div></div></div>`;
const tcol=['#7a2a2a','#8a3434','#6b2a2f','#a03a3a','#7f2f35','#2f6b45'];
const S2=`<div class="frame">${bgrows()}<div class="ov"><div class="card" style="width:900px;padding:26px"><span class="x">✕</span><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px"><div>${sechead}${secstats}<div class="chart">${spark('#ff7b72',90,5)}</div></div><div><div class="lab">Heat map · size = market cap, colour = today's move</div><div class="tm"><div style="grid-column:span 3;grid-row:span 2;background:${tcol[0]}">NVIDIA<small>↓ 2,81%</small></div><div style="grid-column:span 2;grid-row:span 2;background:${tcol[1]}">Broadcom<small>↓ 2,72%</small></div><div style="grid-column:span 1;grid-row:span 2;background:${tcol[2]}">AMD<small>↓ 2,1%</small></div><div style="grid-column:span 2;background:${tcol[3]}">Intel<small>↓ 5,34%</small></div><div style="grid-column:span 2;background:${tcol[4]}">ASML<small>↓ 3,84%</small></div><div style="grid-column:span 2;background:${tcol[5]}">Apple<small>↑ 0,05%</small></div></div></div></div><div class="lab" style="margin:18px 0 2px">Companies</div><table><tr><th>Company</th><th>Price</th><th>Today</th><th>Week</th></tr>${trs.split('</tr>').slice(0,3).join('</tr>')}</tr></table><div class="btns" style="margin-top:14px"><span class="btn p">Articles on this sector</span><span class="btn">Follow sector</span></div></div></div></div>`;
document.getElementById('app').innerHTML=`<h2>Asset pop-up · Option A<small>Compact card, 560 px, price 32 px, small chart, six key figures, three articles</small></h2>${A}<h2>Asset pop-up · Option B<small>Side sheet from the right, tabs for Overview, Articles and Move analysis</small></h2>${B}<h2>Asset pop-up · Option C<small>Wide dashboard: chart and figures side by side, analysis and articles below</small></h2>${C}<h2>Sector pop-up · Option 1<small>Centred sheet: stats, chart and the movers table</small></h2>${S1}<h2>Sector pop-up · Option 2<small>Heat map of the companies next to the stats, table below</small></h2>${S2}`;
</script>
