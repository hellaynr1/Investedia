<!doctype html><html lang="en"><meta charset="utf-8"><title>Design options 7 · globe ideas</title>
<style>
:root{--num:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;--line:rgba(255,255,255,.13);--fg2:#a1a1aa;--fg3:#70707a;--acc:#ff7a1a}
*{box-sizing:border-box}body{margin:0;background:#050506;color:#fff;font:14px/1.45 Inter,-apple-system,system-ui,sans-serif;padding:24px}
.fr{position:relative;width:1100px;height:690px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0a0a0b;margin:0 0 28px}
#other{height:540px}.fr.ph{width:390px;height:800px;display:inline-block;margin-right:18px;vertical-align:top}
.glow{position:absolute;inset:0;background:radial-gradient(50% 50% at 18% 0,rgba(255,122,26,.16),transparent 70%),radial-gradient(40% 50% at 85% 8%,rgba(120,80,255,.12),transparent 70%)}
.lab{position:absolute;left:14px;top:12px;z-index:30;background:var(--acc);color:#000;font:800 19px Inter;padding:5px 13px;border-radius:12px;display:flex;gap:9px;align-items:center}.lab i{font-style:normal;background:#000;color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.note{position:absolute;right:14px;top:14px;z-index:30;max-width:430px;text-align:right;font-size:11.5px;color:var(--fg2)}.ph .note{display:none}
.globe{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1b1b20,#0b0b0d);border:1px solid rgba(255,122,26,.35);box-shadow:0 0 90px rgba(255,122,26,.12);overflow:hidden}
.globe i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2)}.globe .hot{width:9px;height:9px;background:#ff7a1a;box-shadow:0 0 16px 5px rgba(255,122,26,.4)}.globe .dim{background:rgba(255,255,255,.16);box-shadow:none;width:6px;height:6px}
.sm{color:var(--fg3);font-size:12px}.mono{font:600 12px 'Geist Mono',ui-monospace,monospace}.orange{color:#ff9a4d}
.fl{width:20px;height:14px;border-radius:3px;object-fit:cover;flex:none}
.pct{display:inline-flex;font:650 12px var(--num);padding:3px 9px;border-radius:999px;white-space:nowrap}.u{background:rgba(48,209,88,.16);color:#5df08a}.d{background:rgba(255,69,58,.16);color:#ff8a82}.o{background:rgba(255,255,255,.08);color:#c4c4cc}
.row{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 13px Inter;white-space:nowrap}.chip.on{background:#fff;color:#000;border-color:#fff}.chip b{color:#ff9a4d;font-weight:700}.chip.on b{color:#c2540a}
.card{background:rgba(18,18,21,.9);border:1px solid rgba(255,255,255,.1);border-radius:20px}
.abs{position:absolute}
.search{height:46px;width:380px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 16px;display:flex;align-items:center;color:var(--fg3)}
</style><body><div id=app></div>
<script>
const D={"now": "2026-10-25 23:22", "utc_h": 23.366666666666667, "lens": {"Energy": {"n": 21, "countries": 11, "top": [{"h": "Machado Returns to Venezuela as US Administration Eyes Access to Oil Reserves", "src": "ABC News Australia", "ago": "4 h ago", "flag": "ve", "asset": {"n": "WTI crude oil", "d": 3.82}}, {"h": "Markets Brace for Federal Reserve Decision, Heavy Earnings, and Energy Pressures", "src": "Investing.com", "ago": "10 h ago", "flag": "us", "asset": {"n": "S&P 500", "d": -0.52}}, {"h": "Crude Oil Near $120 Threatens Global Economic Growth and State Budgets", "src": "thehindubusinessline.com", "ago": "12 h ago", "flag": "gb", "asset": null}]}, "Central banks": {"n": 12, "countries": 5, "top": [{"h": "Markets Brace for Federal Reserve Decision, Heavy Earnings, and Energy Pressures", "src": "Investing.com", "ago": "10 h ago", "flag": "us", "asset": {"n": "S&P 500", "d": -0.52}}, {"h": "City Economists Lower Bank of England Peak Interest Rate Projections", "src": "theguardian.com", "ago": "10 h ago", "flag": "gb", "asset": null}, {"h": "RBI Does Not Target Specific Rupee Exchange Rate, Governor Malhotra Says", "src": "heraldglobe.com", "ago": "12 h ago", "flag": "in", "asset": null}]}, "Trade & tariffs": {"n": 13, "countries": 9, "top": [{"h": "White House Adviser Hassett Says US and Canada Are Very Close to Trade Deal", "src": "Investing.com", "ago": "4 h ago", "flag": "us", "asset": null}, {"h": "US Blockade Reduces Iran Floating Oil Inventory to Zero", "src": "foxnews.com", "ago": "14 h ago", "flag": "ir", "asset": null}, {"h": "Netanyahu Suggests Israel Could Use Crypto to Evade Sanctions", "src": "grenadachronicle.com", "ago": "4 h ago", "flag": "il", "asset": null}]}, "Earnings": {"n": 17, "countries": 8, "top": [{"h": "S&P 500 Companies Prepare Earnings Reports Amid Shaking Confidence", "src": "MarketWatch", "ago": "9 h ago", "flag": "us", "asset": {"n": "S&P 500", "d": -0.52}}, {"h": "Markets Brace for Federal Reserve Decision, Heavy Earnings, and Energy Pressures", "src": "Investing.com", "ago": "10 h ago", "flag": "us", "asset": {"n": "S&P 500", "d": -0.52}}, {"h": "US Blockade Reduces Iran Floating Oil Inventory to Zero", "src": "foxnews.com", "ago": "14 h ago", "flag": "ir", "asset": null}]}}, "us": {"n": 50, "top": [{"h": "White House Adviser Hassett Says US and Canada Are Very Close to Trade Deal", "src": "Investing.com", "ago": "4 h ago", "asset": null}, {"h": "Meta Shares Fall as Rising AI Spending Rattles Investors", "src": "australiannews.net", "ago": "5 h ago", "asset": {"n": "Meta Platforms", "d": -0.96}}, {"h": "S&P 500 Companies Prepare Earnings Reports Amid Shaking Confidence", "src": "MarketWatch", "ago": "9 h ago", "asset": {"n": "S&P 500", "d": -0.52}}]}, "ev": [{"t": "Federal Funds Rate", "at": "2026-10-28T18:00:00Z", "fc": "4.00%", "prev": "4.00%"}, {"t": "FOMC Statement", "at": "2026-10-28T18:00:00Z", "fc": "", "prev": ""}, {"t": "FOMC Press Conference", "at": "2026-10-28T18:30:00Z", "fc": "", "prev": ""}], "idx": {"^GSPC": {"n": "S&P 500", "d": -0.52}, "^IXIC": {"n": "Nasdaq Composite", "d": -0.21}, "^DJI": {"n": "Dow Jones", "d": -1.23}, "^FTSE": {"n": "FTSE 100", "d": -0.32}, "^GDAXI": {"n": "DAX 40", "d": -0.75}, "^N225": {"n": "Nikkei 225", "d": -0.34}}, "n48": 160, "mood": {"up": 9, "down": 9, "mixed": 16}, "assets": {"BZ=F": {"n": "Brent crude oil", "d": -1.3}, "CL=F": {"n": "WTI crude oil", "d": 3.82}, "NG=F": {"n": "Natural gas", "d": 9.08}}};
const F=c=>c?`<img class="fl" src="../assets/globe/flags/${c}.svg">`:'';
const pc=v=>`<span class="pct ${v>0?'u':v<0?'d':'o'}">${v>0?'↑':v<0?'↓':'↔'} ${Math.abs(v).toFixed(2)}%</span>`;
let seed=9;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const globe=(x,y,R,pins)=>{let d='';for(let i=0;i<300;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*R*.97;d+=`<i style="left:${R+Math.cos(a)*r}px;top:${R+Math.sin(a)*r}px"></i>`}return `<div class="globe" style="left:${x}px;top:${y}px;width:${R*2}px;height:${R*2}px">${d}${pins||''}</div>`};
const pin=(x,y,hot=true)=>`<i class="${hot?'hot':'dim'}" style="left:${x}px;top:${y}px"></i>`;
const LB=(l,t,s)=>`<div class="lab"><i>${l}</i>${t}${s?` <span style="font-weight:600;font-size:13px">· ${s}</span>`:''}</div>`;
const fr=(id,l,t,s,body,note,ph)=>`<section class="fr ${ph?'ph':''}" id="${id}"><div class="glow"></div>${LB(l,t,s)}${note?`<div class="note">${note}</div>`:''}${body}</section>`;
const cats=['All','Markets','Companies','Economy','Technology','Commodities','Geopolitics'];
const topbar=(extra)=>`<div class="abs" style="left:30px;top:62px"><div class="search">Search assets, countries &amp; articles</div></div>${extra||''}`;
const L=D.lens, lensNames=Object.keys(L);
const art=(i,sz)=>`<div style="padding:12px 0;border-top:1px solid rgba(255,255,255,.08)"><div class="row sm">${F(i.flag)}<span class="mono orange">${i.ago}</span><span>· ${i.src}</span></div><b style="font:650 ${sz||14}px/1.3 Inter;display:block;margin:4px 0">${i.h}</b>${i.asset?`<div class="row" style="justify-content:space-between"><span class="sm">${i.asset.n}</span>${pc(i.asset.d)}</div>`:''}</div>`;
// ---------- LENSES ----------
const lensChips=(on)=>`<div class="abs row" style="left:30px;top:118px;gap:8px;flex-wrap:wrap;width:700px"><span class="chip ${on==-1?'on':''}">All <b>${D.n48}</b></span>${lensNames.map((k,i)=>`<span class="chip ${on==i?'on':''}">${k} <b>${L[k].n}</b></span>`).join('')}</div>`;
const lensPins=`${pin(250,300)}${pin(330,360)}${pin(520,250)}${pin(560,300)}${pin(610,270)}${pin(420,420,false)}${pin(180,200,false)}${pin(700,380,false)}${pin(300,470,false)}`;
const lA=fr('lens-A','A','Topic lenses · chips with counts','PC',topbar()+lensChips(0)+globe(60,200,290,lensPins)+`<div class="abs card" style="right:26px;top:70px;width:340px;padding:16px 18px;bottom:26px"><div class="ttl sm" style="letter-spacing:.08em;text-transform:uppercase">Energy lens</div><div style="font:800 26px var(--num);margin:4px 0">${L.Energy.n} <span style="font-size:14px;font-weight:600;color:#a1a1aa">articles · ${L.Energy.countries} countries</span></div>${L.Energy.top.map(i=>art(i)).join('')}</div>`,'Replaces the category bar. Each lens shows how many articles it holds; choosing one dims every other pin and lists its most important articles with the real move of the asset they name.');
const lB=fr('lens-B','B','Topic lenses · summary card','PC',topbar()+`<div class="abs row" style="left:30px;top:118px;gap:8px">${['All'].concat(lensNames).map((k,i)=>`<span class="chip ${i==1?'on':''}">${k}</span>`).join('')}</div>`+globe(380,150,270,lensPins)+`<div class="abs card" style="left:30px;top:180px;width:300px;padding:18px"><div class="sm" style="text-transform:uppercase;letter-spacing:.08em">Energy lens</div><div style="font:800 28px var(--num);margin:4px 0">${L.Energy.n}<span style="font-size:14px;font-weight:600;color:#a1a1aa"> articles</span></div><div class="sm">${L.Energy.countries} countries · last 48 hours</div><div style="margin:14px 0 6px" class="sm">Markets they name</div>${Object.values(D.assets).map(a=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)"><b style="font-size:13.5px">${a.n}</b>${pc(a.d)}</div>`).join('')}</div><div class="abs row" style="left:380px;right:30px;bottom:26px;gap:10px;justify-content:center">${lensNames.map((k,i)=>`<span class="card" style="padding:10px 16px;border-radius:14px;${i==0?'border-color:#ff7a1a':''}"><b>${k}</b> <span class="sm">${L[k].n}</span></span>`).join('')}</div>`,'The lens is explained on the globe itself: article count, countries and the real moves of the markets the articles name. Lens switcher sits under the globe.');
const phLens=(v)=>`<section class="fr ph"><div class="glow"></div>${LB(v,v=='A'?'Lens chips':'Summary card','Phone')}<div class="abs" style="left:14px;right:14px;top:62px;display:flex;gap:6px;overflow:hidden"><span class="chip on">Energy <b>${L.Energy.n}</b></span><span class="chip">Central banks <b>${L['Central banks'].n}</b></span><span class="chip">Trade</span></div>${globe(55,120,140,pin(80,100)+pin(120,150)+pin(190,90)+pin(210,130,false)+pin(60,180,false))}<div class="abs card" style="left:12px;right:12px;bottom:12px;padding:14px">${v=='A'?`<div style="font:800 22px var(--num)">${L.Energy.n} <span style="font-size:13px;font-weight:600;color:#a1a1aa">articles · ${L.Energy.countries} countries</span></div>${art(L.Energy.top[0],14)}`:`<div style="font:800 22px var(--num)">${L.Energy.n} <span style="font-size:13px;font-weight:600;color:#a1a1aa">articles</span></div>${Object.values(D.assets).map(a=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)"><b style="font-size:13.5px">${a.n}</b>${pc(a.d)}</div>`).join('')}`}</div></section>`;
// ---------- COUNTRY BRIEFING ----------
const us=D.us, usPins=pin(215,235)+pin(250,300)+pin(300,260)+pin(180,300,false)+pin(500,300)+pin(560,260)+pin(610,330,false);
const usShape=`<div class="abs" style="left:150px;top:290px;width:170px;height:110px;border-radius:40% 55% 45% 50%;background:rgba(255,122,26,.22);border:1px solid rgba(255,122,26,.6);transform:rotate(-8deg)"></div>`;
const bA=fr('brief-A','A','Country briefing · hover card','PC',topbar()+globe(60,160,300,usPins)+usShape+`<div class="abs card" style="left:350px;top:230px;width:340px;padding:16px"><div class="row" style="margin-bottom:6px">${F('us')}<b style="font-size:17px">United States</b><span class="sm" style="margin-left:auto">${us.n} articles</span></div>${us.top.map(i=>`<div style="padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font:600 13px/1.3 Inter">${i.h}</div>`).join('')}<div class="row" style="justify-content:space-between;margin-top:8px"><span class="sm">S&amp;P 500</span>${pc(D.idx['^GSPC'].d)}</div><div class="sm" style="margin-top:8px">Next: <b style="color:#fff">${D.ev[1].t}</b> in 2 d 18 h</div></div>`,'Hover a country: a compact card with its headlines, how its main index moved and the next high-impact release. Click opens the full briefing.');
const mood=D.mood,tot=mood.up+mood.down+mood.mixed||1;
const bB=fr('brief-B','B','Country briefing · side panel','PC',topbar()+globe(40,160,300,usPins)+usShape+`<div class="abs card" style="right:26px;top:70px;bottom:26px;width:400px;padding:20px;overflow:hidden"><div class="row" style="margin-bottom:2px">${F('us')}<b style="font-size:22px">United States</b></div><div class="sm">${us.n} articles in 48 hours · country briefing</div><div style="margin:16px 0 6px" class="sm" >NEWS MOOD (affected assets)</div><div style="display:flex;height:8px;border-radius:4px;overflow:hidden"><i style="width:${mood.up/tot*100}%;background:#34d399"></i><i style="width:${mood.mixed/tot*100}%;background:#8b8b94"></i><i style="width:${mood.down/tot*100}%;background:#f87171"></i></div><div class="row sm" style="justify-content:space-between;margin-top:4px"><span>↑ ${mood.up} up</span><span>↔ ${mood.mixed}</span><span>↓ ${mood.down} down</span></div><div style="margin:16px 0 4px" class="sm">MARKETS</div><div class="row" style="flex-wrap:wrap;gap:6px">${['^GSPC','^IXIC','^DJI'].map(k=>`<span class="chip" style="height:30px">${D.idx[k].n} ${pc(D.idx[k].d)}</span>`).join('')}</div><div style="margin:16px 0 0" class="sm">TOP ARTICLES</div>${us.top.slice(0,2).map(i=>art(i,13.5)).join('')}<div style="margin:6px 0 4px" class="sm">COMING UP</div>${D.ev.slice(0,2).map(e=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)"><b style="font-size:13px">${e.t}</b><span class="sm">Wed 28 Oct</span></div>`).join('')}</div>`,'A full side panel: news mood (how many article impacts point up, down or mixed), the main indices, top articles and the next releases for that country.');
const phBrief=(v)=>`<section class="fr ph"><div class="glow"></div>${LB(v,v=='A'?'Hover card':'Side panel','Phone')}${globe(55,70,140,pin(70,100)+pin(110,140)+pin(190,100,false))}<div class="abs card" style="left:12px;right:12px;bottom:12px;padding:14px;${v=='B'?'top:330px':''}"><div class="row">${F('us')}<b style="font-size:17px">United States</b><span class="sm" style="margin-left:auto">${us.n} articles</span></div>${v=='A'?us.top.slice(0,2).map(i=>`<div style="padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font:600 13px/1.3 Inter">${i.h}</div>`).join('')+`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="sm">S&amp;P 500</span>${pc(D.idx['^GSPC'].d)}</div>`:`<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 4px"><i style="width:${mood.up/tot*100}%;background:#34d399"></i><i style="width:${mood.mixed/tot*100}%;background:#8b8b94"></i><i style="width:${mood.down/tot*100}%;background:#f87171"></i></div><div class="row sm" style="justify-content:space-between"><span>↑ ${mood.up}</span><span>↔ ${mood.mixed}</span><span>↓ ${mood.down}</span></div><div class="row" style="flex-wrap:wrap;gap:6px;margin:12px 0">${['^GSPC','^IXIC'].map(k=>`<span class="chip" style="height:28px;font-size:12px">${D.idx[k].n} ${pc(D.idx[k].d)}</span>`).join('')}</div>${art(us.top[0],13.5)}`}</div></section>`;
// ---------- NIGHT SHADE ----------
const ex=[['Sydney','au',true,'Open · opened 23:00 UTC'],['Tokyo','jp',false,'Opens in 38 min'],['Hong Kong','hk',false,'Opens in 2 h 8 min'],['London','gb',false,'Opens in 7 h 38 min'],['New York','us',false,'Opens in 14 h 8 min']];
const night=`<div class="abs" style="left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.78) 38%,rgba(255,190,120,.0) 52%,rgba(255,190,120,.07) 100%)"></div><div class="abs" style="left:38%;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(255,122,26,.35),transparent)"></div>`;
const nA=fr('night-A','A','Markets open · night shade','PC',topbar()+globe(60,160,300,pin(500,330,false)+pin(540,420,true)+pin(180,300,false)+pin(300,330,false)).replace(/<\/div>$/,night+'</div>')+`<div class="abs" style="left:520px;top:395px"><span class="chip" style="border-color:#34d399;color:#5df08a;background:rgba(14,40,26,.9)">● Sydney open</span></div><div class="abs" style="left:430px;top:300px"><span class="chip" style="background:rgba(20,20,24,.9)">Tokyo · opens in 38 min</span></div><div class="abs card" style="right:26px;top:70px;width:340px;padding:18px"><div class="sm" style="text-transform:uppercase;letter-spacing:.08em">Markets now · ${D.now} UTC</div>${ex.map(e=>`<div class="row" style="padding:10px 0;border-top:1px solid rgba(255,255,255,.08)">${F(e[1])}<b style="flex:1">${e[0]}</b><span class="sm" style="color:${e[2]?'#5df08a':'#a1a1aa'}">${e[3]}</span></div>`).join('')}</div>`,'Illustrative night side. The night shade moves with real time; exchanges that are open glow, the rest show when they open next. Click one for its index move.');
const bar=()=>{const wins=[['Sydney',23,6],['Tokyo',0,6],['Hong Kong',1.5,8],['London',8,8.5],['New York',14.5,6.5]];return `<div><div class="sm" style="margin-bottom:8px;letter-spacing:.06em">TRADING SESSIONS (UTC)</div>${wins.map(([n,s,l])=>{const a=s/24*100,b=Math.min(l/24*100,100-a),wrap=s+l>24?((s+l-24)/24*100):0;return `<div class="row" style="margin:8px 0"><span style="width:92px;font:600 13px Inter;flex:none">${n}</span><div style="position:relative;flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.08)"><i style="position:absolute;left:${a}%;width:${b}%;top:0;bottom:0;border-radius:6px;background:rgba(52,211,153,.75)"></i>${wrap?`<i style="position:absolute;left:0;width:${wrap}%;top:0;bottom:0;border-radius:6px;background:rgba(52,211,153,.75)"></i>`:''}<i style="position:absolute;left:${D.utc_h/24*100}%;top:-6px;bottom:-6px;width:2px;background:#ff7a1a"></i></div></div>`}).join('')}<div class="row sm" style="justify-content:space-between;margin-left:102px"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div><div class="row sm" style="margin-top:8px"><i style="width:2px;height:12px;background:#ff7a1a"></i> now</div></div>`};
const nB=fr('night-B','B','Markets open · session clock','PC',topbar()+globe(40,150,290,pin(560,250,false)+pin(610,300,false)+pin(180,300,false))+`<div class="abs card" style="right:26px;top:70px;width:430px;padding:20px"><div style="font:800 20px var(--num)">Sydney open · Tokyo in 38 min</div><div class="sm" style="margin:2px 0 14px">Sunday ${D.now.slice(11)} UTC · weekend: US and Europe closed until Monday</div>${bar()}</div>`,'A 24-hour session clock with the real "now" marker: shows which exchanges are open, when the next ones open, and whether it is a weekend.');
const phNight=(v)=>`<section class="fr ph"><div class="glow"></div>${LB(v,v=='A'?'Night shade':'Session clock','Phone')}${globe(55,70,140,pin(110,100,false)+pin(190,110,false)).replace('</div>','<div class="abs" style="left:0;top:0;width:130px;height:280px;background:linear-gradient(90deg,rgba(0,0,10,.6),transparent)"></div></div>')}<div class="abs card" style="left:12px;right:12px;bottom:12px;padding:14px">${v=='A'?ex.slice(0,3).map(e=>`<div class="row" style="padding:9px 0;border-top:1px solid rgba(255,255,255,.08)">${F(e[1])}<b style="flex:1">${e[0]}</b><span class="sm" style="color:${e[2]?'#5df08a':'#a1a1aa'}">${e[3]}</span></div>`).join(''):`<div style="font:800 17px var(--num)">Sydney open · Tokyo in 38 min</div>${bar()}`}</div></section>`;
// ---------- OTHER IDEAS ----------
