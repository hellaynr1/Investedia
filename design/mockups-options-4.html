<style>

.glow{position:absolute;inset:0;background:radial-gradient(50% 50% at 18% 0,rgba(255,122,26,.22),transparent 70%),radial-gradient(40% 50% at 85% 8%,rgba(120,80,255,.16),transparent 70%)}

.in{position:absolute;inset:0;padding:70px 34px 26px}.ph .in{padding:66px 16px 16px}
.pill{display:inline-flex;align-items:center;gap:5px;font:650 12px var(--num);padding:3px 9px;border-radius:999px;white-space:nowrap}.u{background:rgba(48,209,88,.16);color:#5df08a}.d{background:rgba(255,69,58,.16);color:#ff7b72}.o{background:rgba(255,255,255,.08);color:#a1a1aa}
.big.u{color:#5df08a;background:none}.big.d{color:#ff7b72;background:none}
.sm{color:var(--fg3);font-size:12px}.ttl{font:600 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 12px Inter;white-space:nowrap}.chip.on{background:#fff;color:#000;border-color:#fff}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:20px}
.lg{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font:800 12px Inter;color:#111}.lg img{width:70%;height:70%;object-fit:contain}.lg.dk{background:#1c1c1f;color:#fff}
.fl{width:20px;height:14px;border-radius:3px;object-fit:cover}
.imp{display:inline-flex;gap:3px;vertical-align:middle}.imp i{width:5px;height:13px;border-radius:2px;background:rgba(255,255,255,.14)}.imp.h i{background:#ff453a}.imp.m i:nth-child(-n+2){background:#ff9f0a}
.row{display:flex;align-items:center;gap:10px}.sp{display:block;max-width:100%;height:auto}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tri div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}.tri b{display:block;font:700 20px var(--num);margin-top:2px}
.note{position:absolute;right:14px;top:16px;z-index:20;max-width:420px;text-align:right;font-size:11.5px;color:var(--fg2)}
</style><body><div id=app></div>
