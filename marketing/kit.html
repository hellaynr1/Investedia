<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0B;--bg2:#111113;--card:#161618;--line:#26262A;--fg:#fff;--fg2:#A1A1AA;--fg3:#71717A;--acc:#FF7A1A;--up:#22C55E;--down:#F04444}
html,body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:relative;overflow:hidden;background:var(--bg)}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.pad{position:absolute;inset:0;padding:96px 96px 190px;display:flex;flex-direction:column}
.sp{flex:1;min-height:40px;max-height:240px}
.story .pad{padding:250px 96px 330px}
.story .foot{bottom:250px}
.story .row{padding:34px 34px;grid-template-columns:76px 1fr auto auto}.story .lg{width:76px;height:76px}.story .nm b{font-size:35px}.story .nm small{font-size:25px}.story .px{font-size:35px}
.story .step b{font-size:42px}.story .step small{font-size:30px}.story .lede{font-size:40px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--acc)}
h1{font-size:92px;line-height:1.02;letter-spacing:-.045em;font-weight:700}
h1 .dim{color:var(--fg3)}
.lede{font-size:36px;line-height:1.35;color:var(--fg2);letter-spacing:-.01em}
.foot{position:absolute;left:96px;right:96px;bottom:84px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--fg3)}
.brand{display:flex;align-items:center;gap:14px;color:var(--fg);font-weight:600;font-size:30px;letter-spacing:-.02em}
.mk{width:48px;height:48px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
.mk svg{width:100%;height:100%;display:block}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:32px}
.row{display:grid;grid-template-columns:64px 1fr auto auto;gap:22px;align-items:center;padding:24px 30px;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.lg{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.lg.svgbg{background:transparent}
.nm b{display:block;font-size:30px;font-weight:600;letter-spacing:-.01em}.nm small{display:block;font-size:22px;color:var(--fg3);margin-top:2px}
.px{font-size:30px;text-align:right}
.pill{font-size:24px;padding:8px 14px;border-radius:10px;min-width:128px;text-align:center}
.up{color:var(--up)}.down{color:var(--down)}
.pill.up{background:rgba(34,197,94,.12)}.pill.down{background:rgba(240,68,68,.12)}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 24px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:28px;font-weight:500}
.chip.on{border-color:var(--acc);background:rgba(255,122,26,.1)}
.ic{width:72px;height:72px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--acc)}
.ic svg{width:34px;height:34px}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 70%)}
.num{font-size:132px;font-weight:600;letter-spacing:-.05em}
.tabs{display:inline-flex;padding:6px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg2);gap:4px}
.tabs span{padding:14px 24px;border-radius:14px;font-size:26px;color:var(--fg2);font-weight:500}
.tabs span.on{background:#1e1e21;color:#fff;box-shadow:0 0 0 1.5px var(--line)}
.step{display:grid;grid-template-columns:72px 1fr;gap:26px;align-items:center}
.step .n{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:30px;font-weight:600}
.step b{font-size:36px;font-weight:600;letter-spacing:-.02em}.step small{display:block;color:var(--fg3);font-size:26px;margin-top:4px}
.hm{display:grid;gap:8px}
.hm div{border-radius:14px;display:grid;place-items:center;font-size:24px;font-family:"Geist Mono",monospace}
.cover{position:absolute;inset:0;display:grid;place-items:center}
.cover .disc{width:1000px;height:1000px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;color:var(--acc)}
.cover .disc svg{width:430px;height:430px;stroke-width:1.5}
</style></head><body><div id="c"></div>
<script>
const W = { post: [1080, 1350], story: [1080, 1920], cover: [1080, 1920], square: [1080, 1080] };

const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), eo = t => 1 - Math.pow(1 - t, 3), eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  const s = r.dataset.s, px = r.querySelector('.px'), tick = Math.floor((t - 2.6) / .9); if (tick >= 0 && (tick + i) % 3 === 0) { const base = D[s].p, j = 1 + Math.sin(tick * 7 + i) * .0007; px.textContent = fmtP(s, base * j); px.style.color = j >= 1 ? '#22C55E' : '#F04444'; } else if (t > 2.6) { px.style.color = ''; } }); };
X.v_app = ['story', () => `<div class="pad"><div id="h">${head('Get the app', 'Investedia on your<br><span class="dim">home screen.</span>')}</div><div style="display:grid;gap:44px">${[['share', 'Open investedia.com and tap Share', 'Safari on iPhone, or ⋮ in Chrome'], ['plus', 'Choose “Add to Home Screen”', 'Then tap Add'], ['phone', 'Open it like any app', 'Full screen, fast, free']].map(([i, b, t], n) => `<div class="step st" style="grid-template-columns:96px 1fr"><span class="n" style="width:96px;height:96px;color:var(--acc)"><span style="width:44px;height:44px">${ic(i)}</span></span><span><b>${b}</b><small>${t}</small></span></div>`).join('')}<div class="card st" style="padding:30px;display:flex;gap:26px;align-items:center;margin-top:10px"><span class="mk" style="width:120px;height:120px;border-radius:28px" id="appic">${MARK}</span><span><b style="font-size:34px;font-weight:600">Investedia</b><small style="display:block;color:var(--fg3);font-size:26px;margin-top:4px">Added to Home Screen</small></span><span style="margin-left:auto;width:64px;height:64px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#0A0A0B" id="ok"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></span></div></div></div>${foot('No App Store needed')}`];
