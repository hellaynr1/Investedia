<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1179px;height:2556px;background:#000;color:#f5f5f5;font-family:-apple-system,Inter,system-ui,sans-serif;overflow:hidden}
.sb{height:150px;display:flex;justify-content:space-between;align-items:center;padding:30px 80px 0;font-size:46px;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 48px 30px;font-size:58px;font-weight:700;letter-spacing:-.01em}
.top .r{display:flex;gap:46px}.top svg{width:66px;height:66px}
.hd{display:flex;align-items:center;gap:64px;padding:16px 48px 0}
.av{width:250px;height:250px;border-radius:50%;padding:9px;background:conic-gradient(#FF7A1A,#ffb347,#FF7A1A)}
.av div{width:100%;height:100%;border-radius:50%;border:7px solid #000;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.st{display:flex;flex:1;justify-content:space-around;text-align:center}.st b{display:block;font-size:50px;font-weight:700}.st span{font-size:40px}
.bio{padding:34px 48px 0;font-size:40px;line-height:1.38}.bio b{font-weight:600}.bio .cat{color:#a8a8a8}.bio a{color:#e0f1ff;font-weight:600;text-decoration:none}
.btns{display:flex;gap:16px;padding:36px 48px 0}.btns span{flex:1;height:96px;border-radius:22px;background:#262626;display:grid;place-items:center;font-size:40px;font-weight:600}.btns .f{background:#0095f6}
.btns .sm{flex:0 0 96px}
.hl{display:flex;gap:44px;padding:52px 48px 0;overflow:hidden}
.hl div{display:grid;justify-items:center;gap:16px;font-size:34px}
.hl i{width:180px;height:180px;border-radius:50%;border:3px solid #363636;padding:7px;display:block}
.hl img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.tb{display:flex;justify-content:space-around;margin-top:52px;border-bottom:1px solid #262626}.tb span{padding:28px 0;width:33%;display:grid;place-items:center;opacity:.5}.tb span.on{opacity:1;border-bottom:3px solid #fff}.tb svg{width:62px;height:62px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.g div{position:relative;aspect-ratio:3/4;overflow:hidden;background:#111}
.g img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.g svg{position:absolute;top:18px;right:18px;width:46px;height:46px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.nav{position:absolute;left:0;right:0;bottom:0;height:200px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:flex-start;padding-top:40px}.nav svg{width:72px;height:72px}
</style></head><body>
<div class="sb"><span>9:41</span><span>●●● 100%</span></div>
<div class="top"><span>investedia</span><span class="r"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></div>
<div class="hd"><div class="av"><div><svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#000"/><path d="M0 31 11 24.5l7 4.5 10-10 12 6.5V40H0z" fill="#1e1e21"/><path d="M0 28 11 21.5l7 4.5 10-10 12 6.5" fill="none" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<div class="st"><span><b>11</b>posts</span><span><b>0</b>followers</span><span><b>0</b>following</span></div></div>
<div class="bio"><b>Investedia</b><br><span class="cat">Financial service</span><br>Markets, made clear.<br>Live prices · Charts · News · Free tools<br>Not financial advice.<br><a>🔗 investedia.com</a></div>
<div class="btns"><span class="f">Follow</span><span>Message</span><span class="sm">⌄</span></div>
<div class="hl">
<div><i><img src="out/cv_start.png"></i>Start</div><div><i><img src="out/cv_markets.png"></i>Markets</div><div><i><img src="out/cv_tools.png"></i>Tools</div><div><i><img src="out/cv_learn.png"></i>Learn</div><div><i><img src="out/cv_news.png"></i>News</div><div><i><img src="out/cv_app.png"></i>App</div>
</div>
<div class="tb"><span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/></svg></span><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg></span></div>
<div class="g" id="g"></div>
<div class="nav">${''}</div>
<script>
const reel = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/></svg>', car = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>';
document.getElementById('g').innerHTML = [['p9'], ['p8'], ['p7'], ['p6'], ['p5'], ['p4'], ['c1', car], ['reel_cover', reel], ['p3']].map(([f, o]) => `<div><img src="out/${f}.png">${o || ''}</div>`).join('');
document.querySelector('.nav').innerHTML = ['<path d="M3 11 12 4l9 7v9H3z"/>', '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>', '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/>', '<circle cx="12" cy="12" r="9"/>'].map(p => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">${p}</svg>`).join('');
</script></body></html>
